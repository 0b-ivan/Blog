apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: blog-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: app
          image: ghcr.io/OWNER/APP:GIT_SHA
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: blog-staging
spec:
  selector:
    app: app
  ports:
    - name: http
      port: 80
      targetPort: http
