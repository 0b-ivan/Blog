apiVersion: v1
kind: Service
metadata:
  name: search
  namespace: blog-staging
spec:
  selector:
    app: search
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: blog
  namespace: blog-staging
spec:
  selector:
    app: blog
  ports:
    - name: http
      port: 80
      targetPort: http
