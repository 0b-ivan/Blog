---
- name: Install an exact K3s version reproducibly
  hosts: k3s_servers
  become: true
  vars:
    k3s_version: "v1.36.4+k3s1"
    k3s_install_script_ref: "4dedb15be78017a8ddd5b9e81acd44f3481078ed"
    k3s_install_url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_install_script_ref }}/install.sh"
    k3s_binary_path: /usr/local/bin/k3s

  tasks:
    - name: Read installed version
      ansible.builtin.command: "{{ k3s_binary_path }} --version"
      register: current
      changed_when: false
      failed_when: false

    - name: Download installer from pinned upstream commit
      ansible.builtin.get_url:
        url: "{{ k3s_install_url }}"
        dest: /usr/local/src/install-k3s.sh
        mode: "0755"
        force: true
      when: current.rc != 0 or k3s_version not in current.stdout

    - name: Install exact release
      ansible.builtin.command: /usr/local/src/install-k3s.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      when: current.rc != 0 or k3s_version not in current.stdout

    - name: Verify installed version
      ansible.builtin.command: "{{ k3s_binary_path }} --version"
      register: installed
      changed_when: false

    - name: Require exact pin
      ansible.builtin.assert:
        that:
          - k3s_version in installed.stdout
