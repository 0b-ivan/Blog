<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Redis: Die Session hat ein Ablaufdatum</title><desc id="desc">Eine Session mit 1800 Sekunden TTL wird über ihren Schlüssel gelesen.</desc><rect width="1400" height="760" rx="24" fill="#0c1722"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="56" y="79" fill="#e6eef5" font-size="36">Redis: Die Session hat ein Ablaufdatum</text><text x="56" y="127" fill="#9db1c3" font-size="18">DATENBANK-TELLERRAND  /  SCHEMATISCHE BEISPIELDATEN</text><rect x="56" y="210" width="390" height="235" rx="16" fill="#162634" stroke="#72d6cd" stroke-width="2"/><text x="80" y="253" fill="#72d6cd" font-size="29">Anmeldung</text><text x="80" y="301" fill="#e6eef5" font-size="24">Benutzer: 42</text><text x="80" y="341" fill="#e6eef5" font-size="24">Session-ID erzeugen</text><text x="460" y="340" fill="#9db1c3" font-size="35">→</text><rect x="506" y="210" width="390" height="235" rx="16" fill="#162634" stroke="#ffc878" stroke-width="2"/><text x="530" y="253" fill="#ffc878" font-size="29">Redis · Schlüssel</text><text x="530" y="301" fill="#e6eef5" font-size="24">session:abc123</text><text x="530" y="341" fill="#e6eef5" font-size="24">userId: 42 · TTL: 1800 s</text><text x="910" y="340" fill="#9db1c3" font-size="35">→</text><rect x="956" y="210" width="390" height="235" rx="16" fill="#162634" stroke="#b6a0f7" stroke-width="2"/><text x="980" y="253" fill="#b6a0f7" font-size="29">Weitere Anfrage</text><text x="980" y="301" fill="#e6eef5" font-size="24">Session vorhanden?</text><text x="980" y="341" fill="#e6eef5" font-size="24">Ja: Benutzer zuordnen</text><text x="56" y="548" fill="#72d6cd" font-size="28">Session fehlt oder ist abgelaufen → erneute Anmeldung verlangen</text><text x="56" y="617" fill="#b6c6d5" font-size="23">TTL ist eine Ablaufgrenze; Verdrängung oder Ausfälle können früher greifen.</text><text x="56" y="704" fill="#9db1c3" font-size="18">Eigene Darstellung · CC0 · keine Produktoberfläche</text></g></svg>
