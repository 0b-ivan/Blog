<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">DocumentDB: Gemeinsamer Katalog, andere Attribute</title><desc id="desc">Laptop und T-Shirt besitzen gemeinsame und unterschiedliche Dokumentfelder.</desc><rect width="1400" height="760" rx="24" fill="#0c1722"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="56" y="79" fill="#e6eef5" font-size="36">DocumentDB: Gemeinsamer Katalog, andere Attribute</text><text x="56" y="127" fill="#9db1c3" font-size="18">DATENBANK-TELLERRAND  /  SCHEMATISCHE BEISPIELDATEN</text><rect x="56" y="210" width="390" height="235" rx="16" fill="#162634" stroke="#72d6cd" stroke-width="2"/><text x="80" y="253" fill="#72d6cd" font-size="29">Produktkatalog</text><text x="80" y="301" fill="#e6eef5" font-size="24">Gemeinsam: type, name</text><text x="80" y="341" fill="#e6eef5" font-size="24">Dokumente statt Joins</text><text x="460" y="340" fill="#9db1c3" font-size="35">→</text><rect x="506" y="210" width="390" height="235" rx="16" fill="#162634" stroke="#ffc878" stroke-width="2"/><text x="530" y="253" fill="#ffc878" font-size="29">Laptop</text><text x="530" y="301" fill="#e6eef5" font-size="24">type: laptop</text><text x="530" y="341" fill="#e6eef5" font-size="24">cpu: Ryzen 7</text><text x="530" y="381" fill="#e6eef5" font-size="24">ram_gb: 32</text><text x="910" y="340" fill="#9db1c3" font-size="35">→</text><rect x="956" y="210" width="390" height="235" rx="16" fill="#162634" stroke="#b6a0f7" stroke-width="2"/><text x="980" y="253" fill="#b6a0f7" font-size="29">T-Shirt</text><text x="980" y="301" fill="#e6eef5" font-size="24">type: tshirt</text><text x="980" y="341" fill="#e6eef5" font-size="24">size: L</text><text x="980" y="381" fill="#e6eef5" font-size="24">color: Black</text><text x="56" y="548" fill="#72d6cd" font-size="28">Abfragen und Indizes bestimmen, ob dieses Modell zur Anwendung passt.</text><text x="56" y="617" fill="#b6c6d5" font-size="23">Unterschiedliche Attribute lassen sich auch mit MySQL-JSON abbilden.</text><text x="56" y="704" fill="#9db1c3" font-size="18">Eigene Darstellung · CC0 · keine Produktoberfläche</text></g></svg>
