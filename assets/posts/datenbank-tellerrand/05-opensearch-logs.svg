<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">OpenSearch: Von Logs zur Fehleranalyse</title><desc id="desc">Logs werden indexiert und anhand von Request-ID und Status durchsucht.</desc><rect width="1400" height="760" rx="24" fill="#0c1722"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="56" y="79" fill="#e6eef5" font-size="36">OpenSearch: Von Logs zur Fehleranalyse</text><text x="56" y="127" fill="#9db1c3" font-size="18">DATENBANK-TELLERRAND  /  SCHEMATISCHE BEISPIELDATEN</text><rect x="56" y="210" width="390" height="235" rx="16" fill="#162634" stroke="#72d6cd" stroke-width="2"/><text x="80" y="253" fill="#72d6cd" font-size="29">Log-Pipeline</text><text x="80" y="301" fill="#e6eef5" font-size="24">Web API + Worker</text><text x="80" y="341" fill="#e6eef5" font-size="24">Logs aufbereiten</text><text x="460" y="340" fill="#9db1c3" font-size="35">→</text><rect x="506" y="210" width="390" height="235" rx="16" fill="#162634" stroke="#ffc878" stroke-width="2"/><text x="530" y="253" fill="#ffc878" font-size="29">Suchindex</text><text x="530" y="301" fill="#e6eef5" font-size="24">request_id: req-42</text><text x="530" y="341" fill="#e6eef5" font-size="24">status: 500</text><text x="530" y="381" fill="#e6eef5" font-size="24">service: checkout</text><text x="910" y="340" fill="#9db1c3" font-size="35">→</text><rect x="956" y="210" width="390" height="235" rx="16" fill="#162634" stroke="#b6a0f7" stroke-width="2"/><text x="980" y="253" fill="#b6a0f7" font-size="29">Suche und Aggregation</text><text x="980" y="301" fill="#e6eef5" font-size="24">Filter: req-42 + 500</text><text x="980" y="341" fill="#e6eef5" font-size="24">Treffer: checkout</text><text x="980" y="381" fill="#e6eef5" font-size="24">Fehler über Zeit zählen</text><text x="56" y="548" fill="#72d6cd" font-size="28">Indexieren → Refresh → für Suchanfragen sichtbar</text><text x="56" y="617" fill="#b6c6d5" font-size="23">Schematische Beispieldaten; kein Screenshot einer AWS-Konsole.</text><text x="56" y="704" fill="#9db1c3" font-size="18">Eigene Darstellung · CC0 · keine Produktoberfläche</text></g></svg>
