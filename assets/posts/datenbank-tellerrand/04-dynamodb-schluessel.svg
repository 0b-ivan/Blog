<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">DynamoDB: Der Zugriff beginnt beim Schlüssel</title><desc id="desc">Partition Key und Sort Key identifizieren den Spielstand ohne vollständigen Scan.</desc><rect width="1400" height="760" rx="24" fill="#0c1722"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="56" y="79" fill="#e6eef5" font-size="36">DynamoDB: Der Zugriff beginnt beim Schlüssel</text><text x="56" y="127" fill="#9db1c3" font-size="18">DATENBANK-TELLERRAND  /  SCHEMATISCHE BEISPIELDATEN</text><rect x="56" y="210" width="390" height="235" rx="16" fill="#162634" stroke="#72d6cd" stroke-width="2"/><text x="80" y="253" fill="#72d6cd" font-size="29">Zugriffsmuster</text><text x="80" y="301" fill="#e6eef5" font-size="24">Spielstand laden</text><text x="80" y="341" fill="#e6eef5" font-size="24">für Spieler 42</text><text x="460" y="340" fill="#9db1c3" font-size="35">→</text><rect x="506" y="210" width="390" height="235" rx="16" fill="#162634" stroke="#ffc878" stroke-width="2"/><text x="530" y="253" fill="#ffc878" font-size="29">Zusammengesetzter Key</text><text x="530" y="301" fill="#e6eef5" font-size="24">PK: PLAYER#42</text><text x="530" y="341" fill="#e6eef5" font-size="24">SK: SAVE#MAIN</text><text x="910" y="340" fill="#9db1c3" font-size="35">→</text><rect x="956" y="210" width="390" height="235" rx="16" fill="#162634" stroke="#b6a0f7" stroke-width="2"/><text x="980" y="253" fill="#b6a0f7" font-size="29">Gefundenes Item</text><text x="980" y="301" fill="#e6eef5" font-size="24">level: 15 · gold: 850</text><text x="980" y="341" fill="#e6eef5" font-size="24">location: Dark Forest</text><text x="56" y="548" fill="#72d6cd" font-size="28">GetItem mit PK + SK → genau der gewünschte Spielstand</text><text x="56" y="617" fill="#b6c6d5" font-size="23">Weitere Zugriffsmuster können zusätzliche Indizes erfordern.</text><text x="56" y="704" fill="#9db1c3" font-size="18">Eigene Darstellung · CC0 · keine Produktoberfläche</text></g></svg>
