<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Zeitleiste der frühen Pac-Man-Versionen 1980</title>
  <desc id="desc">Vom ersten Location-Test als Puck Man am 22. Mai 1980 über die japanische Veröffentlichung im Juli bis zum US-Start als Pac-Man im Oktober.</desc>
  <rect width="1200" height="520" rx="32" fill="#111827"/>
  <text x="70" y="82" fill="#f9fafb" font-family="system-ui, sans-serif" font-size="38" font-weight="700">1980: Von PUCK MAN zu PAC-MAN</text>
  <line x1="130" y1="260" x2="1070" y2="260" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <circle cx="210" cy="260" r="28" fill="#facc15"/>
  <circle cx="600" cy="260" r="28" fill="#facc15"/>
  <circle cx="990" cy="260" r="28" fill="#facc15"/>
  <text x="210" y="155" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="30" font-weight="700">22. Mai</text>
  <text x="210" y="195" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="26">Location-Test</text>
  <text x="210" y="335" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="28" font-weight="700">PUCK MAN</text>
  <text x="210" y="375" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="23">Shibuya, Tokio</text>
  <text x="600" y="155" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="30" font-weight="700">Juli</text>
  <text x="600" y="195" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="26">Japan-Release</text>
  <text x="600" y="335" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="28" font-weight="700">PUCK MAN</text>
  <text x="600" y="375" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="23">Namco</text>
  <text x="990" y="155" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="30" font-weight="700">Oktober</text>
  <text x="990" y="195" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="26">US-Start</text>
  <text x="990" y="335" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="28" font-weight="700">PAC-MAN</text>
  <text x="990" y="375" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="23">Namco / Midway</text>
  <text x="600" y="458" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="21">Der Name änderte sich – das zentrale Spielprinzip blieb dasselbe.</text>
</svg>