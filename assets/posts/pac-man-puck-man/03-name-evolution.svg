<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Namensweg von paku paku zu Pac-Man</title>
  <desc id="desc">Die sprachliche Entwicklung führt von paku paku über den japanischen Namen Pakku Man zur frühen Schreibweise Puck Man und schließlich zu Pac-Man.</desc>
  <rect width="1200" height="560" rx="32" fill="#111827"/>
  <text x="600" y="76" text-anchor="middle" fill="#f9fafb" font-family="system-ui, sans-serif" font-size="38" font-weight="700">Der Weg des Namens</text>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="55" y="170" width="235" height="150" rx="24" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <text x="172" y="225" fill="#facc15" font-size="34" font-weight="700">パクパク</text>
    <text x="172" y="270" fill="#fff" font-size="27">paku paku</text>
    <text x="172" y="302" fill="#94a3b8" font-size="19">Essbewegung</text>

    <rect x="350" y="170" width="235" height="150" rx="24" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <text x="467" y="225" fill="#facc15" font-size="34" font-weight="700">パックマン</text>
    <text x="467" y="270" fill="#fff" font-size="27">Pakku Man</text>
    <text x="467" y="302" fill="#94a3b8" font-size="19">japanischer Name</text>

    <rect x="645" y="170" width="235" height="150" rx="24" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <text x="762" y="245" fill="#facc15" font-size="34" font-weight="700">PUCK MAN</text>
    <text x="762" y="292" fill="#94a3b8" font-size="19">frühe lateinische Schreibweise</text>

    <rect x="940" y="170" width="205" height="150" rx="24" fill="#1e293b" stroke="#facc15" stroke-width="4"/>
    <text x="1042" y="245" fill="#facc15" font-size="34" font-weight="800">PAC-MAN</text>
    <text x="1042" y="292" fill="#94a3b8" font-size="19">internationale Marke</text>
  </g>
  <g stroke="#64748b" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 245 H335"/><path d="M325 232 L340 245 L325 258"/>
    <path d="M595 245 H630"/><path d="M620 232 L635 245 L620 258"/>
    <path d="M890 245 H925"/><path d="M915 232 L930 245 L915 258"/>
  </g>
  <text x="600" y="405" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="25">Kein Hockey-Begriff, sondern eine sprachliche Spur vom Essen zum Markennamen.</text>
  <text x="600" y="452" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="21">Für den US-Markt wurde PUCK MAN zu PAC-MAN; danach setzte sich die neue Schreibweise weltweit durch.</text>
</svg>