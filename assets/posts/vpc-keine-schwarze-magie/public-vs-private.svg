<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Public und Private Routing</title><desc id="desc">Vergleich des Netzwerkwegs aus einem Public Subnet über ein Internet Gateway und aus einem Private Subnet über NAT.</desc><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.h{font-size:21px;font-weight:700}.s{font-size:17px}.p{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.q{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.n{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.net{fill:#f8fafc;stroke:#64748b;stroke-width:2}.a{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><text x="50" y="55" class="t">Public vs. Private: Der Unterschied steckt im Netzwerkweg</text><rect x="55" y="105" width="260" height="100" rx="15" class="p"/><text x="80" y="145" class="h">Public Subnet</text><text x="80" y="178" class="s">0.0.0.0/0 → IGW</text><rect x="470" y="105" width="260" height="100" rx="15" class="n"/><text x="500" y="145" class="h">Internet Gateway</text><text x="500" y="178" class="s">Weg zum/vom Internet</text><rect x="900" y="165" width="235" height="100" rx="50" class="net"/><text x="975" y="225" class="h">Internet</text><path d="M315 155 H470" class="a"/><path d="M730 155 C820 155 815 205 900 205" class="a"/><rect x="55" y="285" width="260" height="100" rx="15" class="q"/><text x="80" y="325" class="h">Private Subnet</text><text x="80" y="358" class="s">0.0.0.0/0 → NAT</text><rect x="470" y="285" width="260" height="100" rx="15" class="n"/><text x="510" y="325" class="h">NAT Gateway</text><text x="500" y="358" class="s">Verbindungen nach draußen</text><path d="M315 335 H470" class="a"/><path d="M730 335 C820 335 815 245 900 245" class="a"/></svg>