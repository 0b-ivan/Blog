<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">VPC Troubleshooting Reihenfolge</title><desc id="desc">Pragmatische Reihenfolge von DNS über Security und Routing bis zur Anwendung.</desc><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.h{font-size:18px;font-weight:700}.b{fill:#f8fafc;stroke:#64748b;stroke-width:2}.a{stroke:#475569;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><text x="45" y="55" class="t">Wenn nichts geht: den Traffic Schritt für Schritt verfolgen</text><g><rect x="45" y="120" width="120" height="70" rx="14" class="b"/><text x="83" y="163" class="h">DNS</text><rect x="205" y="120" width="120" height="70" rx="14" class="b"/><text x="255" y="163" class="h">IP</text><rect x="365" y="120" width="160" height="70" rx="14" class="b"/><text x="387" y="163" class="h">SG / NACL</text><rect x="565" y="120" width="165" height="70" rx="14" class="b"/><text x="587" y="163" class="h">Route Table</text><rect x="770" y="120" width="200" height="70" rx="14" class="b"/><text x="795" y="163" class="h">IGW / NAT / VPCE</text><rect x="1010" y="120" width="145" height="70" rx="14" class="b"/><text x="1031" y="163" class="h">Anwendung</text><path d="M165 155 H205" class="a"/><path d="M325 155 H365" class="a"/><path d="M525 155 H565" class="a"/><path d="M730 155 H770" class="a"/><path d="M970 155 H1010" class="a"/></g><text x="45" y="245" class="h">Nicht raten. Herausfinden, an welcher Stelle der Netzwerkweg abbricht.</text></svg>