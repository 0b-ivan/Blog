<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">VPC Überblick</title><desc id="desc">VPC mit Public und Private Subnet, Route Tables, Internet Gateway, NAT Gateway und VPC Endpoint.</desc><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.h{font-size:22px;font-weight:700}.s{font-size:17px}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2}.vpc{fill:none;stroke:#334155;stroke-width:3}.public{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.private{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.route{fill:#fff;stroke:#94a3b8;stroke-width:2}.aws{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><rect x="25" y="25" width="1150" height="470" rx="22" class="vpc"/><text x="55" y="70" class="t">VPC = dein virtuelles Netzwerk</text><rect x="70" y="115" width="300" height="135" rx="16" class="public"/><text x="95" y="155" class="h">Public Subnet</text><text x="95" y="190" class="s">Route: 0.0.0.0/0 → IGW</text><text x="95" y="220" class="s">z. B. Load Balancer / NAT</text><rect x="70" y="315" width="300" height="135" rx="16" class="private"/><text x="95" y="355" class="h">Private Subnet</text><text x="95" y="390" class="s">Route: 0.0.0.0/0 → NAT</text><text x="95" y="420" class="s">z. B. Anwendung / Datenbank</text><rect x="465" y="125" width="235" height="105" rx="14" class="route"/><text x="490" y="165" class="h">Route Table</text><text x="490" y="198" class="s">Wo geht Traffic hin?</text><rect x="465" y="325" width="235" height="105" rx="14" class="route"/><text x="490" y="365" class="h">Route Table</text><text x="490" y="398" class="s">Wo geht Traffic hin?</text><rect x="805" y="105" width="270" height="90" rx="14" class="aws"/><text x="835" y="145" class="h">Internet Gateway</text><text x="835" y="175" class="s">VPC ↔ Internet</text><rect x="805" y="235" width="270" height="90" rx="14" class="aws"/><text x="835" y="275" class="h">NAT Gateway</text><text x="835" y="305" class="s">Private Ressourcen → raus</text><rect x="805" y="365" width="270" height="90" rx="14" class="aws"/><text x="835" y="405" class="h">VPC Endpoint</text><text x="835" y="435" class="s">AWS ohne Internet-Umweg</text><path d="M370 180 H465" class="line"/><path d="M700 178 H805" class="line"/><path d="M370 380 H465" class="line"/><path d="M700 378 C750 378 750 280 805 280" class="line"/><path d="M700 400 C750 400 760 410 805 410" class="line"/></svg>