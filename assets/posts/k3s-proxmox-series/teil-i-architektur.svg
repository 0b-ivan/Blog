 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b1838"/></marker></defs><line x1="304" y1="375" x2="324" y2="375" stroke="#0b1838" stroke-width="3" marker-end="url(#arr)"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b1838"/></marker></defs><line x1="606" y1="375" x2="626" y2="375" stroke="#0b1838" stroke-width="3" marker-end="url(#arr)"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b1838"/></marker></defs><line x1="908" y1="375" x2="928" y2="375" stroke="#0b1838" stroke-width="3" marker-end="url(#arr)"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b1838"/></marker></defs><line x1="1210" y1="375" x2="1230" y2="375" stroke="#0b1838" stroke-width="3" marker-end="url(#arr)"/><rect x="28" y="660" width="730" height="300" rx="18" fill="#effbf3" stroke="#9bd8ae" stroke-width="2"/>
 <circle cx="56" cy="690" r="18" fill="#0d5b2a"/><text x="56" y="696" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">✓</text>
 <text x="86" y="698" font-size="24" font-weight="800" fill="#0d5b2a">Stand am Ende von Teil I</text><text x="52" y="730" font-size="18" font-weight="800" fill="#159447">✓</text>
   <text x="80" y="730" class="body">VM erstellt und intern erreichbar</text><text x="52" y="761" font-size="18" font-weight="800" fill="#159447">✓</text>
   <text x="80" y="761" class="body">K3s läuft</text><text x="52" y="792" font-size="18" font-weight="800" fill="#159447">✓</text>
   <text x="80" y="792" class="body">Blog + Kernel Grep laufen</text><text x="52" y="823" font-size="18" font-weight="800" fill="#159447">✓</text>
