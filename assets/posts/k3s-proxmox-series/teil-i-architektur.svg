   <text x="80" y="947" class="body">Secrets / Backup / Monitoring → Teil III</text><rect x="780" y="660" width="728" height="300" rx="18" fill="#f1f7ff" stroke="#b8d6ff" stroke-width="2"/>
 <circle cx="808" cy="690" r="18" fill="#1552a0"/><text x="808" y="696" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">i</text>
 <text x="838" y="698" font-size="24" font-weight="800" fill="#1552a0">Wichtige Punkte</text><text x="804" y="730" font-size="18" font-weight="800" fill="#1552a0">•</text>
   <text x="832" y="730" class="body">Teil I endet bewusst beim funktionierenden Staging.</text><text x="804" y="761" font-size="18" font-weight="800" fill="#1552a0">•</text>
   <text x="832" y="761" class="body">GitOps ist hier noch nicht umgesetzt.</text><text x="804" y="792" font-size="18" font-weight="800" fill="#1552a0">•</text>
   <text x="832" y="792" class="body">Cloudflare braucht keine eingehende Portfreigabe.</text><text x="804" y="823" font-size="18" font-weight="800" fill="#1552a0">•</text>
   <text x="832" y="823" class="body">Production bleibt auf Hetzner + Docker Compose.</text><text x="804" y="854" font-size="18" font-weight="800" fill="#1552a0">•</text>
   <text x="832" y="854" class="body">Die nächste Baustelle ist der Deployment-Weg.</text><text x="804" y="885" font-size="18" font-weight="800" fill="#1552a0">•</text>
   <text x="832" y="885" class="body">Begriffe werden im jeweiligen Teil eingeführt.</text></svg>