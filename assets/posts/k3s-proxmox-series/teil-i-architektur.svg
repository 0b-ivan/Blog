 <text x="384" y="149" class="cardTitle">K3s auf der VM</text></g><rect x="342" y="173" width="248" height="130" rx="12" fill="#ffffff" stroke="#b8d6ff" stroke-width="1.5"/><circle cx="372" cy="203" r="20" fill="#2563eb"/><text x="372" y="209" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">K3s</text><text x="404" y="204" class="cardTitle">K3s</text><text x="404" y="231" class="body">Single-Node</text><text x="404" y="255" class="body">API nur intern</text><rect x="342" y="317" width="248" height="170" rx="12" fill="#ffffff" stroke="#b8d6ff" stroke-width="1.5"/><text x="360" y="348" class="cardTitle">Grundsetup</text><text x="360" y="375" class="body">QEMU Guest Agent</text><text x="360" y="399" class="body">Traefik aus</text><text x="360" y="423" class="body">ServiceLB aus</text><text x="360" y="447" class="body">Secrets Encryption an</text><text x="352" y="530" class="muted">Noch kein GitOps.</text><text x="352" y="555" class="muted">Deployments werden hier noch</text><text x="352" y="580" class="muted">manuell angestoßen.</text><g><rect x="632" y="115" width="272" height="520" rx="18" fill="#f3f8ff" stroke="#b8d6ff" stroke-width="2"/>
