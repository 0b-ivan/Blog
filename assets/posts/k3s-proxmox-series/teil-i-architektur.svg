 <text x="1508" y="66" text-anchor="end" class="small">Homelab · Proxmox · K3s · Staging</text><g><rect x="28" y="115" width="272" height="520" rx="18" fill="#f3f8ff" stroke="#b8d6ff" stroke-width="2"/>
