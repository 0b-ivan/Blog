 <text x="82" y="149" class="cardTitle">Infrastruktur</text></g><rect x="40" y="173" width="248" height="130" rx="12" fill="#ffffff" stroke="#b8d6ff" stroke-width="1.5"/><circle cx="70" cy="203" r="20" fill="#ef6c00"/><text x="70" y="209" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">PVE</text><text x="102" y="204" class="cardTitle">Proxmox Host</text><text x="102" y="231" class="body">wgz-pve-01</text><text x="102" y="255" class="body">VM: k3s-blog-01</text><rect x="40" y="317" width="248" height="220" rx="12" fill="#ffffff" stroke="#b8d6ff" stroke-width="1.5"/><circle cx="70" cy="347" r="20" fill="#1552a0"/><text x="70" y="353" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">VM</text><text x="102" y="348" class="cardTitle">VM</text><text x="102" y="375" class="body">Debian 13</text><text x="102" y="399" class="body">2 vCPU · 4 GB RAM</text><text x="102" y="423" class="body">32 GB Disk</text><text x="102" y="447" class="body">internes Service-Netz</text><text x="102" y="471" class="body">keine öffentliche IP</text><text x="50" y="570" class="muted">Ziel: saubere interne Basis</text><text x="50" y="595" class="muted">ohne Portfreigabe.</text><g><rect x="330" y="115" width="272" height="520" rx="18" fill="#f3f8ff" stroke="#b8d6ff" stroke-width="2"/>
