 <text x="28" y="52" class="h1">K3s auf Proxmox – Teil III</text>
 <text x="28" y="88" class="sub">Secrets mit SOPS/age und reproduzierbarer Betrieb</text>
 <text x="1508" y="38" text-anchor="end" font-size="18" font-weight="800" fill="#0b1838">blog.obivan.org</text>
 <text x="1508" y="66" text-anchor="end" class="small">Homelab · SOPS · Flux · Security</text><g><rect x="28" y="115" width="272" height="520" rx="18" fill="#f3f8ff" stroke="#b8d6ff" stroke-width="2"/>
 <circle cx="53" cy="142" r="17" fill="#0b1838"/><text x="53" y="149" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">1</text>
 <text x="82" y="149" class="cardTitle">Secrets in Git</text></g><rect x="40" y="173" width="248" height="105" rx="12" fill="#ffffff" stroke="#b8d6ff" stroke-width="1.5"/><circle cx="70" cy="203" r="20" fill="#0b1838"/><text x="70" y="209" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">GIT</text><text x="102" y="204" class="cardTitle">Repository</text><text x="102" y="231" class="body">staging</text><text x="102" y="255" class="body">secrets/*.sops.yaml</text><rect x="40" y="292" width="248" height="135" rx="12" fill="#ffffff" stroke="#b8d6ff" stroke-width="1.5"/><text x="58" y="323" class="cardTitle">SOPS</text><text x="58" y="350" class="body">verschlüsselt Secret-Werte</text><text x="58" y="374" class="body">Datei bleibt versionierbar</text><text x="58" y="398" class="body">kein Klartext in Git</text><rect x="40" y="439" width="248" height="110" rx="12" fill="#ffffff" stroke="#b8d6ff" stroke-width="1.5"/><text x="58" y="470" class="cardTitle">age</text><text x="58" y="497" class="body">öffentlicher Empfänger</text><text x="58" y="521" class="body">zum Verschlüsseln</text><text x="50" y="597" class="muted">SOPS ist das Werkzeug,</text><text x="50" y="622" class="muted">age liefert die Schlüssel.</text><g><rect x="330" y="115" width="272" height="520" rx="18" fill="#f3f8ff" stroke="#b8d6ff" stroke-width="2"/>
 <circle cx="355" cy="142" r="17" fill="#0b1838"/><text x="355" y="149" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">2</text>
 <text x="384" y="149" class="cardTitle">Flux holt Änderungen</text></g><rect x="342" y="173" width="248" height="120" rx="12" fill="#ffffff" stroke="#b8d6ff" stroke-width="1.5"/><circle cx="372" cy="203" r="20" fill="#2563eb"/><text x="372" y="209" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">FLUX</text><text x="404" y="204" class="cardTitle">GitRepository</text><text x="404" y="231" class="body">Flux läuft in K3s</text><text x="404" y="255" class="body">liest staging regelmäßig</text><rect x="342" y="305" width="248" height="120" rx="12" fill="#ffffff" stroke="#b8d6ff" stroke-width="1.5"/><text x="360" y="336" class="cardTitle">Reconcile</text><text x="360" y="363" class="body">Änderung erkennen</text><text x="360" y="387" class="body">Manifest laden</text><text x="360" y="411" class="body">Sollzustand anwenden</text><rect x="342" y="437" width="248" height="115" rx="12" fill="#ffffff" stroke="#b8d6ff" stroke-width="1.5"/><text x="360" y="468" class="cardTitle">Wichtig</text><text x="360" y="495" class="body">Git enthält verschlüsselte Werte</text><text x="360" y="519" class="body">nicht den Secret-Klartext</text><text x="352" y="600" class="muted">Automatisch nach der</text><text x="352" y="625" class="muted">einmaligen Einrichtung.</text><g><rect x="632" y="115" width="272" height="520" rx="18" fill="#f3f8ff" stroke="#b8d6ff" stroke-width="2"/>
 <circle cx="657" cy="142" r="17" fill="#0b1838"/><text x="657" y="149" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">3</text>
 <text x="686" y="149" class="cardTitle">SOPS entschlüsseln</text></g><rect x="644" y="173" width="248" height="150" rx="12" fill="#ffffff" stroke="#b8d6ff" stroke-width="1.5"/><circle cx="674" cy="203" r="20" fill="#2563eb"/><text x="674" y="209" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">CFG</text><text x="706" y="204" class="cardTitle">Flux Kustomization</text><text x="706" y="231" class="body">decryption: sops</text><text x="706" y="255" class="body">secretRef: sops-age</text><text x="706" y="279" class="body">Entschlüsselung beim Apply</text><rect x="644" y="335" width="248" height="125" rx="12" fill="#ffffff" stroke="#b8d6ff" stroke-width="1.5"/><text x="662" y="366" class="cardTitle">Im Cluster</text><text x="662" y="393" class="body">Klartext nur zur Laufzeit</text><text x="662" y="417" class="body">danach normales K8s Secret</text><rect x="644" y="472" width="248" height="90" rx="12" fill="#ffffff" stroke="#b8d6ff" stroke-width="1.5"/><text x="662" y="503" class="cardTitle">Bootstrap</text><text x="662" y="530" class="body">einmalig Decryption aktivieren</text><text x="654" y="605" class="muted">Das ist der Henne-Ei-Punkt</text><text x="654" y="630" class="muted">beim ersten Rollout.</text><g><rect x="934" y="115" width="272" height="520" rx="18" fill="#f0fbf4" stroke="#9bd8ae" stroke-width="2"/>
 <circle cx="959" cy="142" r="17" fill="#0d5b2a"/><text x="959" y="149" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">4</text>
 <text x="988" y="149" class="cardTitle">age-Key</text></g><rect x="946" y="173" width="248" height="110" rx="12" fill="#ffffff" stroke="#9bd8ae" stroke-width="1.5"/><circle cx="976" cy="203" r="20" fill="#159447"/><text x="976" y="209" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">PUB</text><text x="1008" y="204" class="cardTitle">Öffentlicher Schlüssel</text><text x="1008" y="231" class="body">darf in Git stehen</text><text x="1008" y="255" class="body">verschlüsselt</text><rect x="946" y="295" width="248" height="125" rx="12" fill="#ffffff" stroke="#9bd8ae" stroke-width="1.5"/><circle cx="976" cy="325" r="20" fill="#0d5b2a"/><text x="976" y="331" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">KEY</text><text x="1008" y="326" class="cardTitle">Privater Schlüssel</text><text x="1008" y="353" class="body">Secret: flux-system/sops-age</text><text x="1008" y="377" class="body">entschlüsselt</text><text x="1008" y="401" class="body">nicht in Git</text><rect x="946" y="432" width="248" height="110" rx="12" fill="#ffffff" stroke="#9bd8ae" stroke-width="1.5"/><text x="964" y="463" class="cardTitle">Backup</text><text x="964" y="490" class="body">private Identity zusätzlich</text><text x="964" y="514" class="body">sicher außerhalb Cluster</text><text x="956" y="595" class="muted">Cluster-Secret allein ist</text><text x="956" y="620" class="muted">kein Disaster-Recovery-Plan.</text><g><rect x="1236" y="115" width="272" height="520" rx="18" fill="#f8f3ff" stroke="#cfb6ff" stroke-width="2"/>
 <circle cx="1261" cy="142" r="17" fill="#442077"/><text x="1261" y="149" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">5</text>
 <text x="1290" y="149" class="cardTitle">Anwendung im Cluster</text></g><rect x="1248" y="173" width="248" height="110" rx="12" fill="#ffffff" stroke="#cfb6ff" stroke-width="1.5"/><circle cx="1278" cy="203" r="20" fill="#7c3aed"/><text x="1278" y="209" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">APP</text><text x="1310" y="204" class="cardTitle">blog-staging</text><text x="1310" y="231" class="body">Secret: ghcr-pull</text><text x="1310" y="255" class="body">Blog + Search</text><rect x="1248" y="295" width="248" height="110" rx="12" fill="#ffffff" stroke="#cfb6ff" stroke-width="1.5"/><circle cx="1278" cy="325" r="20" fill="#7c3aed"/><text x="1278" y="331" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">CF</text><text x="1310" y="326" class="cardTitle">cloudflare</text><text x="1310" y="353" class="body">Secret: cloudflared-token</text><text x="1310" y="377" class="body">cloudflared läuft</text><rect x="1248" y="417" width="248" height="105" rx="12" fill="#ffffff" stroke="#cfb6ff" stroke-width="1.5"/><text x="1266" y="448" class="cardTitle">Offen: RBAC</text><text x="1266" y="475" class="body">Rollen/Rechte prüfen</text><text x="1266" y="499" class="body">RBAC für Secret-Offen: RBAC</text><rect x="1248" y="534" width="248" height="78" rx="12" fill="#ffffff" stroke="#ffc98b" stroke-width="1.5"/><circle cx="1278" cy="564" r="20" fill="#f59e0b"/><text x="1278" y="570" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">→</text><text x="1310" y="565" class="cardTitle">Nächster Test</text><text x="1310" y="592" class="body">Restore statt nur Backup</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b1838"/></marker></defs><line x1="304" y1="375" x2="324" y2="375" stroke="#0b1838" stroke-width="3" marker-end="url(#arr)"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b1838"/></marker></defs><line x1="606" y1="375" x2="626" y2="375" stroke="#0b1838" stroke-width="3" marker-end="url(#arr)"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b1838"/></marker></defs><line x1="908" y1="375" x2="928" y2="375" stroke="#0b1838" stroke-width="3" marker-end="url(#arr)"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b1838"/></marker></defs><line x1="1210" y1="375" x2="1230" y2="375" stroke="#0b1838" stroke-width="3" marker-end="url(#arr)"/><rect x="28" y="660" width="730" height="300" rx="18" fill="#effbf3" stroke="#9bd8ae" stroke-width="2"/>
 <circle cx="56" cy="690" r="18" fill="#0d5b2a"/><text x="56" y="696" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">✓</text>
 <text x="86" y="698" font-size="24" font-weight="800" fill="#0d5b2a">Aktueller Stand in Teil III</text><text x="52" y="730" font-size="18" font-weight="800" fill="#159447">✓</text>
   <text x="80" y="730" class="body">K3s-Version + Installer reproduzierbar gepinnt</text><text x="52" y="761" font-size="18" font-weight="800" fill="#159447">✓</text>
   <text x="80" y="761" class="body">SOPS + age eingerichtet</text><text x="52" y="792" font-size="18" font-weight="800" fill="#159447">✓</text>
   <text x="80" y="792" class="body">Flux Decryption aktiv</text><text x="52" y="823" font-size="18" font-weight="800" fill="#159447">✓</text>
   <text x="80" y="823" class="body">GHCR- und Cloudflare-Secrets verschlüsselt in Git</text><text x="52" y="854" font-size="18" font-weight="800" fill="#159447">✓</text>
   <text x="80" y="854" class="body">CI prüft auf versehentliche Klartext-Secrets</text><text x="52" y="885" font-size="18" font-weight="800" fill="#f59e0b">○</text>
   <text x="80" y="885" class="body">Restore-Test wirklich durchführen</text><text x="52" y="916" font-size="18" font-weight="800" fill="#f59e0b">○</text>
   <text x="80" y="916" class="body">Off-cluster Backup + Retention festlegen</text><text x="52" y="947" font-size="18" font-weight="800" fill="#f59e0b">○</text>
   <text x="80" y="947" class="body">Monitoring / Alerting ergänzen</text><rect x="780" y="660" width="728" height="300" rx="18" fill="#f1f7ff" stroke="#b8d6ff" stroke-width="2"/>
 <circle cx="808" cy="690" r="18" fill="#1552a0"/><text x="808" y="696" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">i</text>
 <text x="838" y="698" font-size="24" font-weight="800" fill="#1552a0">Wichtige Sicherheitsbegriffe</text><text x="804" y="730" font-size="18" font-weight="800" fill="#1552a0">•</text>
   <text x="832" y="730" class="body">SOPS = verschlüsselt Werte in YAML/JSON.</text><text x="804" y="761" font-size="18" font-weight="800" fill="#1552a0">•</text>
   <text x="832" y="761" class="body">age = Schlüsselverfahren für Ver- und Entschlüsselung.</text><text x="804" y="792" font-size="18" font-weight="800" fill="#1552a0">•</text>
   <text x="832" y="792" class="body">Bootstrap = einmalige Startkonfiguration.</text><text x="804" y="823" font-size="18" font-weight="800" fill="#1552a0">•</text>
   <text x="832" y="823" class="body">RBAC = Rollen/Rechte prüfen nach Rollen.</text><text x="804" y="854" font-size="18" font-weight="800" fill="#1552a0">•</text>
   <text x="832" y="854" class="body">Privater age-Key gehört nie ins Repository.</text><text x="804" y="885" font-size="18" font-weight="800" fill="#1552a0">•</text>
   <text x="832" y="885" class="body">Ein Backup zählt erst nach einem erfolgreichen Restore-Test.</text></svg>