 <text x="28" y="52" class="h1">K3s auf Proxmox – Teil II</text>
 <text x="28" y="88" class="sub">Staging mit Flux und GitOps automatisieren</text>
 <text x="1508" y="38" text-anchor="end" font-size="18" font-weight="800" fill="#0b1838">blog.obivan.org</text>
 <text x="1508" y="66" text-anchor="end" class="small">Homelab · GitOps · Flux · Staging</text><g><rect x="28" y="115" width="272" height="520" rx="18" fill="#f3f8ff" stroke="#b8d6ff" stroke-width="2"/>
 <circle cx="53" cy="142" r="17" fill="#0b1838"/><text x="53" y="149" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">1</text>
 <text x="82" y="149" class="cardTitle">Änderung in Git</text></g><rect x="40" y="173" width="248" height="105" rx="12" fill="#ffffff" stroke="#b8d6ff" stroke-width="1.5"/><circle cx="70" cy="203" r="20" fill="#0b1838"/><text x="70" y="209" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">GIT</text><text x="102" y="204" class="cardTitle">Feature / Obsidian</text><text x="102" y="231" class="body">Änderung entsteht</text><text x="102" y="255" class="body">im eigenen Branch</text><rect x="40" y="292" width="248" height="120" rx="12" fill="#ffffff" stroke="#b8d6ff" stroke-width="1.5"/><text x="58" y="323" class="cardTitle">Pull Request</text><text x="58" y="350" class="body">Ziel: staging</text><text x="58" y="374" class="body">CI muss grün sein</text><text x="58" y="398" class="body">kein direkter Deploy</text><rect x="40" y="427" width="248" height="120" rx="12" fill="#ffffff" stroke="#b8d6ff" stroke-width="1.5"/><text x="58" y="458" class="cardTitle">Git-SHA</text><text x="58" y="485" class="body">eindeutige Commit-ID</text><text x="58" y="509" class="body">wird später Image-Tag</text><text x="50" y="595" class="muted">Git ist die Quelle für</text><text x="50" y="620" class="muted">Code und gewünschten Zustand.</text><g><rect x="330" y="115" width="272" height="520" rx="18" fill="#f3f8ff" stroke="#b8d6ff" stroke-width="2"/>
 <circle cx="355" cy="142" r="17" fill="#0b1838"/><text x="355" y="149" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">2</text>
 <text x="384" y="149" class="cardTitle">GitHub Actions baut</text></g><rect x="342" y="173" width="248" height="120" rx="12" fill="#ffffff" stroke="#b8d6ff" stroke-width="1.5"/><circle cx="372" cy="203" r="20" fill="#2563eb"/><text x="372" y="209" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">CI</text><text x="404" y="204" class="cardTitle">Checks</text><text x="404" y="231" class="body">Lint · Tests · Content</text><text x="404" y="255" class="body">nur bei Erfolg weiter</text><rect x="342" y="305" width="248" height="120" rx="12" fill="#ffffff" stroke="#b8d6ff" stroke-width="1.5"/><text x="360" y="336" class="cardTitle">Images</text><text x="360" y="363" class="body">Blog + Kernel Grep</text><text x="360" y="387" class="body">Push nach GHCR</text><text x="360" y="411" class="body">Tag = Git-SHA</text><rect x="342" y="437" width="248" height="120" rx="12" fill="#ffffff" stroke="#b8d6ff" stroke-width="1.5"/><text x="360" y="468" class="cardTitle">Kustomize</text><text x="360" y="495" class="body">Image-Tags aktualisieren</text><text x="360" y="519" class="body">Bot-Commit nach staging</text><text x="352" y="600" class="muted">Actions baut. Flux deployed.</text><g><rect x="632" y="115" width="272" height="520" rx="18" fill="#f3f8ff" stroke="#b8d6ff" stroke-width="2"/>
 <circle cx="657" cy="142" r="17" fill="#0b1838"/><text x="657" y="149" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">3</text>
 <text x="686" y="149" class="cardTitle">Flux beobachtet Git</text></g><rect x="644" y="173" width="248" height="125" rx="12" fill="#ffffff" stroke="#b8d6ff" stroke-width="1.5"/><circle cx="674" cy="203" r="20" fill="#2563eb"/><text x="674" y="209" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">FLUX</text><text x="706" y="204" class="cardTitle">GitRepository</text><text x="706" y="231" class="body">Branch: staging</text><text x="706" y="255" class="body">Pfad: infra/kubernetes/staging</text><rect x="644" y="310" width="248" height="135" rx="12" fill="#ffffff" stroke="#b8d6ff" stroke-width="1.5"/><text x="662" y="341" class="cardTitle">Reconcile</text><text x="662" y="368" class="body">Git mit Cluster vergleichen</text><text x="662" y="392" class="body">Abweichungen korrigieren</text><text x="662" y="416" class="body">pull-basiert</text><rect x="644" y="457" width="248" height="105" rx="12" fill="#ffffff" stroke="#b8d6ff" stroke-width="1.5"/><text x="662" y="488" class="cardTitle">Bootstrap</text><text x="662" y="515" class="body">einmalige Einrichtung</text><text x="662" y="539" class="body">Deploy Key read-only</text><text x="654" y="605" class="muted">Kein GitHub-Zugriff auf</text><text x="654" y="630" class="muted">die interne K3s-API nötig.</text><g><rect x="934" y="115" width="272" height="520" rx="18" fill="#f8f3ff" stroke="#cfb6ff" stroke-width="2"/>
 <circle cx="959" cy="142" r="17" fill="#442077"/><text x="959" y="149" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">4</text>
 <text x="988" y="149" class="cardTitle">Staging im Cluster</text></g><rect x="946" y="173" width="248" height="100" rx="12" fill="#ffffff" stroke="#cfb6ff" stroke-width="1.5"/><circle cx="976" cy="203" r="20" fill="#7c3aed"/><text x="976" y="209" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">K3s</text><text x="1008" y="204" class="cardTitle">K3s</text><text x="1008" y="231" class="body">Blog + Kernel Grep / Search</text><text x="1008" y="255" class="body">SHA-Tags aus Kustomize</text><rect x="946" y="285" width="248" height="125" rx="12" fill="#ffffff" stroke="#cfb6ff" stroke-width="1.5"/><text x="964" y="316" class="cardTitle">Öffentlicher Gate</text><text x="964" y="343" class="body">/healthz = ok</text><text x="964" y="367" class="body">build-info = erwartete Version</text><text x="964" y="391" class="body">STAGING-Marker vorhanden</text><rect x="946" y="422" width="248" height="125" rx="12" fill="#ffffff" stroke="#cfb6ff" stroke-width="1.5"/><text x="964" y="453" class="cardTitle">Verified Candidate</text><text x="964" y="480" class="body">promotion/staging-verified</text><text x="964" y="504" class="body">erst nach grünem Gate</text><text x="956" y="597" class="muted">Nur der getestete Stand</text><text x="956" y="622" class="muted">darf Richtung main.</text><g><rect x="1236" y="115" width="272" height="520" rx="18" fill="#f0fbf4" stroke="#9bd8ae" stroke-width="2"/>
 <circle cx="1261" cy="142" r="17" fill="#0d5b2a"/><text x="1261" y="149" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">5</text>
 <text x="1290" y="149" class="cardTitle">Ergebnis in Teil II</text></g><rect x="1248" y="173" width="248" height="82" rx="12" fill="#ffffff" stroke="#9bd8ae" stroke-width="1.5"/><circle cx="1278" cy="203" r="20" fill="#159447"/><text x="1278" y="209" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">✓</text><text x="1310" y="204" class="cardTitle">Staging aktualisiert sich</text><text x="1310" y="231" class="body">automatisch über Git + Flux</text><rect x="1248" y="267" width="248" height="82" rx="12" fill="#ffffff" stroke="#9bd8ae" stroke-width="1.5"/><circle cx="1278" cy="297" r="20" fill="#159447"/><text x="1278" y="303" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">✓</text><text x="1310" y="298" class="cardTitle">Rollout nachvollziehbar</text><text x="1310" y="325" class="body">Commit → Image → Cluster</text><rect x="1248" y="361" width="248" height="82" rx="12" fill="#ffffff" stroke="#9bd8ae" stroke-width="1.5"/><circle cx="1278" cy="391" r="20" fill="#159447"/><text x="1278" y="397" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">✓</text><text x="1310" y="392" class="cardTitle">Öffentliche Prüfung</text><text x="1310" y="419" class="body">prüft den Blog-Build</text><rect x="1248" y="455" width="248" height="82" rx="12" fill="#ffffff" stroke="#9bd8ae" stroke-width="1.5"/><circle cx="1278" cy="485" r="20" fill="#159447"/><text x="1278" y="491" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">✓</text><text x="1310" y="486" class="cardTitle">Production</text><text x="1310" y="513" class="body">Merge bleibt manuell</text><rect x="1248" y="549" width="248" height="64" rx="12" fill="#ffffff" stroke="#ffc98b" stroke-width="1.5"/><circle cx="1278" cy="579" r="20" fill="#f59e0b"/><text x="1278" y="585" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">→</text><text x="1310" y="580" class="cardTitle">Secrets</text><text x="1310" y="607" class="body">noch offen → Teil III</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b1838"/></marker></defs><line x1="304" y1="375" x2="324" y2="375" stroke="#0b1838" stroke-width="3" marker-end="url(#arr)"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b1838"/></marker></defs><line x1="606" y1="375" x2="626" y2="375" stroke="#0b1838" stroke-width="3" marker-end="url(#arr)"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b1838"/></marker></defs><line x1="908" y1="375" x2="928" y2="375" stroke="#0b1838" stroke-width="3" marker-end="url(#arr)"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b1838"/></marker></defs><line x1="1210" y1="375" x2="1230" y2="375" stroke="#0b1838" stroke-width="3" marker-end="url(#arr)"/><rect x="28" y="660" width="730" height="300" rx="18" fill="#effbf3" stroke="#9bd8ae" stroke-width="2"/>
 <circle cx="56" cy="690" r="18" fill="#0d5b2a"/><text x="56" y="696" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">✓</text>
 <text x="86" y="698" font-size="24" font-weight="800" fill="#0d5b2a">Stand am Ende von Teil II</text><text x="52" y="730" font-size="18" font-weight="800" fill="#159447">✓</text>
   <text x="80" y="730" class="body">staging-Branch ist der GitOps-Pfad</text><text x="52" y="761" font-size="18" font-weight="800" fill="#159447">✓</text>
   <text x="80" y="761" class="body">Actions baut Blog + Kernel Grep / Search</text><text x="52" y="792" font-size="18" font-weight="800" fill="#159447">✓</text>
   <text x="80" y="792" class="body">Flux ist eingerichtet und reconciliert</text><text x="52" y="823" font-size="18" font-weight="800" fill="#159447">✓</text>
   <text x="80" y="823" class="body">öffentliche Staging-Prüfung läuft</text><text x="52" y="854" font-size="18" font-weight="800" fill="#159447">✓</text>
   <text x="80" y="854" class="body">geprüfter Stand wird erst nach Gate gesetzt</text><text x="52" y="885" font-size="18" font-weight="800" fill="#159447">✓</text>
   <text x="80" y="885" class="body">Production-Merge bleibt manuell</text><text x="52" y="916" font-size="18" font-weight="800" fill="#f59e0b">○</text>
   <text x="80" y="916" class="body">Digest-Pins statt nur Tags</text><text x="52" y="947" font-size="18" font-weight="800" fill="#f59e0b">○</text>
   <text x="80" y="947" class="body">Secrets sauber über GitOps → Teil III</text><rect x="780" y="660" width="728" height="300" rx="18" fill="#f1f7ff" stroke="#b8d6ff" stroke-width="2"/>
 <circle cx="808" cy="690" r="18" fill="#1552a0"/><text x="808" y="696" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">i</text>
 <text x="838" y="698" font-size="24" font-weight="800" fill="#1552a0">Begriffe ohne Bingo</text><text x="804" y="730" font-size="18" font-weight="800" fill="#1552a0">•</text>
   <text x="832" y="730" class="body">Git-SHA = eindeutige Commit-ID.</text><text x="804" y="761" font-size="18" font-weight="800" fill="#1552a0">•</text>
   <text x="832" y="761" class="body">Reconcile = Git-Zustand mit Cluster abgleichen.</text><text x="804" y="792" font-size="18" font-weight="800" fill="#1552a0">•</text>
   <text x="832" y="792" class="body">Bootstrap = einmalige Ersteinrichtung.</text><text x="804" y="823" font-size="18" font-weight="800" fill="#1552a0">•</text>
   <text x="832" y="823" class="body">Pfadfilter = welche Dateiänderungen CI starten.</text><text x="804" y="854" font-size="18" font-weight="800" fill="#1552a0">•</text>
   <text x="832" y="854" class="body">workflow_dispatch = manueller Startknopf.</text><text x="804" y="885" font-size="18" font-weight="800" fill="#1552a0">•</text>
   <text x="832" y="885" class="body">Branch Protection schützt Git; Workflow-Prüfung schützt CI.</text></svg>