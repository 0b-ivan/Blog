<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
  <title id="title">Die Vererbungsfalle beim Pokémon-Modell</title>
  <desc id="desc">Eine starre Klassenhierarchie von Pokemon zu FirePokemon, WaterPokemon und ElectricPokemon kollidiert mit Typen, Attacken und Statuszuständen, die quer zur Hierarchie variieren.</desc>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
    .title{font-size:44px;font-weight:800}
    .box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:3}
    .root{fill:#ecfeff;stroke:#0f766e;stroke-width:4}
    .bad{fill:#fff1f2;stroke:#be123c;stroke-width:3}
    .label{font-size:26px;font-weight:800}
    .small{font-size:21px;fill:#475569}
    .warn{font-size:22px;font-weight:750;fill:#9f1239}
    .line{stroke:#94a3b8;stroke-width:4;fill:none}
    .cross{stroke:#be123c;stroke-width:4;stroke-dasharray:12 10;fill:none}
  </style>
  <rect width="1400" height="840" rx="28" fill="#ffffff"/>
  <text x="70" y="82" class="title">Wenn die Domäne in einen Klassenbaum gepresst wird</text>

  <rect x="520" y="125" width="360" height="90" rx="20" class="root"/>
  <text x="700" y="180" text-anchor="middle" class="label">Pokemon</text>

  <path d="M700 215 V270 M700 270 H250 V320 M700 270 H700 V320 M700 270 H1150 V320" class="line"/>

  <rect x="90" y="320" width="320" height="88" rx="18" class="box"/>
  <text x="250" y="374" text-anchor="middle" class="label">FirePokemon</text>

  <rect x="540" y="320" width="320" height="88" rx="18" class="box"/>
  <text x="700" y="374" text-anchor="middle" class="label">WaterPokemon</text>

  <rect x="990" y="320" width="320" height="88" rx="18" class="box"/>
  <text x="1150" y="374" text-anchor="middle" class="label">ElectricPokemon</text>

  <path d="M250 408 V468 M700 408 V468 M1150 408 V468" class="line"/>

  <rect x="90" y="468" width="320" height="82" rx="18" class="box"/>
  <text x="250" y="520" text-anchor="middle" class="label">Charmander</text>

  <rect x="540" y="468" width="320" height="82" rx="18" class="box"/>
  <text x="700" y="520" text-anchor="middle" class="label">Squirtle</text>

  <rect x="990" y="468" width="320" height="82" rx="18" class="box"/>
  <text x="1150" y="520" text-anchor="middle" class="label">Pikachu</text>

  <rect x="100" y="625" width="1200" height="135" rx="22" class="bad"/>
  <text x="145" y="674" class="warn">Die Probleme liegen quer zur Hierarchie:</text>
  <text x="145" y="715" class="small">Dual Types · gemeinsam nutzbare Moves · Statuszustände · unterschiedliche Movesets derselben Spezies</text>

  <path d="M190 604 C340 555, 500 580, 640 610" class="cross"/>
  <path d="M700 604 C820 550, 1000 565, 1190 610" class="cross"/>
</svg>