<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Ablauf eines objektorientiert modellierten Pokémon-Kampfzuges</title>
  <desc id="desc">Ein Trainer wählt eine Attacke. Battle prüft den Zug, Move delegiert an Effect, der Effekt verändert das Ziel über dessen öffentliche Methoden und Battle setzt den Ablauf fort.</desc>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
    .title{font-size:44px;font-weight:800}
    .box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:3}
    .accent{fill:#ecfeff;stroke:#0f766e;stroke-width:4}
    .effect{fill:#fefce8;stroke:#ca8a04;stroke-width:3}
    .label{font-size:25px;font-weight:800}
    .small{font-size:19px;fill:#475569}
    .step{font-size:18px;font-weight:800;fill:#0f766e}
    .line{stroke:#64748b;stroke-width:4;fill:none}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1400" height="760" rx="28" fill="#ffffff"/>
  <text x="70" y="82" class="title">Ein Zug: Orchestrieren statt alles selbst erledigen</text>

  <rect x="60" y="230" width="220" height="120" rx="20" class="box"/>
  <text x="170" y="278" text-anchor="middle" class="step">1</text>
  <text x="170" y="312" text-anchor="middle" class="label">Trainer</text>
  <text x="170" y="339" text-anchor="middle" class="small">wählt Move</text>

  <rect x="340" y="230" width="220" height="120" rx="20" class="accent"/>
  <text x="450" y="278" text-anchor="middle" class="step">2</text>
  <text x="450" y="312" text-anchor="middle" class="label">Battle</text>
  <text x="450" y="339" text-anchor="middle" class="small">validiert Zug</text>

  <rect x="620" y="230" width="220" height="120" rx="20" class="box"/>
  <text x="730" y="278" text-anchor="middle" class="step">3</text>
  <text x="730" y="312" text-anchor="middle" class="label">Move</text>
  <text x="730" y="339" text-anchor="middle" class="small">delegiert</text>

  <rect x="900" y="230" width="220" height="120" rx="20" class="effect"/>
  <text x="1010" y="278" text-anchor="middle" class="step">4</text>
  <text x="1010" y="312" text-anchor="middle" class="label">Effect</text>
  <text x="1010" y="339" text-anchor="middle" class="small">führt Verhalten aus</text>

  <rect x="1180" y="230" width="160" height="120" rx="20" class="box"/>
  <text x="1260" y="278" text-anchor="middle" class="step">5</text>
  <text x="1260" y="312" text-anchor="middle" class="label">Pokemon</text>
  <text x="1260" y="339" text-anchor="middle" class="small">ändert Zustand</text>

  <path d="M280 290 H340" class="line" marker-end="url(#arrow)"/>
  <path d="M560 290 H620" class="line" marker-end="url(#arrow)"/>
  <path d="M840 290 H900" class="line" marker-end="url(#arrow)"/>
  <path d="M1120 290 H1180" class="line" marker-end="url(#arrow)"/>

  <path d="M1260 350 V510 C1260 560 1170 590 1080 590 H450 C360 590 330 550 330 500 V420" class="line" marker-end="url(#arrow)"/>
  <text x="720" y="555" text-anchor="middle" class="small">Battle entscheidet danach nur über den weiteren Ablauf des Kampfes</text>
</svg>