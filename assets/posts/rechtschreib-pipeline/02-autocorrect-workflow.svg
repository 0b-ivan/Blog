<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Manueller Start des Autocorrect-Workflows</title>
  <desc id="desc">Vektorisierte GitHub Actions Ansicht mit dem Workflow Autocorrect Blog Posts und dem manuellen Run-workflow-Dialog.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .text { fill: #e6edf3; }
    .muted { fill: #8b949e; }
    .border { stroke: #30363d; }
  </style>
  <rect width="1400" height="900" rx="18" fill="#0d1117"/>

  <rect width="1400" height="72" fill="#010409"/>
  <text x="26" y="43" class="sans text" font-size="15" font-weight="600">Blog</text>
  <text x="90" y="43" class="sans muted" font-size="15">Actions</text>
  <text x="170" y="43" class="sans muted" font-size="15">Projects</text>
  <text x="252" y="43" class="sans muted" font-size="15">Wiki</text>
  <text x="310" y="43" class="sans muted" font-size="15">Security</text>
  <text x="394" y="43" class="sans muted" font-size="15">Insights</text>
  <text x="470" y="43" class="sans muted" font-size="15">Settings</text>

  <text x="28" y="122" class="sans text" font-size="27" font-weight="700">Autocorrect Blog Posts</text>
  <text x="28" y="151" class="mono" fill="#58a6ff" font-size="14">proofread-autocorrect.yml</text>

  <rect x="28" y="190" width="1050" height="92" rx="8" fill="#161b22" stroke="#30363d"/>
  <circle cx="58" cy="221" r="11" fill="#1f6feb"/>
  <text x="82" y="224" class="sans text" font-size="16" font-weight="600">Help us improve GitHub Actions</text>
  <text x="82" y="250" class="sans muted" font-size="14">Tell us how to make GitHub Actions work better for you with three quick questions.</text>
  <rect x="945" y="211" width="105" height="38" rx="6" fill="#21262d" stroke="#8b949e"/>
  <text x="997" y="235" class="sans text" text-anchor="middle" font-size="14">Give feedback</text>

  <rect x="28" y="316" width="1050" height="470" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="48" y="353" class="sans text" font-size="16" font-weight="600">3 workflow runs</text>
  <line x1="28" y1="374" x2="1078" y2="374" stroke="#30363d"/>
  <text x="48" y="406" class="mono text" font-size="14">This workflow has a workflow_dispatch event trigger.</text>
  <rect x="930" y="388" width="120" height="38" rx="6" fill="#21262d" stroke="#8b949e"/>
  <text x="990" y="412" class="sans text" text-anchor="middle" font-size="14">Run workflow ▾</text>

  <g class="sans" font-size="15">
    <line x1="28" y1="446" x2="1078" y2="446" stroke="#30363d"/>
    <circle cx="55" cy="485" r="10" fill="#238636"/>
    <text x="80" y="481" class="text" font-weight="600">Autocorrect Blog Posts</text>
    <text x="80" y="505" class="muted" font-size="13">Autocorrect Blog Posts #3 · Manually run by 0b-ivan</text>
    <rect x="555" y="470" width="52" height="24" rx="12" fill="#1f6feb" opacity=".25"/>
    <text x="581" y="487" fill="#58a6ff" text-anchor="middle" font-size="12">main</text>

    <line x1="28" y1="530" x2="1078" y2="530" stroke="#30363d"/>
    <circle cx="55" cy="569" r="10" fill="#f85149"/>
    <text x="80" y="565" class="text" font-weight="600">Autocorrect Blog Posts</text>
    <text x="80" y="589" class="muted" font-size="13">Autocorrect Blog Posts #2 · Manually run by 0b-ivan</text>
    <rect x="555" y="554" width="52" height="24" rx="12" fill="#1f6feb" opacity=".25"/>
    <text x="581" y="571" fill="#58a6ff" text-anchor="middle" font-size="12">main</text>

    <line x1="28" y1="614" x2="1078" y2="614" stroke="#30363d"/>
    <circle cx="55" cy="653" r="10" fill="#f85149"/>
    <text x="80" y="649" class="text" font-weight="600">Autocorrect Blog Posts</text>
    <text x="80" y="673" class="muted" font-size="13">Autocorrect Blog Posts #1 · Manually run by 0b-ivan</text>
    <rect x="555" y="638" width="52" height="24" rx="12" fill="#1f6feb" opacity=".25"/>
    <text x="581" y="655" fill="#58a6ff" text-anchor="middle" font-size="12">main</text>
  </g>

  <rect x="835" y="365" width="385" height="390" rx="8" fill="#0d1117" stroke="#8b949e"/>
  <text x="858" y="399" class="sans text" font-size="14" font-weight="600">Use workflow from</text>
  <rect x="858" y="415" width="118" height="36" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="917" y="438" class="sans text" text-anchor="middle" font-size="13">Branch: main ▾</text>
  <line x1="835" y1="472" x2="1220" y2="472" stroke="#30363d"/>
  <text x="858" y="510" class="mono text" font-size="13">Optionaler Pfad, z. B.</text>
  <text x="858" y="532" class="mono text" font-size="13">posts/2026-08-20-mein-artikel.md.</text>
  <text x="858" y="554" class="mono text" font-size="13">Leer = alle aktiven Posts.</text>
  <rect x="858" y="578" width="338" height="42" rx="6" fill="#0d1117" stroke="#8b949e"/>
  <line x1="835" y1="644" x2="1220" y2="644" stroke="#30363d"/>
  <rect x="858" y="670" width="112" height="40" rx="6" fill="#1f6feb"/>
  <text x="914" y="695" class="sans" fill="#fff" text-anchor="middle" font-size="14" font-weight="600">Run workflow</text>
</svg>
