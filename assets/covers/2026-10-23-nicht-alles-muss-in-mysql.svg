<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Fünf Datenbanken für fünf Zugriffsmuster</title><desc id="desc">Eigene Übersicht zu Beziehungen, TTL, Dokumenten, Schlüsseln und Suche.</desc><rect width="1920" height="1080" rx="24" fill="#0c1722"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="100" y="110" fill="#e6eef5" font-size="52">Fünf Aufgaben. Fünf Datenmodelle.</text><text x="100" y="165" fill="#a9bfce" font-size="29">Die passende Datenbank beginnt beim Zugriffsmuster.</text><rect x="100" y="290" width="316" height="330" rx="16" fill="#162634" stroke="#72d6cd" stroke-width="2"/><text x="124" y="333" fill="#72d6cd" font-size="29">MySQL / RDS</text><text x="124" y="381" fill="#e6eef5" font-size="24">Beziehungen</text><text x="124" y="421" fill="#e6eef5" font-size="24"></text><text x="124" y="461" fill="#e6eef5" font-size="24">Kunde → Bestellung</text><rect x="444" y="290" width="316" height="330" rx="16" fill="#162634" stroke="#ffc878" stroke-width="2"/><text x="468" y="333" fill="#ffc878" font-size="29">Redis</text><text x="468" y="381" fill="#e6eef5" font-size="24">Ablaufzeit</text><text x="468" y="421" fill="#e6eef5" font-size="24"></text><text x="468" y="461" fill="#e6eef5" font-size="24">Session → TTL</text><rect x="788" y="290" width="316" height="330" rx="16" fill="#162634" stroke="#b6a0f7" stroke-width="2"/><text x="812" y="333" fill="#b6a0f7" font-size="29">DocumentDB</text><text x="812" y="381" fill="#e6eef5" font-size="24">Dokumente</text><text x="812" y="421" fill="#e6eef5" font-size="24"></text><text x="812" y="461" fill="#e6eef5" font-size="24">Laptop ≠ T-Shirt</text><rect x="1132" y="290" width="316" height="330" rx="16" fill="#162634" stroke="#89baff" stroke-width="2"/><text x="1156" y="333" fill="#89baff" font-size="29">DynamoDB</text><text x="1156" y="381" fill="#e6eef5" font-size="24">Schlüssel</text><text x="1156" y="421" fill="#e6eef5" font-size="24"></text><text x="1156" y="461" fill="#e6eef5" font-size="24">PK + SK → Spielstand</text><rect x="1476" y="290" width="316" height="330" rx="16" fill="#162634" stroke="#f29dac" stroke-width="2"/><text x="1500" y="333" fill="#f29dac" font-size="29">OpenSearch</text><text x="1500" y="381" fill="#e6eef5" font-size="24">Suchindex</text><text x="1500" y="421" fill="#e6eef5" font-size="24"></text><text x="1500" y="461" fill="#e6eef5" font-size="24">Logs → Filter</text><text x="100" y="790" fill="#b6c6d5" font-size="28">Bestellung     /     Anmeldung     /     Katalog     /     Spielstand     /     Fehlersuche</text></g></svg>
