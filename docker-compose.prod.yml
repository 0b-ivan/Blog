services:
  blog:
    image: ${BLOG_IMAGE:?BLOG_IMAGE must be set}
    container_name: kernel-notes-blog
    ports:
      - "1888:8080"
    volumes:
      - blog-posts:/app/posts:ro
      - blog-snippets:/app/snippets:ro
      - blog-post-assets:/app/assets/posts:ro
      - blog-archive:/content/archive:ro
      - blog-history:/content/post-history:ro
    environment:
      ARCHIVE_DIR: /content/archive
      POST_HISTORY_DIR: /content/post-history
    restart: unless-stopped

volumes:
  blog-posts:
    name: kernel-notes-blog-posts
  blog-snippets:
    name: kernel-notes-blog-snippets
  blog-post-assets:
    name: kernel-notes-blog-post-assets
  blog-archive:
    name: kernel-notes-blog-archive
  blog-history:
    name: kernel-notes-blog-history
