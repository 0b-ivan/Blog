name: Sync Main to Staging

on:
  push:
    branches:
      - main
      - staging
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: main-to-staging-sync
  cancel-in-progress: true

env:
  SYNC_BRANCH: sync/main-to-staging

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Reconcile main back into staging
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch origin main staging

          MAIN_SHA="$(git rev-parse origin/main)"
          STAGING_SHA="$(git rev-parse origin/staging)"

          echo "main:    ${MAIN_SHA}"
          echo "staging: ${STAGING_SHA}"

          existing="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base staging \
              --head "$SYNC_BRANCH" \
              --json number \
              --jq '.[0].number // empty'
          )"

          current_sync_sha="$(
            git ls-remote --heads origin "refs/heads/${SYNC_BRANCH}" |
              awk 'NR == 1 { print $1 }'
          )"

          if git merge-base --is-ancestor "$MAIN_SHA" "$STAGING_SHA"; then
            echo 'staging already contains the current main commit; no sync PR is required.'

            if [ -n "$existing" ]; then
              gh pr close "$existing" \
                --repo "$GITHUB_REPOSITORY" \
                --comment 'Closing automatically because staging already contains the current main commit.'
            fi

            if [ -n "$current_sync_sha" ]; then
              git push \
                --force-with-lease="refs/heads/${SYNC_BRANCH}:${current_sync_sha}" \
                origin ":refs/heads/${SYNC_BRANCH}" || true
            fi

            exit 0
          fi

          branch_changed=true
          conflict_files='none'

          if [ -n "$current_sync_sha" ]; then
            git fetch origin "refs/heads/${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}"
            current_parents="$(git show -s --format='%P' "refs/remotes/origin/${SYNC_BRANCH}" 2>/dev/null || true)"

            if [ "$current_parents" = "${STAGING_SHA} ${MAIN_SHA}" ]; then
              echo 'The sync branch already reconciles the current staging and main heads.'
              branch_changed=false
              SYNC_SHA="$current_sync_sha"
            fi
          fi

          if [ "$branch_changed" = true ]; then
            git switch -C sync-candidate "$STAGING_SHA"

            if ! git merge --no-ff --no-commit "$MAIN_SHA"; then
              conflict_files="$(
                git diff --name-only --diff-filter=U |
                  paste -sd ',' -
              )"

              echo "Detected back-sync conflicts: ${conflict_files:-unknown}"
              echo 'Retrying with the explicit staging-wins conflict policy.'
              git merge --abort

              # Back-sync exists to converge history without rolling staging
              # backwards. Non-conflicting main changes are imported, while
              # conflicting hunks keep the newer staging-side content.
              git merge \
                --no-ff \
                --strategy=ort \
                -X ours \
                -m "chore(sync): reconcile main into staging" \
                "$MAIN_SHA"
            else
              git commit -m "chore(sync): reconcile main into staging"
            fi

            unresolved="$(git diff --name-only --diff-filter=U)"
            if [ -n "$unresolved" ]; then
              echo 'Unresolved conflicts remain after the staging-wins retry:' >&2
              printf '%s\n' "$unresolved" >&2
              exit 1
            fi

            parents="$(git show -s --format='%P' HEAD)"
            if [ "$parents" != "${STAGING_SHA} ${MAIN_SHA}" ]; then
              echo "Unexpected sync merge parents: ${parents}" >&2
              exit 1
            fi

            SYNC_SHA="$(git rev-parse HEAD)"

            if [ -n "$current_sync_sha" ]; then
              git push \
                --force-with-lease="refs/heads/${SYNC_BRANCH}:${current_sync_sha}" \
                origin "${SYNC_SHA}:refs/heads/${SYNC_BRANCH}"
            else
              git push origin "${SYNC_SHA}:refs/heads/${SYNC_BRANCH}"
            fi

            echo "Reconciled ${SYNC_BRANCH} -> ${SYNC_SHA}"
          fi

          body="$(
            printf '%s\n\n%s\n%s\n%s\n%s\n\n%s\n' \
              'This PR is maintained automatically to converge `main` back into `staging`.' \
              "Current main commit: \`${MAIN_SHA}\`" \
              "Current staging commit: \`${STAGING_SHA}\`" \
              "Reconciled sync commit: \`${SYNC_SHA}\`" \
              "Auto-resolved conflict files: \`${conflict_files}\`" \
              'If both branches changed the same hunk, staging wins deliberately so a back-sync can never roll newer staging content backwards. Non-conflicting main changes and main history are still merged.'
          )"

          created=false
          if [ -n "$existing" ]; then
            gh api \
              --method PATCH \
              "/repos/${GITHUB_REPOSITORY}/pulls/${existing}" \
              -f title='sync: main back into staging' \
              -f body="$body" >/dev/null
            pr_number="$existing"
            echo "Updated main -> staging sync PR #${pr_number}."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base staging \
              --head "$SYNC_BRANCH" \
              --title 'sync: main back into staging' \
              --body "$body"

            pr_number="$(
              gh pr list \
                --repo "$GITHUB_REPOSITORY" \
                --state open \
                --base staging \
                --head "$SYNC_BRANCH" \
                --json number \
                --jq '.[0].number // empty'
            )"

            test -n "$pr_number"
            created=true
            echo "Created main -> staging sync PR #${pr_number}."
          fi

          if [ "$branch_changed" = true ] || [ "$created" = true ]; then
            # PRs opened with GITHUB_TOKEN do not recursively trigger
            # pull_request workflows. Dispatch the existing PR checks on the
            # reconciled sync branch explicitly.
            gh workflow run ci.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$SYNC_BRANCH"

            echo "Triggered PR checks for sync PR #${pr_number} at ${SYNC_SHA}."
          else
            echo "Sync PR #${pr_number} is already reconciled; no duplicate CI run needed."
          fi
