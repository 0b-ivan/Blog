name: Generate Article Cover

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview candidates or apply one selection
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply
      post_path:
        description: Post path, e.g. posts/2026-09-20-chaos-engineering-chaos-monkey-kubernetes.md
        required: true
        type: string
      query:
        description: Optional Pixabay search query; empty uses cover_query/title/category/tags
        required: false
        type: string
      selection:
        description: Ranked candidate number 1-6, used only in apply mode
        required: false
        default: "1"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: article-cover-${{ inputs.post_path }}
  cancel-in-progress: false

jobs:
  cover:
    name: Pixabay cover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      POST_PATH: ${{ inputs.post_path }}
      QUERY: ${{ inputs.query }}
      SELECTION: ${{ inputs.selection }}
      RAG_MODEL_CACHE: ${{ github.workspace }}/.cache/kernel-grep-models

    steps:
      - name: Checkout staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: staging
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install semantic cover ranking dependencies
        run: npm install --prefix rag --package-lock=false --no-audit --no-fund --onnxruntime-node-install=skip

      - name: Cache semantic cover ranking model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/kernel-grep-models
          key: cover-e5-${{ runner.os }}-${{ hashFiles('rag/package.json') }}
          restore-keys: |
            cover-e5-${{ runner.os }}-

      - name: Build Pixabay cache key
        id: pixabay_cache_key
        shell: bash
        run: echo "key=pixabay-api-${RUNNER_OS}-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Restore Pixabay API cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pixabay
          key: ${{ steps.pixabay_cache_key.outputs.key }}
          restore-keys: |
            pixabay-api-${{ runner.os }}-

      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PIXABAY_API_KEY" || {
            echo 'PIXABAY_API_KEY is not configured as an Actions repository secret.' >&2
            exit 1
          }

          case "$POST_PATH" in
            posts/*.md) ;;
            *)
              echo 'post_path must point to a Markdown file directly below posts/.' >&2
              exit 1
              ;;
          esac

          test -f "$POST_PATH" || {
            echo "Post not found: $POST_PATH" >&2
            exit 1
          }

          if [ "${{ inputs.mode }}" = "apply" ]; then
            case "$SELECTION" in
              1|2|3|4|5|6) ;;
              *)
                echo 'selection must be a number from 1 to 6.' >&2
                exit 1
                ;;
            esac
          fi

      - name: Preview semantically ranked Pixabay candidates
        if: inputs.mode == 'preview'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cover-semantic
          report="/tmp/cover-semantic/report.json"

          if [ -n "$QUERY" ]; then
            npm run covers:resolve -- "$POST_PATH" --query "$QUERY" --preview --report "$report"
          else
            npm run covers:resolve -- "$POST_PATH" --preview --report "$report"
          fi

          node scripts/rerank-cover-candidates-e5.js \
            --reports-dir /tmp/cover-semantic \
            --posts-dir posts \
            --cache-dir "$RAG_MODEL_CACHE"

          node scripts/render-cover-review.js \
            --report "$report" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply selected semantic cover
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cover-semantic
          report="/tmp/cover-semantic/report.json"

          if [ -n "$QUERY" ]; then
            npm run covers:resolve -- "$POST_PATH" --query "$QUERY" --preview --report "$report"
          else
            npm run covers:resolve -- "$POST_PATH" --preview --report "$report"
          fi

          node scripts/rerank-cover-candidates-e5.js \
            --reports-dir /tmp/cover-semantic \
            --posts-dir posts \
            --cache-dir "$RAG_MODEL_CACHE"

          image_id="$(jq -r --argjson rank "$SELECTION" '.candidates[] | select(.rank == $rank) | .id' "$report" | head -n 1)"
          semantic_score="$(jq -r --argjson rank "$SELECTION" '.candidates[] | select(.rank == $rank) | .score' "$report" | head -n 1)"
          semantic_mismatch="$(jq -r --argjson rank "$SELECTION" '.candidates[] | select(.rank == $rank) | .semanticMismatch' "$report" | head -n 1)"

          test -n "$image_id" && [ "$image_id" != "null" ] || {
            echo "Semantic candidate rank $SELECTION is unavailable." >&2
            exit 1
          }
          if [ "$semantic_mismatch" = "true" ]; then
            echo "Refusing candidate rank $SELECTION: semantic guardrails marked it as a mismatch." >&2
            exit 1
          fi

          npm run covers:resolve -- "$POST_PATH" --select-id "$image_id" --score "$semantic_score"
          cp "$report" /tmp/cover-report.json

      - name: Validate generated changes
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          npm run posts:validate-meta
          npm run lint
          npx vitest run tests/pixabay-cover.test.js tests/cover-semantic-rerank.test.js tests/cover-review.test.js tests/ebook-export.test.js

      - name: Create cover pull request
        if: inputs.mode == 'apply'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          slug="$(basename "$POST_PATH" .md)"
          branch="cover/${slug}-${GITHUB_RUN_ID}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"

          git add "$POST_PATH" assets/covers assets/css/article-covers.css

          if git diff --cached --quiet; then
            echo 'No cover changes were generated.' >&2
            exit 1
          fi

          git commit -m "feat: add Pixabay cover for ${slug}"
          git push origin "HEAD:refs/heads/${branch}"

          cover_commit="$(git rev-parse HEAD)"
          body_file="$(mktemp)"
          node scripts/render-cover-review.js \
            --report /tmp/cover-report.json \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$cover_commit" > "$body_file"

          cat >> "$body_file" <<EOF

          ---
          The selected image is stored locally under `assets/covers/`. Candidate previews are shown only for editorial review. The Pixabay API key is never committed.
          EOF

          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base staging \
            --head "$branch" \
            --title "feat: add cover for ${slug}" \
            --body-file "$body_file")"

          {
            echo '# Cover pull request created'
            echo
            echo "$pr_url"
          } >> "$GITHUB_STEP_SUMMARY"
