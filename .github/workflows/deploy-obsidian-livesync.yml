name: Deploy Obsidian LiveSync

on:
  push:
    branches:
      - main
    paths:
      - "ops/obsidian-livesync/**"
      - ".github/workflows/deploy-obsidian-livesync.yml"
  workflow_dispatch:
    inputs:
      deploy_cloudflared:
        description: Deploy the optional cloudflared sidecar from this stack
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: obsidian-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      REMOTE_DIR: /opt/Blog/ops/obsidian-livesync
      DEPLOY_CLOUDFLARED: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_cloudflared || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate deployment secrets
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
          OBSIDIAN_COUCHDB_USER: ${{ secrets.OBSIDIAN_COUCHDB_USER }}
          OBSIDIAN_COUCHDB_PASSWORD: ${{ secrets.OBSIDIAN_COUCHDB_PASSWORD }}
          OBSIDIAN_CF_TUNNEL_TOKEN: ${{ secrets.OBSIDIAN_CF_TUNNEL_TOKEN }}
        run: |
          test -n "$HETZNER_HOST" || { echo "HETZNER_HOST is missing"; exit 1; }
          test -n "$HETZNER_USER" || { echo "HETZNER_USER is missing"; exit 1; }
          test -n "$HETZNER_SSH_KEY" || { echo "HETZNER_SSH_KEY is missing"; exit 1; }
          test -n "$HETZNER_KNOWN_HOSTS" || { echo "HETZNER_KNOWN_HOSTS is missing"; exit 1; }
          test -n "$OBSIDIAN_COUCHDB_USER" || { echo "OBSIDIAN_COUCHDB_USER is missing"; exit 1; }
          test -n "$OBSIDIAN_COUCHDB_PASSWORD" || { echo "OBSIDIAN_COUCHDB_PASSWORD is missing"; exit 1; }

          if [ "$DEPLOY_CLOUDFLARED" = "true" ]; then
            test -n "$OBSIDIAN_CF_TUNNEL_TOKEN" || { echo "OBSIDIAN_CF_TUNNEL_TOKEN is required when deploy_cloudflared=true"; exit 1; }
          fi

      - name: Configure SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner_deploy
          chmod 600 ~/.ssh/hetzner_deploy
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare remote directory
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
        run: |
          PORT="${HETZNER_PORT:-22}"
          ssh -i ~/.ssh/hetzner_deploy -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${HETZNER_USER}@${HETZNER_HOST}" \
            "mkdir -p '${REMOTE_DIR}/config' '${REMOTE_DIR}/scripts'"

      - name: Copy LiveSync stack
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
        run: |
          PORT="${HETZNER_PORT:-22}"
          CONFIG_TMP="${REMOTE_DIR}/config/.livesync.ini.${GITHUB_RUN_ID}.tmp"

          scp -i ~/.ssh/hetzner_deploy -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            ops/obsidian-livesync/docker-compose.yml \
            "${HETZNER_USER}@${HETZNER_HOST}:${REMOTE_DIR}/docker-compose.yml"

          # CouchDB's entrypoint may have changed ownership of an older bind-mounted
          # livesync.ini. Upload a new inode into the writable directory and replace
          # the old file atomically instead of trying to overwrite that inode via SCP.
          scp -i ~/.ssh/hetzner_deploy -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            ops/obsidian-livesync/config/livesync.ini \
            "${HETZNER_USER}@${HETZNER_HOST}:${CONFIG_TMP}"
          ssh -i ~/.ssh/hetzner_deploy -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${HETZNER_USER}@${HETZNER_HOST}" \
            "mv -f '${CONFIG_TMP}' '${REMOTE_DIR}/config/livesync.ini'"

          scp -i ~/.ssh/hetzner_deploy -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            ops/obsidian-livesync/scripts/couchdb-init.sh \
            "${HETZNER_USER}@${HETZNER_HOST}:${REMOTE_DIR}/scripts/couchdb-init.sh"
          scp -i ~/.ssh/hetzner_deploy -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            ops/obsidian-livesync/scripts/livesync-bootstrap.sh \
            "${HETZNER_USER}@${HETZNER_HOST}:${REMOTE_DIR}/scripts/livesync-bootstrap.sh"

      - name: Write remote environment
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          OBSIDIAN_COUCHDB_USER: ${{ secrets.OBSIDIAN_COUCHDB_USER }}
          OBSIDIAN_COUCHDB_PASSWORD: ${{ secrets.OBSIDIAN_COUCHDB_PASSWORD }}
          OBSIDIAN_CF_TUNNEL_TOKEN: ${{ secrets.OBSIDIAN_CF_TUNNEL_TOKEN }}
        run: |
          PORT="${HETZNER_PORT:-22}"
          case "$OBSIDIAN_COUCHDB_USER$OBSIDIAN_COUCHDB_PASSWORD$OBSIDIAN_CF_TUNNEL_TOKEN" in
            *$'\n'*) echo "LiveSync secrets must not contain newlines"; exit 1 ;;
          esac

          {
            printf 'COUCHDB_USER=%s\n' "$OBSIDIAN_COUCHDB_USER"
            printf 'COUCHDB_PASSWORD=%s\n' "$OBSIDIAN_COUCHDB_PASSWORD"
            printf 'COUCHDB_DATABASE=kernelnotes\n'
            if [ "$DEPLOY_CLOUDFLARED" = "true" ]; then
              printf 'CF_TUNNEL_TOKEN=%s\n' "$OBSIDIAN_CF_TUNNEL_TOKEN"
            else
              printf 'CF_TUNNEL_TOKEN=\n'
            fi
          } | ssh -i ~/.ssh/hetzner_deploy -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${HETZNER_USER}@${HETZNER_HOST}" \
            "umask 077; cat > '${REMOTE_DIR}/.env'"

      - name: Deploy LiveSync stack
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
        run: |
          PORT="${HETZNER_PORT:-22}"
          ssh -i ~/.ssh/hetzner_deploy -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${HETZNER_USER}@${HETZNER_HOST}" bash -s -- "$REMOTE_DIR" "$DEPLOY_CLOUDFLARED" <<'REMOTE'
          set -euo pipefail
          REMOTE_DIR="$1"
          DEPLOY_CLOUDFLARED="$2"
          cd "$REMOTE_DIR"

          if [ "$DEPLOY_CLOUDFLARED" = "true" ]; then
            docker compose --env-file .env --profile cloudflare config >/dev/null
            docker compose --env-file .env --profile cloudflare pull
            docker compose --env-file .env --profile cloudflare up -d --force-recreate --remove-orphans
          else
            docker compose --env-file .env config >/dev/null
            docker compose --env-file .env pull couchdb couchdb-init
            docker compose --env-file .env up -d --force-recreate couchdb couchdb-init
          fi

          healthy=false
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' kernel-notes-livesync-couchdb 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" != "true" ]; then
            echo "CouchDB did not become healthy"
            docker compose --env-file .env ps
            docker compose --env-file .env logs --tail=100 couchdb couchdb-init || true
            exit 1
          fi

          published="$(docker port kernel-notes-livesync-couchdb 5984/tcp 2>/dev/null || true)"
          if ! printf '%s\n' "$published" | grep -Fxq '127.0.0.1:5984'; then
            echo "CouchDB is not published on 127.0.0.1:5984"
            echo "Published mapping: ${published:-<none>}"
            docker compose --env-file .env ps
            exit 1
          fi

          if ! timeout 5 bash -c '</dev/tcp/127.0.0.1/5984'; then
            echo "CouchDB host loopback port 127.0.0.1:5984 is not reachable"
            exit 1
          fi

          if [ "$DEPLOY_CLOUDFLARED" = "true" ]; then
            if [ "$(docker inspect -f '{{.State.Running}}' kernel-notes-livesync-cloudflared 2>/dev/null || true)" != "true" ]; then
              echo "cloudflared is not running"
              docker compose --env-file .env --profile cloudflare ps
              docker compose --env-file .env logs --tail=100 cloudflared || true
              exit 1
            fi
            docker compose --env-file .env --profile cloudflare ps
          else
            docker compose --env-file .env ps
          fi
          REMOTE

      - name: Verify public LiveSync endpoint
        run: |
          code=""
          for _ in $(seq 1 10); do
            code="$(curl -sS -o /tmp/livesync-up -w '%{http_code}' https://obsidian-sync.obivan.org/_up || true)"
            case "$code" in
              200|401)
                echo "Public LiveSync endpoint is reachable (HTTP $code)"
                exit 0
                ;;
            esac
            sleep 3
          done

          echo "Public LiveSync endpoint check failed with HTTP ${code:-unknown}"
          cat /tmp/livesync-up 2>/dev/null || true
          exit 1
