name: Backfill Article Covers

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Process only missing covers or re-rank existing covers too
        required: true
        type: choice
        default: missing
        options:
          - missing
          - all
      batch_size:
        description: Number of existing published articles to process
        required: true
        type: choice
        default: "8"
        options:
          - "4"
          - "8"
          - "12"
          - "20"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: article-cover-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Pixabay cover backfill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      COVER_SCOPE: ${{ inputs.scope }}
      BATCH_SIZE: ${{ inputs.batch_size }}

    steps:
      - name: Checkout staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: staging
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Pixabay secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PIXABAY_API_KEY" || {
            echo 'PIXABAY_API_KEY is not configured as an Actions repository secret.' >&2
            exit 1
          }

      - name: Build Pixabay cache key
        id: pixabay_cache_key
        shell: bash
        run: echo "key=pixabay-api-${RUNNER_OS}-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Restore Pixabay API cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pixabay
          key: ${{ steps.pixabay_cache_key.outputs.key }}
          restore-keys: |
            pixabay-api-${{ runner.os }}-

      - name: Select existing posts without covers
        id: candidates
        shell: bash
        run: |
          set -euo pipefail
          args=(--limit "$BATCH_SIZE")
          if [ "$COVER_SCOPE" = "all" ]; then
            args+=(--include-covered)
          fi
          npm run covers:missing -- "${args[@]}" > /tmp/pixabay-cover-posts.txt

          if [ -s /tmp/pixabay-cover-posts.txt ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            {
              if [ "$COVER_SCOPE" = "all" ]; then
                echo '# Existing articles selected for smart cover refresh'
              else
                echo '# Existing articles selected for cover backfill'
              fi
              echo
              sed 's/^/- `/; s/$/`/' /tmp/pixabay-cover-posts.txt
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo 'No published articles matched the selected cover scope.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resolve Pixabay covers
        if: steps.candidates.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cover-reports
          while IFS= read -r post; do
            echo "Resolving local cover for $post"
            slug="$(basename "$post" .md)"
            npm run covers:resolve -- "$post" --select 1 --report "/tmp/cover-reports/${slug}.json"
          done < /tmp/pixabay-cover-posts.txt

      - name: Validate generated changes
        if: steps.candidates.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          npm run posts:validate-meta
          npm run lint
          npx vitest run tests/cover-backfill.test.js tests/pixabay-cover.test.js tests/cover-review.test.js tests/ebook-export.test.js tests/server.test.js

      - name: Create backfill pull request
        if: steps.candidates.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branch="cover/backfill-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"

          while IFS= read -r post; do
            git add "$post"
          done < /tmp/pixabay-cover-posts.txt
          git add assets/covers assets/css/article-covers.css

          if git diff --cached --quiet; then
            echo 'No cover changes were generated.' >&2
            exit 1
          fi

          git commit -m "feat: backfill Pixabay article covers"
          git push origin "HEAD:refs/heads/${branch}"

          cover_commit="$(git rev-parse HEAD)"
          body_file="$(mktemp)"
          node scripts/render-cover-review.js \
            --reports-dir /tmp/cover-reports \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$cover_commit" > "$body_file"

          cat >> "$body_file" <<EOF

          ---
          Each selected image is stored locally under `assets/covers/` and keeps provider, source, credit, score and license metadata in the article frontmatter.
          EOF

          if [ "$COVER_SCOPE" = "all" ]; then
            pr_title='feat: review existing article covers'
          else
            pr_title='feat: backfill existing article covers'
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base staging \
            --head "$branch" \
            --title "$pr_title" \
            --body-file "$body_file"
