name: Backfill Article Covers

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Number of existing published articles to process
        required: true
        type: choice
        default: "8"
        options:
          - "4"
          - "8"
          - "12"
          - "20"
      scope:
        description: Backfill only missing covers or re-rank all published covers
        required: true
        type: choice
        default: missing
        options:
          - missing
          - all

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: article-cover-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Pixabay cover backfill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      BATCH_SIZE: ${{ inputs.batch_size }}
      COVER_SCOPE: ${{ inputs.scope }}

    steps:
      - name: Checkout staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: staging
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Pixabay secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PIXABAY_API_KEY" || {
            echo 'PIXABAY_API_KEY is not configured as an Actions repository secret.' >&2
            exit 1
          }

      - name: Build Pixabay cache key
        id: pixabay_cache_key
        shell: bash
        run: echo "key=pixabay-api-${RUNNER_OS}-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Restore Pixabay API cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pixabay
          key: ${{ steps.pixabay_cache_key.outputs.key }}
          restore-keys: |
            pixabay-api-${{ runner.os }}-

      - name: Select existing posts without covers
        id: candidates
        shell: bash
        run: |
          set -euo pipefail
          if [ "$COVER_SCOPE" = "all" ]; then
            npm run covers:missing -- --limit "$BATCH_SIZE" --include-existing > /tmp/pixabay-cover-posts.txt
          else
            npm run covers:missing -- --limit "$BATCH_SIZE" > /tmp/pixabay-cover-posts.txt
          fi

          if [ -s /tmp/pixabay-cover-posts.txt ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            {
              if [ "$COVER_SCOPE" = "all" ]; then
              echo '# Existing articles selected for smart cover review'
            else
              echo '# Existing articles selected for cover backfill'
            fi
              echo
              sed 's/^/- `/; s/$/`/' /tmp/pixabay-cover-posts.txt
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            if [ "$COVER_SCOPE" = "all" ]; then
              echo 'No published articles were selected for cover review.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'All published articles already have a cover.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Resolve Pixabay covers
        if: steps.candidates.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r post; do
            echo "Resolving local cover for $post"
            npm run covers:resolve -- "$post" --select 1
          done < /tmp/pixabay-cover-posts.txt

      - name: Validate generated changes
        if: steps.candidates.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          npm run posts:validate-meta
          npm run lint
          npx vitest run tests/cover-backfill.test.js tests/pixabay-cover.test.js tests/ebook-export.test.js tests/server.test.js

      - name: Create backfill pull request
        if: steps.candidates.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branch="cover/backfill-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"

          while IFS= read -r post; do
            git add "$post"
          done < /tmp/pixabay-cover-posts.txt
          git add assets/covers assets/css/article-covers.css

          if git diff --cached --quiet; then
            echo 'No cover changes were generated.' >&2
            exit 1
          fi

          git commit -m "feat: backfill Pixabay article covers"
          git push origin "HEAD:refs/heads/${branch}"

          body_file="$(mktemp)"
          preview_sha="$(git rev-parse HEAD)"
          {
            echo 'Backfills locally stored Pixabay covers for existing published articles.'
            echo
            echo '## Selected covers'
            echo
            while IFS= read -r post; do
              title="$(node - "$post" <<'NODE'
              const fs = require('node:fs');
              const matter = require('gray-matter');
              const post = process.argv[2];
              const data = matter(fs.readFileSync(post, 'utf8')).data;
              process.stdout.write(String(data.title || post));
              NODE
              )"
              cover_path="$(node - "$post" <<'NODE'
              const fs = require('node:fs');
              const matter = require('gray-matter');
              const post = process.argv[2];
              const data = matter(fs.readFileSync(post, 'utf8')).data;
              process.stdout.write(String(data.cover_image || ''));
              NODE
              )"
              cover_score="$(node - "$post" <<'NODE'
              const fs = require('node:fs');
              const matter = require('gray-matter');
              const post = process.argv[2];
              const data = matter(fs.readFileSync(post, 'utf8')).data;
              process.stdout.write(String(data.cover_score || 'n/a'));
              NODE
              )"
              printf '### %s\n\n' "$title"
              printf 'Topic score: **%s/100** · `%s`\n\n' "$cover_score" "$post"
              printf '![%s](https://raw.githubusercontent.com/%s/%s%s)\n\n' "$title" "$GITHUB_REPOSITORY" "$preview_sha" "$cover_path"
            done < /tmp/pixabay-cover-posts.txt
            echo 'Each image is stored locally under `assets/covers/` and keeps provider, source, credit, license and ranking metadata in the article frontmatter.'
          } > "$body_file"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base staging \
            --head "$branch" \
            --title 'feat: backfill existing article covers' \
            --body-file "$body_file"
