name: Backfill Article Covers

on:
  push:
    branches:
      - staging
    paths:
      - '.github/cover-backfill-request.txt'
  workflow_dispatch:
    inputs:
      scope:
        description: Process only missing covers or re-rank existing covers too
        required: true
        type: choice
        default: missing
        options:
          - missing
          - all
      batch_size:
        description: Batch size for missing-cover mode; scope=all processes every published article
        required: true
        type: choice
        default: "8"
        options:
          - "4"
          - "8"
          - "12"
          - "20"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: article-cover-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Pixabay cover backfill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PIXABAY_REQUEST_DELAY_MS: "850"
      RAG_MODEL_CACHE: ${{ github.workspace }}/.cache/kernel-grep-models
      COVER_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'all' }}
      BATCH_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.batch_size || '20' }}

    steps:
      - name: Checkout staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: staging
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install semantic ranking dependencies
        run: npm install --prefix rag --package-lock=false --no-audit --no-fund --onnxruntime-node-install=skip

      - name: Cache Kernel Grep embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/kernel-grep-models
          key: kernel-grep-e5-${{ runner.os }}-${{ hashFiles('rag/package.json') }}
          restore-keys: |
            kernel-grep-e5-${{ runner.os }}-


      - name: Validate Pixabay secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PIXABAY_API_KEY" || {
            echo 'PIXABAY_API_KEY is not configured as an Actions repository secret.' >&2
            exit 1
          }

      - name: Build Pixabay cache key
        id: pixabay_cache_key
        shell: bash
        run: echo "key=pixabay-api-${RUNNER_OS}-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Restore Pixabay API cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pixabay
          key: ${{ steps.pixabay_cache_key.outputs.key }}
          restore-keys: |
            pixabay-api-${{ runner.os }}-

      - name: Select existing posts without covers
        id: candidates
        shell: bash
        run: |
          set -euo pipefail
          if [ "$COVER_SCOPE" = "all" ]; then
            args=(--include-covered --all)
          else
            args=(--limit "$BATCH_SIZE")
          fi
          node scripts/list-missing-cover-posts.js "${args[@]}" > /tmp/pixabay-cover-posts.txt

          if [ -s /tmp/pixabay-cover-posts.txt ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            {
              if [ "$COVER_SCOPE" = "all" ]; then
                echo '# Existing articles selected for smart cover refresh'
              else
                echo '# Existing articles selected for cover backfill'
              fi
              echo
              sed 's/^/- `/; s/$/`/' /tmp/pixabay-cover-posts.txt
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo 'No published articles matched the selected cover scope.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rank and diversify Pixabay covers
        if: steps.candidates.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cover-candidates /tmp/cover-reports /tmp/cover-logs

          while IFS= read -r post; do
            [ -n "$post" ] || continue
            echo "Collecting ranked candidates for $post"
            slug="$(basename "$post" .md)"
            report="/tmp/cover-candidates/${slug}.json"
            log="/tmp/cover-logs/${slug}.log"

            if npm run covers:resolve -- "$post" --preview --report "$report" >"$log" 2>&1; then
              cat "$log"
            else
              cat "$log"
              error_message="$(tail -n 1 "$log" | sed -E 's/\x1B\[[0-9;]*[mK]//g')"
              echo "Cover resolver failed closed for $post: $error_message"

              POST_PATH="$post" REPORT_PATH="$report" RESOLVER_ERROR="$error_message" node -e '
                const fs = require("node:fs");
                const matter = require("gray-matter");
                const { subjectAnchors } = require("./scripts/resolve-pixabay-cover");
                const postPath = process.env.POST_PATH;
                const parsed = matter(fs.readFileSync(postPath, "utf8"));
                const data = parsed.data || {};
                const report = {
                  postPath,
                  title: data.title || postPath,
                  series: data.series || "",
                  visualIntent: data.cover_intent || "",
                  subjectAnchors: subjectAnchors(data, data.cover_query || ""),
                  query: data.cover_query || "",
                  queries: [],
                  candidates: [],
                  resolverError: process.env.RESOLVER_ERROR || "cover resolver failed"
                };
                fs.writeFileSync(process.env.REPORT_PATH, JSON.stringify(report, null, 2));
              '

              # A first-query 429 usually means the shared API window is hot.
              # Cool down before the next article instead of cascading failures.
              if printf '%s' "$error_message" | grep -q 'HTTP 429'; then
                sleep 15
              fi
            fi

            # Separate article processes share the same Pixabay quota.
            sleep 1
          done < /tmp/pixabay-cover-posts.txt

          node scripts/rerank-cover-candidates-e5.js \
            --reports-dir /tmp/cover-candidates \
            --posts-dir posts \
            --cache-dir "$RAG_MODEL_CACHE"

          node scripts/select-diverse-cover-candidates.js \
            --reports-dir /tmp/cover-candidates \
            --output /tmp/cover-selection.json \
            --selection-list /tmp/cover-selection.list

          while IFS='|' read -r post image_id semantic_score; do
            [ -n "$post" ] || continue
            [ -n "$image_id" ] || {
              echo "Missing selected Pixabay image id for $post" >&2
              exit 1
            }
            [ -n "$semantic_score" ] || {
              echo "Missing semantic cover score for $post" >&2
              exit 1
            }
            echo "Applying diversified Pixabay image $image_id for $post (semantic score $semantic_score)"
            slug="$(basename "$post" .md)"
            npm run covers:resolve -- "$post" --select-id "$image_id" --score "$semantic_score"
          done < /tmp/cover-selection.list

      - name: Validate generated changes
        if: steps.candidates.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          npm run posts:validate-meta
          npm run lint
          npx vitest run tests/cover-backfill.test.js tests/pixabay-cover.test.js tests/cover-diversity.test.js tests/cover-semantic-rerank.test.js tests/cover-review.test.js tests/ebook-export.test.js tests/server.test.js

      - name: Create backfill pull request
        if: steps.candidates.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branch="cover/backfill-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"

          while IFS= read -r post; do
            [ -n "$post" ] || continue
            git add "$post"
          done < /tmp/pixabay-cover-posts.txt
          git add assets/covers assets/css/article-covers.css

          if git diff --cached --quiet; then
            echo 'No cover changes were generated.' >&2
            exit 1
          fi

          git commit -m "feat: backfill Pixabay article covers"
          git push origin "HEAD:refs/heads/${branch}"

          cover_commit="$(git rev-parse HEAD)"
          body_file="$(mktemp)"
          node scripts/render-cover-review.js \
            --reports-dir /tmp/cover-candidates \
            --selection-manifest /tmp/cover-selection.json \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$cover_commit" \
            --compact > "$body_file"

          cat >> "$body_file" <<'EOF'

          ---
          Each selected image is stored locally under `assets/covers/` and keeps provider, source, credit, score and license metadata in the article frontmatter.
          EOF

          if [ "$COVER_SCOPE" = "all" ]; then
            pr_title='feat: review existing article covers'
          else
            pr_title='feat: backfill existing article covers'
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base staging \
            --head "$branch" \
            --title "$pr_title" \
            --body-file "$body_file"
