name: Autocorrect Blog Posts

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Optionaler Pfad, z. B. posts/2026-08-20-mein-artikel.md. Leer = alle aktiven Posts.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: proofread-autocorrect
  cancel-in-progress: false

jobs:
  autocorrect-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Apply CSpell autocorrections
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set +e
          if [ -n "$TARGET" ]; then
            npm run posts:spellcheck:fix -- "$TARGET"
          else
            npm run posts:spellcheck:fix
          fi
          status=$?
          set -e

          if [ "$status" -gt 1 ]; then
            echo 'CSpell autocorrection failed to run.'
            exit "$status"
          fi

      - name: Start LanguageTool
        run: |
          docker run -d \
            --name languagetool \
            -p 127.0.0.1:8010:8081 \
            meyay/languagetool:latest

          for _ in $(seq 1 60); do
            if curl -fsS -X POST \
              -d 'language=de-DE' \
              -d 'text=Das ist ein Test.' \
              http://127.0.0.1:8010/v2/check >/dev/null; then
              echo 'LanguageTool is ready'
              exit 0
            fi
            sleep 2
          done

          docker logs languagetool || true
          echo 'LanguageTool did not become ready'
          exit 1

      - name: Apply safe LanguageTool autocorrections
        env:
          LANGUAGETOOL_URL: http://127.0.0.1:8010/v2/check
          PROOFREAD_LANGUAGE: de-DE
          TARGET: ${{ inputs.target }}
        run: |
          if [ -n "$TARGET" ]; then
            npm run posts:proofread:fix -- "$TARGET"
          else
            npm run posts:proofread:fix
          fi

      - name: Create correction pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- posts/; then
            echo 'Keine automatischen Korrekturen gefunden.'
            exit 0
          fi

          branch="chore/proofread-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add posts/
          git commit -m 'Autocorrect blog post spelling'
          git push origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title 'Autocorrect blog post spelling' \
            --body "CSpell und LanguageTool haben automatische Rechtschreibkorrekturen angewendet. CSpell deckt klassische Tippfehler ab; LanguageTool korrigiert nur eindeutige Rechtschreibtreffer mit genau einem Ersatz. Grammatik-, Stil- und mehrdeutige Vorschlaege werden bewusst nicht automatisch uebernommen. Bitte den Diff vor dem Merge pruefen.\n\nWorkflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Stop LanguageTool
        if: always()
        run: docker rm -f languagetool >/dev/null 2>&1 || true
