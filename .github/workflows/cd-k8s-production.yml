name: Deploy K3s Production

on:
  push:
    branches:
      - main
    paths:
      - 'posts/**'
      - 'archive/**'
      - 'snippets/**'
      - 'assets/**'
      - 'config/**'
      - 'lib/**'
      - '*.html'
      - '*.js'
      - 'rag/**'
      - 'Dockerfile'
      - 'Dockerfile.search'
      - 'Dockerfile.status'
      - 'Dockerfile.pdf'
      - 'templates/**'
      - 'status-monitor/**'
      - 'infra/kubernetes/base/**'
      - 'infra/kubernetes/production/**'
      - 'package.json'
      - 'package-lock.json'
      - 'VERSION'
      - '.dockerignore'
      - '.github/workflows/cd-k8s-production.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  packages: write

concurrency:
  group: k3s-production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BLOG_IMAGE_NAME: kernel-notes-blog
  SEARCH_IMAGE_NAME: kernel-notes-search
  STATUS_IMAGE_NAME: kernel-notes-status
  PDF_IMAGE_NAME: kernel-notes-pdf
  GITOPS_BRANCH: production-gitops
  K8S_PRODUCTION_URL: https://blog.obivan.org

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require merged PR for automatic deployments
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            count=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPOSITORY}/commits/${COMMIT_SHA}/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')
            if [ "$count" -ge 1 ]; then
              echo 'Main commit is associated with a merged pull request.'
              exit 0
            fi
            [ "$attempt" -eq 5 ] || sleep 3
          done
          echo 'Refusing K3s production deployment: commit is not associated with a merged PR into main.' >&2
          exit 1

      - name: Classify K3s production changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "blog=true" >> "$GITHUB_OUTPUT"
            echo "search=true" >> "$GITHUB_OUTPUT"
            echo "status=true" >> "$GITHUB_OUTPUT"
            echo "pdf=true" >> "$GITHUB_OUTPUT"
            echo "infra=true" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > /tmp/k3s-production-files.txt
          echo 'K3s production-relevant changes:'
          cat /tmp/k3s-production-files.txt

          blog=false
          search=false
          status=false
          pdf=false
          infra=false

          while IFS= read -r file; do
            case "$file" in
              posts/*|archive/*|snippets/*|assets/*|config/*|lib/*|Dockerfile|package.json|package-lock.json|VERSION|.dockerignore)
                blog=true
                ;;
            esac

            case "$file" in
              posts/*|snippets/*|assets/*|config/*|lib/*|templates/*|Dockerfile.pdf|pdf-export-server.js|package.json|package-lock.json|.dockerignore)
                pdf=true
                ;;
            esac

            if [[ "$file" != */* && ( "$file" == *.html || "$file" == *.js ) ]]; then
              blog=true
            fi

            case "$file" in
              posts/*|rag/*|Dockerfile.search|.dockerignore)
                search=true
                ;;
            esac

            case "$file" in
              status-monitor/*|Dockerfile.status|.dockerignore)
                status=true
                ;;
            esac

            case "$file" in
              infra/kubernetes/base/*|infra/kubernetes/production/*)
                infra=true
                ;;
            esac
          done < /tmp/k3s-production-files.txt

          deploy=false
          if [ "$blog" = true ] || [ "$search" = true ] || [ "$status" = true ] || [ "$pdf" = true ] || [ "$infra" = true ]; then
            deploy=true
          fi

          echo "blog=$blog" >> "$GITHUB_OUTPUT"
          echo "search=$search" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "pdf=$pdf" >> "$GITHUB_OUTPUT"
          echo "infra=$infra" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Classification: blog=$blog search=$search status=$status pdf=$pdf infra=$infra deploy=$deploy"

      - name: Build article version history
        run: node scripts/build-post-history.js

      - name: Set immutable image names
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BLOG_VERSION=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$BLOG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid VERSION: $BLOG_VERSION" >&2
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA:0:12}"
          BUILD_VERSION="${BLOG_VERSION}+${SHORT_SHA}"

          echo "owner_lower=${OWNER_LOWER}" >> "$GITHUB_OUTPUT"
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "blog_image=${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.BLOG_IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "search_image=${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.SEARCH_IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "status_image=${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.STATUS_IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "pdf_image=${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.PDF_IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        if: steps.changes.outputs.blog == 'true' || steps.changes.outputs.search == 'true' || steps.changes.outputs.status == 'true' || steps.changes.outputs.pdf == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GHCR
        if: steps.changes.outputs.blog == 'true' || steps.changes.outputs.search == 'true' || steps.changes.outputs.status == 'true' || steps.changes.outputs.pdf == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push K3s blog image
        if: steps.changes.outputs.blog == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.build_version }}
          tags: |
            ${{ steps.meta.outputs.blog_image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ env.BLOG_IMAGE_NAME }}:k3s-production
          cache-from: type=gha,scope=k3s-production-blog
          cache-to: type=gha,mode=max,scope=k3s-production-blog

      - name: Build and push K3s Kernel Grep image
        if: steps.changes.outputs.search == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.search
          push: true
          tags: |
            ${{ steps.meta.outputs.search_image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ env.SEARCH_IMAGE_NAME }}:k3s-production
          cache-from: type=gha,scope=k3s-production-search
          cache-to: type=gha,mode=max,scope=k3s-production-search

      - name: Build and push K3s Kubernetes status image
        if: steps.changes.outputs.status == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.status
          push: true
          tags: |
            ${{ steps.meta.outputs.status_image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ env.STATUS_IMAGE_NAME }}:k3s-production
          cache-from: type=gha,scope=k3s-production-status
          cache-to: type=gha,mode=max,scope=k3s-production-status

      - name: Build and push K3s LaTeX PDF image
        if: steps.changes.outputs.pdf == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.pdf
          push: true
          tags: |
            ${{ steps.meta.outputs.pdf_image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ env.PDF_IMAGE_NAME }}:k3s-production
          cache-from: type=gha,scope=k3s-production-pdf
          cache-to: type=gha,mode=max,scope=k3s-production-pdf

      - name: Publish K3s production desired state
        if: steps.changes.outputs.deploy == 'true'
        env:
          DEPLOY_SHA: ${{ github.sha }}
          BLOG_CHANGED: ${{ steps.changes.outputs.blog }}
          SEARCH_CHANGED: ${{ steps.changes.outputs.search }}
          STATUS_CHANGED: ${{ steps.changes.outputs.status }}
          PDF_CHANGED: ${{ steps.changes.outputs.pdf }}
        run: |
          set -euo pipefail

          WORKTREE=/tmp/kernel-notes-production-gitops
          PREVIOUS_GITOPS_FILE=/tmp/kernel-notes-production-kustomization.previous.yaml
          rm -rf "$WORKTREE"
          rm -f "$PREVIOUS_GITOPS_FILE"

          git fetch origin "${GITOPS_BRANCH}"
          git worktree add --detach "$WORKTREE" "origin/${GITOPS_BRANCH}"
          cp "$WORKTREE/infra/kubernetes/production/kustomization.yaml" "$PREVIOUS_GITOPS_FILE"

          rm -rf \
            "$WORKTREE/infra/kubernetes/base" \
            "$WORKTREE/infra/kubernetes/production"
          mkdir -p "$WORKTREE/infra/kubernetes"

          cp -a infra/kubernetes/base "$WORKTREE/infra/kubernetes/base"
          cp -a infra/kubernetes/production "$WORKTREE/infra/kubernetes/production"

          GITOPS_FILE="$WORKTREE/infra/kubernetes/production/kustomization.yaml"

          DEPLOY_SHA="$DEPLOY_SHA" \
          BLOG_CHANGED="$BLOG_CHANGED" \
          SEARCH_CHANGED="$SEARCH_CHANGED" \
          STATUS_CHANGED="$STATUS_CHANGED" \
          PDF_CHANGED="$PDF_CHANGED" \
          PREVIOUS_GITOPS_FILE="$PREVIOUS_GITOPS_FILE" \
          GITOPS_FILE="$GITOPS_FILE" \
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["GITOPS_FILE"])
          previous_path = Path(os.environ["PREVIOUS_GITOPS_FILE"])
          text = path.read_text(encoding="utf-8")
          previous = previous_path.read_text(encoding="utf-8")
          sha = os.environ["DEPLOY_SHA"]

          changes = {
              "kernel-notes-blog": os.environ["BLOG_CHANGED"] == "true",
              "kernel-notes-search": os.environ["SEARCH_CHANGED"] == "true",
              "kernel-notes-status": os.environ["STATUS_CHANGED"] == "true",
              "kernel-notes-pdf": os.environ["PDF_CHANGED"] == "true",
          }

          def image_tag(source, image):
              pattern = (
                  rf"  - name: ghcr\.io/0b-ivan/{re.escape(image)}\n"
                  rf"    newTag: ([A-Za-z0-9._-]+)"
              )
              match = re.search(pattern, source)
              if not match:
                  raise SystemExit(f"Missing production image pin for {image}")
              return match.group(1)

          for image, changed in changes.items():
              tag = sha if changed else image_tag(previous, image)
              pattern = (
                  rf"(  - name: ghcr\.io/0b-ivan/{re.escape(image)}\n"
                  rf"    newTag: )[A-Za-z0-9._-]+"
              )
              text, count = re.subn(pattern, rf"\g<1>{tag}", text)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one production image pin for {image}, found {count}"
                  )
              print(f"{image}: {'deploy ' + sha if changed else 'keep ' + tag}")

          path.write_text(text, encoding="utf-8")
          PY

          git -C "$WORKTREE" checkout -B "${GITOPS_BRANCH}" "origin/${GITOPS_BRANCH}"
          git -C "$WORKTREE" config user.name 'github-actions[bot]'
          git -C "$WORKTREE" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$WORKTREE" add infra/kubernetes/base infra/kubernetes/production
          git -C "$WORKTREE" diff --cached --check

          if git -C "$WORKTREE" diff --cached --quiet; then
            echo 'K3s production desired state is already current.'
          else
            git -C "$WORKTREE" commit -m "chore(production): deploy ${DEPLOY_SHA} [skip ci]"
            git -C "$WORKTREE" push origin "HEAD:${GITOPS_BRANCH}"
          fi

      - name: Monitor K3s production rollout
        if: steps.changes.outputs.deploy == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.meta.outputs.build_version }}
          BLOG_CHANGED: ${{ steps.changes.outputs.blog }}
          SEARCH_CHANGED: ${{ steps.changes.outputs.search }}
        run: |
          set -euo pipefail

          echo "Monitoring ${K8S_PRODUCTION_URL} during the complete rollout."
          echo "blog_changed=${BLOG_CHANGED} search_changed=${SEARCH_CHANGED}"

          stable_version_checks=0
          healthy_checks=0
          search_ready=false
          min_watch_seconds=30
          if [ "$SEARCH_CHANGED" = true ]; then
            min_watch_seconds=120
          fi

          for attempt in $(seq 1 360); do
            health="$(curl -fsS --max-time 5 -H 'Cache-Control: no-cache' \
              "${K8S_PRODUCTION_URL}/healthz?deploy=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"

            if [ "$health" != ok ]; then
              echo "::error title=Production downtime detected::/healthz failed during rollout at second ${attempt}."
              exit 1
            fi
            healthy_checks=$((healthy_checks + 1))

            build_info="$(curl -fsS --max-time 5 -H 'Cache-Control: no-cache' \
              "${K8S_PRODUCTION_URL}/build-info.json?deploy=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            version="$(printf '%s' "$build_info" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version", ""))' 2>/dev/null || true)"

            if [ "$BLOG_CHANGED" = true ]; then
              if [ "$version" = "$EXPECTED_VERSION" ]; then
                stable_version_checks=$((stable_version_checks + 1))
              else
                stable_version_checks=0
              fi
            else
              stable_version_checks=$healthy_checks
            fi

            if [ $((attempt % 5)) -eq 0 ] || [ "$attempt" -eq 1 ]; then
              search_response="$(curl -fsS --max-time 10 \
                -X POST \
                -H 'Content-Type: application/json' \
                --data '{"q":"Docker","limit":1}' \
                "${K8S_PRODUCTION_URL}/api/search" 2>/dev/null || true)"

              if printf '%s' "$search_response" | python3 -c '
          import json, sys
          try:
              data = json.load(sys.stdin)
          except Exception:
              raise SystemExit(1)
          results = data.get("results")
          raise SystemExit(0 if isinstance(results, list) and results else 1)
          '; then
                search_ready=true
              else
                search_ready=false
              fi
            fi

            version_ready=false
            if [ "$BLOG_CHANGED" = true ]; then
              if [ "$stable_version_checks" -ge 15 ]; then
                version_ready=true
              fi
            elif [ "$healthy_checks" -ge "$min_watch_seconds" ]; then
              version_ready=true
            fi

            if [ "$attempt" -ge "$min_watch_seconds" ] \
              && [ "$version_ready" = true ] \
              && [ "$search_ready" = true ]; then
              echo "K3s production stayed healthy for the rollout."
              if [ "$BLOG_CHANGED" = true ]; then
                echo "Build ${EXPECTED_VERSION} was observed for 15 consecutive checks."
              fi
              exit 0
            fi

            echo "Attempt ${attempt}/360: health=ok version='${version:-unavailable}' stable_version_checks=${stable_version_checks} search_ready=${search_ready}"
            sleep 1
          done

          echo "::error title=Production rollout timeout::Production did not reach a stable healthy state within 360 seconds."
          exit 1

      - name: Verify production LaTeX PDF export
        if: steps.changes.outputs.pdf == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output=/tmp/production-chaos-engineering.pdf
          curl -fsS --max-time 90 \
            "${K8S_PRODUCTION_URL}/download/2026-09-20-chaos-engineering-chaos-monkey-kubernetes.pdf?deploy=${GITHUB_SHA}" \
            -o "$output"
          test "$(head -c 5 "$output")" = '%PDF-'
          test "$(wc -c < "$output")" -gt 10000
          echo 'Production LaTeX PDF export is healthy.'
