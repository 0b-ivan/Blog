name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'posts/**'
      - 'archive/**'
      - 'snippets/**'
      - 'assets/**'
      - 'config/**'
      - 'lib/**'
      - '*.html'
      - '*.js'
      - 'rag/**'
      - 'Dockerfile'
      - 'Dockerfile.search'
      - 'docker-compose.prod.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'VERSION'
      - '.dockerignore'
      - '.github/workflows/cd.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Deployment type
        required: true
        default: full
        type: choice
        options:
          - full
          - content

permissions:
  contents: write
  pull-requests: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BLOG_IMAGE_NAME: kernel-notes-blog
  SEARCH_IMAGE_NAME: kernel-notes-search

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require merged PR for automatic deployments
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            count=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPOSITORY}/commits/${COMMIT_SHA}/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')
            if [ "$count" -ge 1 ]; then
              echo 'Main commit is associated with a merged pull request.'
              exit 0
            fi
            [ "$attempt" -eq 5 ] || sleep 3
          done
          echo 'Refusing deployment: main commit is not associated with a merged pull request.'
          exit 1

      - name: Classify deployment
        id: deploy_mode
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
            if [ "$mode" = "content" ]; then
              content_changed=true
            else
              content_changed=false
            fi
            echo "mode=$mode" >> "$GITHUB_OUTPUT"
            echo "content_changed=$content_changed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > /tmp/deploy-files.txt
          echo 'Deployment-relevant changes:'
          cat /tmp/deploy-files.txt

          mode=content
          content_changed=false

          while IFS= read -r file; do
            case "$file" in
              posts/*|archive/*|snippets/*|assets/posts/*)
                content_changed=true
                ;;
              *)
                mode=full
                ;;
            esac
          done < /tmp/deploy-files.txt

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "content_changed=$content_changed" >> "$GITHUB_OUTPUT"
          echo "Deployment mode: $mode; content_changed=$content_changed"

      - name: Build article version history
        run: node scripts/build-post-history.js

      - name: Package content
        if: steps.deploy_mode.outputs.content_changed == 'true'
        run: |
          tar -czf /tmp/kernel-notes-content.tgz \
            posts \
            archive \
            snippets \
            assets/posts \
            post-history

      - name: Set image names and deployment version
        id: meta
        run: |
          set -euo pipefail
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BLOG_VERSION=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$BLOG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push blog image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.build_version }}
          tags: ${{ steps.meta.outputs.blog_tags }}
          cache-from: type=gha,scope=deploy-blog
          cache-to: type=gha,mode=max,scope=deploy-blog

      - name: Build and push Kernel Grep image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.search
          push: true
          tags: ${{ steps.meta.outputs.search_tags }}
          cache-from: type=gha,scope=deploy-search
          cache-to: type=gha,mode=max,scope=deploy-search

      - name: Validate Hetzner deployment secrets
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          test -n "$HETZNER_HOST" || { echo 'HETZNER_HOST is missing'; exit 1; }
          test -n "$HETZNER_USER" || { echo 'HETZNER_USER is missing'; exit 1; }
          test -n "$HETZNER_SSH_KEY" || { echo 'HETZNER_SSH_KEY is missing'; exit 1; }
          test -n "$HETZNER_KNOWN_HOSTS" || { echo 'HETZNER_KNOWN_HOSTS is missing'; exit 1; }

      - name: Configure SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner_deploy
          chmod 600 ~/.ssh/hetzner_deploy
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload content package
        if: steps.deploy_mode.outputs.content_changed == 'true'
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
        run: |
          PORT="${HETZNER_PORT:-22}"
          scp -i ~/.ssh/hetzner_deploy -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            /tmp/kernel-notes-content.tgz \
            "${HETZNER_USER}@${HETZNER_HOST}:/tmp/kernel-notes-content-${{ github.sha }}.tgz"

      - name: Copy production Compose file
        if: steps.deploy_mode.outputs.mode == 'full'
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
        run: |
          PORT="${HETZNER_PORT:-22}"
          scp -i ~/.ssh/hetzner_deploy -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            docker-compose.prod.yml \
            "${HETZNER_USER}@${HETZNER_HOST}:/tmp/kernel-notes-compose.yml"

      - name: Login Hetzner host to GHCR
        if: steps.deploy_mode.outputs.mode == 'full'
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          PORT="${HETZNER_PORT:-22}"
          printf '%s' "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/hetzner_deploy -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${HETZNER_USER}@${HETZNER_HOST}" \
            "docker login ghcr.io -u '${GHCR_USER}' --password-stdin"

      - name: Deploy content only
        if: steps.deploy_mode.outputs.mode == 'content'
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          PORT="${HETZNER_PORT:-22}"
          ssh -i ~/.ssh/hetzner_deploy -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${HETZNER_USER}@${HETZNER_HOST}" bash -s -- "$COMMIT_SHA" <<'REMOTE'
          set -euo pipefail
          COMMIT_SHA="$1"
          ARCHIVE="/tmp/kernel-notes-content-${COMMIT_SHA}.tgz"
          STAGE="/tmp/kernel-notes-content-${COMMIT_SHA}"
          HELPER_IMAGE="alpine:3.22"
          SEARCH_CONTAINER="kernel-notes-search"

          retry_get() {
            url="$1"
            for attempt in $(seq 1 10); do
              if curl -fsS --max-time 10 "$url" >/dev/null; then
                return 0
              fi
              echo "GET retry ${attempt}/10: ${url}" >&2
              sleep 2
            done
            return 1
          }

          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"
          docker pull "$HELPER_IMAGE" >/dev/null

          sync_volume() {
            volume="$1"
            source="$2"
            docker volume create "$volume" >/dev/null
            docker run --rm -v "${volume}:/target" -v "${source}:/source:ro" "$HELPER_IMAGE" \
              sh -c 'set -eu; find /target -mindepth 1 -maxdepth 1 -exec rm -rf {} +; cp -a /source/. /target/'
          }

          sync_volume kernel-notes-blog-posts "$STAGE/posts"
          sync_volume kernel-notes-blog-snippets "$STAGE/snippets"
          sync_volume kernel-notes-blog-post-assets "$STAGE/assets/posts"
          sync_volume kernel-notes-blog-archive "$STAGE/archive"
          sync_volume kernel-notes-blog-history "$STAGE/post-history"
          rm -rf "$STAGE" "$ARCHIVE"

          if docker inspect "$SEARCH_CONTAINER" >/dev/null 2>&1; then
            echo 'Refreshing Kernel Grep index without restarting the search container.'
            if ! docker exec "$SEARCH_CONTAINER" node reindex.js; then
              echo 'Kernel Grep live reindex failed.'
              docker logs --tail=120 "$SEARCH_CONTAINER" || true
              exit 1
            fi
          fi

          if ! retry_get http://127.0.0.1:1888/healthz \
            || ! retry_get http://127.0.0.1:1888/api/posts \
            || ! retry_get http://127.0.0.1:1888/archive; then
            echo 'Content deployment smoke check failed.'
            docker logs --tail=100 kernel-notes-blog || true
            exit 1
          fi

          echo "Content ${COMMIT_SHA} deployed without rebuilding application images or restarting Kernel Grep."
          REMOTE

      - name: Deploy full application
        if: steps.deploy_mode.outputs.mode == 'full'
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          BLOG_IMAGE: ${{ steps.meta.outputs.blog_image }}
          SEARCH_IMAGE: ${{ steps.meta.outputs.search_image }}
          CONTENT_CHANGED: ${{ steps.deploy_mode.outputs.content_changed }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          PORT="${HETZNER_PORT:-22}"
          ssh -i ~/.ssh/hetzner_deploy -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${HETZNER_USER}@${HETZNER_HOST}" \
            bash -s -- "$BLOG_IMAGE" "$SEARCH_IMAGE" "$CONTENT_CHANGED" "$COMMIT_SHA" <<'REMOTE'
          set -euo pipefail
          BLOG_IMAGE="$1"
          SEARCH_IMAGE="$2"
          CONTENT_CHANGED="$3"
          COMMIT_SHA="$4"
          DEPLOY_DIR="/opt/Blog"
          COMPOSE_FILE="${DEPLOY_DIR}/docker-compose.prod.yml"
          ENV_FILE="${DEPLOY_DIR}/.env.production"
          BLOG_CONTAINER="kernel-notes-blog"
          SEARCH_CONTAINER="kernel-notes-search"
          EXPECTED_HOST_PORT="1888"

          wait_for_health() {
            container="$1"
            attempts="$2"
            for attempt in $(seq 1 "$attempts"); do
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container" 2>/dev/null || true)"
              if [ "$status" = healthy ]; then
                return 0
              fi
              if [ "$status" = unhealthy ]; then
                echo "${container} unhealthy (${attempt}/${attempts})" >&2
              fi
              sleep 2
            done
            return 1
          }

          retry_get() {
            url="$1"
            for attempt in $(seq 1 10); do
              if curl -fsS --max-time 15 "$url" >/dev/null; then
                return 0
              fi
              echo "GET retry ${attempt}/10: ${url}" >&2
              sleep 2
            done
            return 1
          }

          retry_post() {
            url="$1"
            payload="$2"
            for attempt in $(seq 1 10); do
              response="$(curl -fsS --max-time 20 -X POST -H 'Content-Type: application/json' --data "$payload" "$url" 2>/dev/null)" && {
                printf '%s' "$response"
                return 0
              }
              echo "POST retry ${attempt}/10: ${url}" >&2
              sleep 2
            done
            return 1
          }

          mkdir -p "$DEPLOY_DIR"
          mv /tmp/kernel-notes-compose.yml "$COMPOSE_FILE"

          PREVIOUS_BLOG_IMAGE="$(docker inspect -f '{{.Config.Image}}' "$BLOG_CONTAINER" 2>/dev/null || true)"
          PREVIOUS_SEARCH_IMAGE="$(docker inspect -f '{{.Config.Image}}' "$SEARCH_CONTAINER" 2>/dev/null || true)"
          printf 'BLOG_IMAGE=%s\nSEARCH_IMAGE=%s\n' "$BLOG_IMAGE" "$SEARCH_IMAGE" > "$ENV_FILE"
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" pull blog search

          rollback_deployment() {
            reason="$1"
            echo "Deployment failed: ${reason}"
            echo 'Container status:'
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" ps || true
            echo 'Recent container logs:'
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" logs --tail=120 blog search || true
            printf 'BLOG_IMAGE=%s\nSEARCH_IMAGE=%s\n' "${PREVIOUS_BLOG_IMAGE:-$BLOG_IMAGE}" "${PREVIOUS_SEARCH_IMAGE:-$SEARCH_IMAGE}" > "$ENV_FILE"
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --remove-orphans || true
          }

          if [ "$CONTENT_CHANGED" = true ]; then
            ARCHIVE="/tmp/kernel-notes-content-${COMMIT_SHA}.tgz"
            STAGE="/tmp/kernel-notes-content-${COMMIT_SHA}"
            HELPER_IMAGE="alpine:3.22"
            rm -rf "$STAGE"
            mkdir -p "$STAGE"
            tar -xzf "$ARCHIVE" -C "$STAGE"
            docker pull "$HELPER_IMAGE" >/dev/null

            sync_volume() {
              volume="$1"
              source="$2"
              docker volume create "$volume" >/dev/null
              docker run --rm -v "${volume}:/target" -v "${source}:/source:ro" "$HELPER_IMAGE" \
                sh -c 'set -eu; find /target -mindepth 1 -maxdepth 1 -exec rm -rf {} +; cp -a /source/. /target/'
            }

            sync_volume kernel-notes-blog-posts "$STAGE/posts"
            sync_volume kernel-notes-blog-snippets "$STAGE/snippets"
            sync_volume kernel-notes-blog-post-assets "$STAGE/assets/posts"
            sync_volume kernel-notes-blog-archive "$STAGE/archive"
            sync_volume kernel-notes-blog-history "$STAGE/post-history"
            rm -rf "$STAGE" "$ARCHIVE"
          fi

          for volume in \
            kernel-notes-blog-posts \
            kernel-notes-blog-snippets \
            kernel-notes-blog-post-assets \
            kernel-notes-blog-archive \
            kernel-notes-blog-history; do
            docker volume inspect "$volume" >/dev/null 2>&1 || docker volume create "$volume" >/dev/null
          done

          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --remove-orphans

          PUBLISHED="$(docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" port blog 8080 2>/dev/null || true)"
          HEALTH_PORT="${PUBLISHED##*:}"
          if [ "$HEALTH_PORT" != "$EXPECTED_HOST_PORT" ]; then
            rollback_deployment "unexpected blog port: ${PUBLISHED:-not published}"
            exit 1
          fi

          if ! wait_for_health "$BLOG_CONTAINER" 60; then
            rollback_deployment 'blog container did not become healthy'
            exit 1
          fi

          if ! wait_for_health "$SEARCH_CONTAINER" 180; then
            rollback_deployment 'search container did not become healthy'
            exit 1
          fi

          if ! retry_get "http://127.0.0.1:${HEALTH_PORT}/healthz" \
            || ! retry_get "http://127.0.0.1:${HEALTH_PORT}/archive" \
            || ! retry_get "http://127.0.0.1:${HEALTH_PORT}/grep"; then
            rollback_deployment 'HTTP smoke check failed'
            exit 1
          fi

          if ! SEARCH_RESPONSE="$(retry_post "http://127.0.0.1:${HEALTH_PORT}/api/search" '{"q":"Docker","limit":1}')"; then
            rollback_deployment 'Kernel Grep search request failed'
            exit 1
          fi
          if ! printf '%s' "$SEARCH_RESPONSE" | grep -Eq '"results":\[[^]]'; then
            rollback_deployment 'Kernel Grep returned no result for Docker'
            exit 1
          fi

          if ! NOISE_RESPONSE="$(retry_post "http://127.0.0.1:${HEALTH_PORT}/api/search" '{"q":"aksdfnasdglvhnasdf","limit":8}')"; then
            rollback_deployment 'Kernel Grep noise request failed'
            exit 1
          fi
          if ! printf '%s' "$NOISE_RESPONSE" | grep -q '"results":\[\]'; then
            rollback_deployment 'Kernel Grep returned results for the noise query'
            exit 1
          fi

          docker image prune -f >/dev/null
          echo "Full deployment ${COMMIT_SHA} completed on port ${HEALTH_PORT}."
          REMOTE
; then
            echo "Invalid VERSION: $BLOG_VERSION"
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA:0:12}"
          BUILD_VERSION="${BLOG_VERSION}+${SHORT_SHA}"
          BLOG_IMAGE="${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.BLOG_IMAGE_NAME }}:${{ github.sha }}"
          SEARCH_IMAGE="${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.SEARCH_IMAGE_NAME }}:${{ github.sha }}"

          echo "owner_lower=${OWNER_LOWER}" >> "$GITHUB_OUTPUT"
          echo "blog_version=${BLOG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "blog_image=${BLOG_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "search_image=${SEARCH_IMAGE}" >> "$GITHUB_OUTPUT"

          {
            echo 'blog_tags<<EOF'
            echo "$BLOG_IMAGE"
            if [ "${{ steps.deploy_mode.outputs.mode }}" = full ]; then
              echo "${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.BLOG_IMAGE_NAME }}:${BLOG_VERSION}"
            fi
            echo "${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.BLOG_IMAGE_NAME }}:latest"
            echo EOF

            echo 'search_tags<<EOF'
            echo "$SEARCH_IMAGE"
            if [ "${{ steps.deploy_mode.outputs.mode }}" = full ]; then
              echo "${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.SEARCH_IMAGE_NAME }}:${BLOG_VERSION}"
            fi
            echo "${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.SEARCH_IMAGE_NAME }}:latest"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        if: steps.deploy_mode.outputs.mode == 'full'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GHCR
        if: steps.deploy_mode.outputs.mode == 'full'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push blog image
        if: steps.deploy_mode.outputs.mode == 'full'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.blog_version }}
          tags: |
            ${{ steps.meta.outputs.blog_image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ env.BLOG_IMAGE_NAME }}:${{ steps.meta.outputs.blog_version }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ env.BLOG_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=deploy-blog
          cache-to: type=gha,mode=max,scope=deploy-blog

      - name: Build and push Kernel Grep image
        if: steps.deploy_mode.outputs.mode == 'full'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.search
          push: true
          tags: |
            ${{ steps.meta.outputs.search_image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ env.SEARCH_IMAGE_NAME }}:${{ steps.meta.outputs.blog_version }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ env.SEARCH_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=deploy-search
          cache-to: type=gha,mode=max,scope=deploy-search

      - name: Validate Hetzner deployment secrets
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          test -n "$HETZNER_HOST" || { echo 'HETZNER_HOST is missing'; exit 1; }
          test -n "$HETZNER_USER" || { echo 'HETZNER_USER is missing'; exit 1; }
          test -n "$HETZNER_SSH_KEY" || { echo 'HETZNER_SSH_KEY is missing'; exit 1; }
          test -n "$HETZNER_KNOWN_HOSTS" || { echo 'HETZNER_KNOWN_HOSTS is missing'; exit 1; }

      - name: Configure SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner_deploy
          chmod 600 ~/.ssh/hetzner_deploy
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload content package
        if: steps.deploy_mode.outputs.content_changed == 'true'
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
        run: |
          PORT="${HETZNER_PORT:-22}"
          scp -i ~/.ssh/hetzner_deploy -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            /tmp/kernel-notes-content.tgz \
            "${HETZNER_USER}@${HETZNER_HOST}:/tmp/kernel-notes-content-${{ github.sha }}.tgz"

      - name: Copy production Compose file
        if: steps.deploy_mode.outputs.mode == 'full'
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
        run: |
          PORT="${HETZNER_PORT:-22}"
          scp -i ~/.ssh/hetzner_deploy -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            docker-compose.prod.yml \
            "${HETZNER_USER}@${HETZNER_HOST}:/tmp/kernel-notes-compose.yml"

      - name: Login Hetzner host to GHCR
        if: steps.deploy_mode.outputs.mode == 'full'
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          PORT="${HETZNER_PORT:-22}"
          printf '%s' "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/hetzner_deploy -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${HETZNER_USER}@${HETZNER_HOST}" \
            "docker login ghcr.io -u '${GHCR_USER}' --password-stdin"

      - name: Deploy content only
        if: steps.deploy_mode.outputs.mode == 'content'
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          PORT="${HETZNER_PORT:-22}"
          ssh -i ~/.ssh/hetzner_deploy -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${HETZNER_USER}@${HETZNER_HOST}" bash -s -- "$COMMIT_SHA" <<'REMOTE'
          set -euo pipefail
          COMMIT_SHA="$1"
          ARCHIVE="/tmp/kernel-notes-content-${COMMIT_SHA}.tgz"
          STAGE="/tmp/kernel-notes-content-${COMMIT_SHA}"
          HELPER_IMAGE="alpine:3.22"
          SEARCH_CONTAINER="kernel-notes-search"

          retry_get() {
            url="$1"
            for attempt in $(seq 1 10); do
              if curl -fsS --max-time 10 "$url" >/dev/null; then
                return 0
              fi
              echo "GET retry ${attempt}/10: ${url}" >&2
              sleep 2
            done
            return 1
          }

          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"
          docker pull "$HELPER_IMAGE" >/dev/null

          sync_volume() {
            volume="$1"
            source="$2"
            docker volume create "$volume" >/dev/null
            docker run --rm -v "${volume}:/target" -v "${source}:/source:ro" "$HELPER_IMAGE" \
              sh -c 'set -eu; find /target -mindepth 1 -maxdepth 1 -exec rm -rf {} +; cp -a /source/. /target/'
          }

          sync_volume kernel-notes-blog-posts "$STAGE/posts"
          sync_volume kernel-notes-blog-snippets "$STAGE/snippets"
          sync_volume kernel-notes-blog-post-assets "$STAGE/assets/posts"
          sync_volume kernel-notes-blog-archive "$STAGE/archive"
          sync_volume kernel-notes-blog-history "$STAGE/post-history"
          rm -rf "$STAGE" "$ARCHIVE"

          if docker inspect "$SEARCH_CONTAINER" >/dev/null 2>&1; then
            echo 'Refreshing Kernel Grep index without restarting the search container.'
            if ! docker exec "$SEARCH_CONTAINER" node reindex.js; then
              echo 'Kernel Grep live reindex failed.'
              docker logs --tail=120 "$SEARCH_CONTAINER" || true
              exit 1
            fi
          fi

          if ! retry_get http://127.0.0.1:1888/healthz \
            || ! retry_get http://127.0.0.1:1888/api/posts \
            || ! retry_get http://127.0.0.1:1888/archive; then
            echo 'Content deployment smoke check failed.'
            docker logs --tail=100 kernel-notes-blog || true
            exit 1
          fi

          echo "Content ${COMMIT_SHA} deployed without rebuilding application images or restarting Kernel Grep."
          REMOTE

      - name: Deploy full application
        if: steps.deploy_mode.outputs.mode == 'full'
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          BLOG_IMAGE: ${{ steps.meta.outputs.blog_image }}
          SEARCH_IMAGE: ${{ steps.meta.outputs.search_image }}
          CONTENT_CHANGED: ${{ steps.deploy_mode.outputs.content_changed }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          PORT="${HETZNER_PORT:-22}"
          ssh -i ~/.ssh/hetzner_deploy -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${HETZNER_USER}@${HETZNER_HOST}" \
            bash -s -- "$BLOG_IMAGE" "$SEARCH_IMAGE" "$CONTENT_CHANGED" "$COMMIT_SHA" <<'REMOTE'
          set -euo pipefail
          BLOG_IMAGE="$1"
          SEARCH_IMAGE="$2"
          CONTENT_CHANGED="$3"
          COMMIT_SHA="$4"
          DEPLOY_DIR="/opt/Blog"
          COMPOSE_FILE="${DEPLOY_DIR}/docker-compose.prod.yml"
          ENV_FILE="${DEPLOY_DIR}/.env.production"
          BLOG_CONTAINER="kernel-notes-blog"
          SEARCH_CONTAINER="kernel-notes-search"
          EXPECTED_HOST_PORT="1888"

          wait_for_health() {
            container="$1"
            attempts="$2"
            for attempt in $(seq 1 "$attempts"); do
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container" 2>/dev/null || true)"
              if [ "$status" = healthy ]; then
                return 0
              fi
              if [ "$status" = unhealthy ]; then
                echo "${container} unhealthy (${attempt}/${attempts})" >&2
              fi
              sleep 2
            done
            return 1
          }

          retry_get() {
            url="$1"
            for attempt in $(seq 1 10); do
              if curl -fsS --max-time 15 "$url" >/dev/null; then
                return 0
              fi
              echo "GET retry ${attempt}/10: ${url}" >&2
              sleep 2
            done
            return 1
          }

          retry_post() {
            url="$1"
            payload="$2"
            for attempt in $(seq 1 10); do
              response="$(curl -fsS --max-time 20 -X POST -H 'Content-Type: application/json' --data "$payload" "$url" 2>/dev/null)" && {
                printf '%s' "$response"
                return 0
              }
              echo "POST retry ${attempt}/10: ${url}" >&2
              sleep 2
            done
            return 1
          }

          mkdir -p "$DEPLOY_DIR"
          mv /tmp/kernel-notes-compose.yml "$COMPOSE_FILE"

          PREVIOUS_BLOG_IMAGE="$(docker inspect -f '{{.Config.Image}}' "$BLOG_CONTAINER" 2>/dev/null || true)"
          PREVIOUS_SEARCH_IMAGE="$(docker inspect -f '{{.Config.Image}}' "$SEARCH_CONTAINER" 2>/dev/null || true)"
          printf 'BLOG_IMAGE=%s\nSEARCH_IMAGE=%s\n' "$BLOG_IMAGE" "$SEARCH_IMAGE" > "$ENV_FILE"
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" pull blog search

          rollback_deployment() {
            reason="$1"
            echo "Deployment failed: ${reason}"
            echo 'Container status:'
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" ps || true
            echo 'Recent container logs:'
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" logs --tail=120 blog search || true
            printf 'BLOG_IMAGE=%s\nSEARCH_IMAGE=%s\n' "${PREVIOUS_BLOG_IMAGE:-$BLOG_IMAGE}" "${PREVIOUS_SEARCH_IMAGE:-$SEARCH_IMAGE}" > "$ENV_FILE"
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --remove-orphans || true
          }

          if [ "$CONTENT_CHANGED" = true ]; then
            ARCHIVE="/tmp/kernel-notes-content-${COMMIT_SHA}.tgz"
            STAGE="/tmp/kernel-notes-content-${COMMIT_SHA}"
            HELPER_IMAGE="alpine:3.22"
            rm -rf "$STAGE"
            mkdir -p "$STAGE"
            tar -xzf "$ARCHIVE" -C "$STAGE"
            docker pull "$HELPER_IMAGE" >/dev/null

            sync_volume() {
              volume="$1"
              source="$2"
              docker volume create "$volume" >/dev/null
              docker run --rm -v "${volume}:/target" -v "${source}:/source:ro" "$HELPER_IMAGE" \
                sh -c 'set -eu; find /target -mindepth 1 -maxdepth 1 -exec rm -rf {} +; cp -a /source/. /target/'
            }

            sync_volume kernel-notes-blog-posts "$STAGE/posts"
            sync_volume kernel-notes-blog-snippets "$STAGE/snippets"
            sync_volume kernel-notes-blog-post-assets "$STAGE/assets/posts"
            sync_volume kernel-notes-blog-archive "$STAGE/archive"
            sync_volume kernel-notes-blog-history "$STAGE/post-history"
            rm -rf "$STAGE" "$ARCHIVE"
          fi

          for volume in \
            kernel-notes-blog-posts \
            kernel-notes-blog-snippets \
            kernel-notes-blog-post-assets \
            kernel-notes-blog-archive \
            kernel-notes-blog-history; do
            docker volume inspect "$volume" >/dev/null 2>&1 || docker volume create "$volume" >/dev/null
          done

          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --remove-orphans

          PUBLISHED="$(docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" port blog 8080 2>/dev/null || true)"
          HEALTH_PORT="${PUBLISHED##*:}"
          if [ "$HEALTH_PORT" != "$EXPECTED_HOST_PORT" ]; then
            rollback_deployment "unexpected blog port: ${PUBLISHED:-not published}"
            exit 1
          fi

          if ! wait_for_health "$BLOG_CONTAINER" 60; then
            rollback_deployment 'blog container did not become healthy'
            exit 1
          fi

          if ! wait_for_health "$SEARCH_CONTAINER" 180; then
            rollback_deployment 'search container did not become healthy'
            exit 1
          fi

          if ! retry_get "http://127.0.0.1:${HEALTH_PORT}/healthz" \
            || ! retry_get "http://127.0.0.1:${HEALTH_PORT}/archive" \
            || ! retry_get "http://127.0.0.1:${HEALTH_PORT}/grep"; then
            rollback_deployment 'HTTP smoke check failed'
            exit 1
          fi

          if ! SEARCH_RESPONSE="$(retry_post "http://127.0.0.1:${HEALTH_PORT}/api/search" '{"q":"Docker","limit":1}')"; then
            rollback_deployment 'Kernel Grep search request failed'
            exit 1
          fi
          if ! printf '%s' "$SEARCH_RESPONSE" | grep -Eq '"results":\[[^]]'; then
            rollback_deployment 'Kernel Grep returned no result for Docker'
            exit 1
          fi

          if ! NOISE_RESPONSE="$(retry_post "http://127.0.0.1:${HEALTH_PORT}/api/search" '{"q":"aksdfnasdglvhnasdf","limit":8}')"; then
            rollback_deployment 'Kernel Grep noise request failed'
            exit 1
          fi
          if ! printf '%s' "$NOISE_RESPONSE" | grep -q '"results":\[\]'; then
            rollback_deployment 'Kernel Grep returned results for the noise query'
            exit 1
          fi

          docker image prune -f >/dev/null
          echo "Full deployment ${COMMIT_SHA} completed on port ${HEALTH_PORT}."
          REMOTE
 

      - name: Publish K3s production desired state
        env:
          DEPLOY_SHA: ${{ github.sha }}
          GITOPS_BRANCH: production-gitops
        run: |
          set -euo pipefail

          WORKTREE=/tmp/kernel-notes-production-gitops
          rm -rf "$WORKTREE"
          git fetch origin "$GITOPS_BRANCH"
          git worktree add --detach "$WORKTREE" "origin/$GITOPS_BRANCH"

          rm -rf             "$WORKTREE/infra/kubernetes/base"             "$WORKTREE/infra/kubernetes/production"
          mkdir -p "$WORKTREE/infra/kubernetes"
          cp -a infra/kubernetes/base "$WORKTREE/infra/kubernetes/base"
          cp -a infra/kubernetes/production "$WORKTREE/infra/kubernetes/production"

          GITOPS_FILE="$WORKTREE/infra/kubernetes/production/kustomization.yaml"
          DEPLOY_SHA="$DEPLOY_SHA" GITOPS_FILE="$GITOPS_FILE" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["GITOPS_FILE"])
          text = path.read_text(encoding="utf-8")
          sha = os.environ["DEPLOY_SHA"]

          for image in ("kernel-notes-blog", "kernel-notes-search"):
              pattern = (
                  rf"(  - name: ghcr\.io/0b-ivan/{re.escape(image)}\n"
                  rf"    newTag: )[A-Za-z0-9._-]+"
              )
              text, count = re.subn(pattern, rf"\g<1>{sha}", text)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one production image pin for {image}, found {count}"
                  )

          path.write_text(text, encoding="utf-8")
          PY

          git -C "$WORKTREE" checkout -B "$GITOPS_BRANCH" "origin/$GITOPS_BRANCH"
          git -C "$WORKTREE" config user.name 'github-actions[bot]'
          git -C "$WORKTREE" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$WORKTREE" add infra/kubernetes/base infra/kubernetes/production
          git -C "$WORKTREE" diff --cached --check

          if git -C "$WORKTREE" diff --cached --quiet; then
            echo "K3s production is already pinned to $DEPLOY_SHA."
          else
            git -C "$WORKTREE" commit -m "chore(production): deploy ${DEPLOY_SHA} [skip ci]"
            git -C "$WORKTREE" push origin "HEAD:$GITOPS_BRANCH"
          fi

      - name: Wait for K3s production canary
        env:
          EXPECTED_VERSION: ${{ steps.meta.outputs.build_version }}
          K8S_PRODUCTION_URL: https://k8s-blog.obivan.org
        run: |
          set -euo pipefail
          echo "Waiting for K3s production build ${EXPECTED_VERSION}."

          for attempt in $(seq 1 90); do
            health="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache'               "${K8S_PRODUCTION_URL}/healthz?deploy=${GITHUB_SHA}" 2>/dev/null || true)"
            build_info="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache'               "${K8S_PRODUCTION_URL}/build-info.json?deploy=${GITHUB_SHA}" 2>/dev/null || true)"
            version="$(printf '%s' "$build_info" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version", ""))' 2>/dev/null || true)"

            if [ "$health" = ok ] && [ "$version" = "$EXPECTED_VERSION" ]; then
              response="$(curl -fsS --max-time 30                 -X POST                 -H 'Content-Type: application/json'                 --data '{"q":"Docker","limit":1}'                 "${K8S_PRODUCTION_URL}/api/search")"
              printf '%s' "$response" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          results = data.get("results")
          if not isinstance(results, list) or not results:
              raise SystemExit("Kernel Grep returned no result for Docker")
          '
              echo "K3s production is serving ${EXPECTED_VERSION}."
              exit 0
            fi

            echo "Attempt ${attempt}/90: health='${health:-unavailable}', version='${version:-unavailable}'"
            sleep 10
          done

          echo "Timed out waiting for K3s production build ${EXPECTED_VERSION}." >&2
          exit 1
