name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BLOG_IMAGE_NAME: kernel-notes-blog
  FUNCTION_IMAGE_NAME: kernel-notes-function

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      function_image: ${{ steps.meta.outputs.function_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image names
        id: meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lower=${OWNER_LOWER}" >> "$GITHUB_OUTPUT"
          echo "function_image=${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.FUNCTION_IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "blog_image=${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.BLOG_IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push blog image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.blog_image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ env.BLOG_IMAGE_NAME }}:latest

      - name: Build and push function image
        uses: docker/build-push-action@v6
        with:
          context: ./faasd/function-blog
          file: ./faasd/function-blog/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.function_image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ env.FUNCTION_IMAGE_NAME }}:latest

  deploy-to-faasd:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Check deploy secrets
        id: check
        env:
          OPENFAAS_URL: ${{ secrets.OPENFAAS_URL }}
          OPENFAAS_USERNAME: ${{ secrets.OPENFAAS_USERNAME }}
          OPENFAAS_PASSWORD: ${{ secrets.OPENFAAS_PASSWORD }}
        run: |
          if [[ -z "${OPENFAAS_URL}" || -z "${OPENFAAS_USERNAME}" || -z "${OPENFAAS_PASSWORD}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OpenFaaS secrets fehlen. Deploy wird uebersprungen."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install faas-cli
        if: steps.check.outputs.enabled == 'true'
        run: curl -sSLf https://cli.openfaas.com | sudo sh

      - name: Login and deploy function
        if: steps.check.outputs.enabled == 'true'
        env:
          OPENFAAS_URL: ${{ secrets.OPENFAAS_URL }}
          OPENFAAS_USERNAME: ${{ secrets.OPENFAAS_USERNAME }}
          OPENFAAS_PASSWORD: ${{ secrets.OPENFAAS_PASSWORD }}
          OPENFAAS_INSECURE: ${{ secrets.OPENFAAS_INSECURE }}
          FUNCTION_IMAGE: ${{ needs.build-and-push.outputs.function_image }}
        run: |
          TLS_ARG=""
          if [[ "${OPENFAAS_INSECURE}" == "true" ]]; then
            TLS_ARG="--tls-no-verify"
          fi

          echo "${OPENFAAS_PASSWORD}" | faas-cli login \
            -g "${OPENFAAS_URL}" \
            --username "${OPENFAAS_USERNAME}" \
            --password-stdin ${TLS_ARG}

          faas-cli deploy \
            -g "${OPENFAAS_URL}" \
            --name kernel-notes \
            --image "${FUNCTION_IMAGE}" \
            --replace ${TLS_ARG}
