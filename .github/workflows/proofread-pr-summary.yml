name: Proofread PR Summary

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'posts/*.md'
      - 'config/proofread-words.txt'
      - 'cspell.json'
      - 'scripts/spellcheck-posts.js'
      - 'scripts/proofread-posts.js'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: proofread-pr-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  proofread-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check spelling with CSpell
        id: spellcheck
        shell: bash
        run: |
          set +e
          npm run posts:spellcheck
          status=$?
          set -e

          echo "status=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" -gt 1 ]; then
            echo 'CSpell failed to run.'
            exit "$status"
          fi

          if [ "$status" -eq 1 ]; then
            echo 'CSpell found spelling suggestions. This remains non-blocking.'
          fi

      - name: Start LanguageTool
        run: |
          docker run -d \
            --name languagetool \
            -p 127.0.0.1:8010:8081 \
            meyay/languagetool:latest

          for _ in $(seq 1 60); do
            if curl -fsS -X POST \
              -d 'language=de-DE' \
              -d 'text=Das ist ein Test.' \
              http://127.0.0.1:8010/v2/check >/dev/null; then
              echo 'LanguageTool is ready'
              exit 0
            fi
            sleep 2
          done

          docker logs languagetool || true
          echo 'LanguageTool did not become ready.'
          exit 1

      - name: Check grammar with LanguageTool
        id: proofread
        env:
          LANGUAGETOOL_URL: http://127.0.0.1:8010/v2/check
          PROOFREAD_LANGUAGE: de-DE
        shell: bash
        run: |
          set +e
          npm run posts:proofread
          status=$?
          set -e

          echo "status=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" -eq 2 ]; then
            echo 'Proofreading failed because LanguageTool or the script could not run.'
            exit 2
          fi

          if [ "$status" -gt 2 ]; then
            echo 'Proofreading failed unexpectedly.'
            exit "$status"
          fi

          if [ "$status" -eq 1 ]; then
            echo 'LanguageTool found grammar or style suggestions. This remains non-blocking.'
          fi

      - name: Stop LanguageTool
        if: always()
        run: docker rm -f languagetool >/dev/null 2>&1 || true

      - name: Create or update proofreading comment
        if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- kernel-notes-proofread-summary -->';
            const spelling = '${{ steps.spellcheck.outputs.status }}';
            const grammar = '${{ steps.proofread.outputs.status }}';

            const spellingLine = spelling === '0'
              ? '✅ Rechtschreibung (CSpell): keine Probleme gefunden'
              : spelling === '1'
                ? '⚠️ Rechtschreibung (CSpell): Hinweise gefunden'
                : '❌ Rechtschreibung (CSpell): Prüfung konnte nicht abgeschlossen werden';

            const grammarLine = grammar === '0'
              ? '✅ Grammatik (LanguageTool, de-DE): keine Probleme gefunden'
              : grammar === '1'
                ? '⚠️ Grammatik (LanguageTool, de-DE): Hinweise gefunden'
                : '❌ Grammatik (LanguageTool, de-DE): Prüfung konnte nicht abgeschlossen werden';

            let headline;
            if (spelling === '0' && grammar === '0') {
              headline = '✅ **Keine Rechtschreib- oder Grammatikprobleme gefunden.**';
            } else if (['0', '1'].includes(spelling) && ['0', '1'].includes(grammar)) {
              headline = '⚠️ **Die Textprüfung hat Hinweise gefunden.**';
            } else {
              headline = '❌ **Die Textprüfung konnte nicht vollständig abgeschlossen werden.**';
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## 📝 Textprüfung',
              '',
              headline,
              '',
              spellingLine,
              grammarLine,
              '',
              `[PR Checks ansehen](${runUrl})`,
              '',
              '<sub>Der Kommentar wird bei weiteren Änderungen aktualisiert.</sub>'
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });

            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
