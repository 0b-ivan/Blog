name: Textprüfung

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'posts/*.md'

permissions:
  contents: read

concurrency:
  group: textpruefung-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  text-check:
    name: Rechtschreibung & Grammatik
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Geänderte Blogposts bestimmen
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}"...HEAD \
            -- 'posts/*.md' > /tmp/changed-posts.txt

          echo 'Geänderte Blogposts:'
          cat /tmp/changed-posts.txt

          if [ ! -s /tmp/changed-posts.txt ]; then
            echo 'Keine geänderten Markdown-Posts gefunden.'
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rechtschreibung mit CSpell prüfen
        id: spellcheck
        shell: bash
        run: |
          mapfile -t files < /tmp/changed-posts.txt

          set +e
          npm run posts:spellcheck -- "${files[@]}"
          status=$?
          set -e

          echo "status=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" -gt 1 ]; then
            echo 'CSpell konnte nicht ausgeführt werden.'
            exit "$status"
          fi

          if [ "$status" -eq 1 ]; then
            echo 'CSpell hat Hinweise gefunden. Die Hinweise sind non-blocking.'
          fi

      - name: LanguageTool starten
        run: |
          docker run -d \
            --name languagetool \
            -p 127.0.0.1:8010:8081 \
            meyay/languagetool:latest

          for _ in $(seq 1 60); do
            if curl -fsS -X POST \
              -d 'language=de-DE' \
              -d 'text=Das ist ein Test.' \
              http://127.0.0.1:8010/v2/check >/dev/null; then
              echo 'LanguageTool ist bereit.'
              exit 0
            fi
            sleep 2
          done

          docker logs languagetool || true
          echo 'LanguageTool wurde nicht rechtzeitig bereit.'
          exit 1

      - name: Grammatik mit LanguageTool prüfen
        id: proofread
        env:
          LANGUAGETOOL_URL: http://127.0.0.1:8010/v2/check
          PROOFREAD_LANGUAGE: de-DE
        shell: bash
        run: |
          mapfile -t files < /tmp/changed-posts.txt

          set +e
          npm run posts:proofread -- "${files[@]}"
          status=$?
          set -e

          echo "status=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" -eq 2 ]; then
            echo 'LanguageTool oder das Proofread-Skript konnte nicht ausgeführt werden.'
            exit 2
          fi

          if [ "$status" -gt 2 ]; then
            echo 'Die Textprüfung ist unerwartet fehlgeschlagen.'
            exit "$status"
          fi

          if [ "$status" -eq 1 ]; then
            echo 'LanguageTool hat Hinweise gefunden. Die Hinweise sind non-blocking.'
          fi

      - name: LanguageTool stoppen
        if: always()
        run: docker rm -f languagetool >/dev/null 2>&1 || true

      - name: Ergebnis der Textprüfung zusammenfassen
        if: always()
        shell: bash
        env:
          SPELLING_STATUS: ${{ steps.spellcheck.outputs.status }}
          GRAMMAR_STATUS: ${{ steps.proofread.outputs.status }}
        run: |
          {
            echo '## 📝 Textprüfung'
            echo

            if [ "$SPELLING_STATUS" = '0' ] && [ "$GRAMMAR_STATUS" = '0' ]; then
              echo '✅ **Keine Rechtschreib- oder Grammatikprobleme gefunden.**'
            elif { [ "$SPELLING_STATUS" = '0' ] || [ "$SPELLING_STATUS" = '1' ]; } \
              && { [ "$GRAMMAR_STATUS" = '0' ] || [ "$GRAMMAR_STATUS" = '1' ]; }; then
              echo '⚠️ **Die Textprüfung hat Hinweise gefunden.**'
            else
              echo '❌ **Die Textprüfung konnte nicht vollständig abgeschlossen werden.**'
            fi

            echo

            case "$SPELLING_STATUS" in
              0) echo '✅ Rechtschreibung (CSpell): keine Probleme gefunden' ;;
              1) echo '⚠️ Rechtschreibung (CSpell): Hinweise gefunden' ;;
              *) echo '❌ Rechtschreibung (CSpell): Prüfung konnte nicht abgeschlossen werden' ;;
            esac

            case "$GRAMMAR_STATUS" in
              0) echo '✅ Grammatik (LanguageTool, de-DE): keine Probleme gefunden' ;;
              1) echo '⚠️ Grammatik (LanguageTool, de-DE): Hinweise gefunden' ;;
              *) echo '❌ Grammatik (LanguageTool, de-DE): Prüfung konnte nicht abgeschlossen werden' ;;
            esac

            echo
            echo '_Geprüft werden nur die in diesem PR geänderten Blogposts. Details stehen in den einzelnen Steps dieses Checks._'
          } >> "$GITHUB_STEP_SUMMARY"
