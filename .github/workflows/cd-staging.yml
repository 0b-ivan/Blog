name: Deploy Staging

on:
  push:
    branches:
      - staging
    paths:
      - 'posts/**'
      - 'archive/**'
      - 'snippets/**'
      - 'assets/**'
      - 'config/**'
      - 'lib/**'
      - '*.html'
      - '*.js'
      - 'rag/**'
      - 'Dockerfile'
      - 'Dockerfile.search'
      - 'Dockerfile.status'
      - 'Dockerfile.chaos'
      - 'Dockerfile.pdf'
      - 'templates/**'
      - 'status-monitor/**'
      - 'chaos-monkey/**'
      - 'package.json'
      - 'package-lock.json'
      - 'VERSION'
      - '.dockerignore'
      - '.github/workflows/cd-staging.yml'
      - 'infra/kubernetes/base/**'
      - 'infra/kubernetes/staging/**'
      - 'infra/kubernetes/production/**'
      - 'scripts/verify-staging-scaling.sh'
      - 'scripts/verify-production-k8s.sh'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: staging-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BLOG_IMAGE_NAME: kernel-notes-blog
  SEARCH_IMAGE_NAME: kernel-notes-search
  STATUS_IMAGE_NAME: kernel-notes-status
  CHAOS_IMAGE_NAME: kernel-notes-chaos
  PDF_IMAGE_NAME: kernel-notes-pdf
  PROMOTION_BRANCH: promotion/staging-verified
  COVER_BACKFILL_LIMIT: "20"
  RAG_MODEL_CACHE: ${{ github.workspace }}/.cache/kernel-grep-models

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: staging
          fetch-depth: 0

      - name: Require merged PR for automatic staging deployments
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            count=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPOSITORY}/commits/${COMMIT_SHA}/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "staging")] | length')
            if [ "$count" -ge 1 ]; then
              echo 'Staging commit is associated with a merged pull request.'
              exit 0
            fi
            [ "$attempt" -eq 5 ] || sleep 3
          done
          echo 'Refusing staging deployment: commit is not associated with a merged PR into staging.'
          exit 1

      - name: Detect changed posts needing Pixabay cover resolution
        if: github.event_name == 'push'
        id: cover_candidates
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/pixabay-cover-posts.txt

          git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'posts/*.md' |
            sort -u |
            while IFS= read -r post; do
              [ -f "$post" ] || continue

              status="$(sed -n 's/^[[:space:]]*status:[[:space:]]*//p' "$post" | head -n 1 | tr -d "\r\"'" | xargs || true)"
              case "${status,,}" in
                draft|archived)
                  echo "Skipping $post because status=$status"
                  continue
                  ;;
              esac

              cover_value="$(sed -n 's/^[[:space:]]*cover_image:[[:space:]]*//p' "$post" | head -n 1 | tr -d '\r' | xargs || true)"
              case "$cover_value" in
                ""|'""'|"''"|null|~)
                  echo "$post" >> /tmp/pixabay-cover-posts.txt
                  continue
                  ;;
              esac

              previous_post="$(git show "${{ github.event.before }}:$post" 2>/dev/null || true)"
              current_cover_brief="$(sed -n -E '/^[[:space:]]*(cover_query|cover_subject|cover_avoid|cover_intent):/p' "$post")"
              previous_cover_brief="$(printf '%s\n' "$previous_post" | sed -n -E '/^[[:space:]]*(cover_query|cover_subject|cover_avoid|cover_intent):/p')"

              if [ -n "$previous_post" ] && [ "$current_cover_brief" != "$previous_cover_brief" ]; then
                echo "Cover brief changed for $post; refreshing Pixabay cover"
                echo "$post" >> /tmp/pixabay-cover-posts.txt
              else
                echo "Keeping existing cover for $post"
              fi
            done

          node scripts/list-missing-cover-posts.js --limit "$COVER_BACKFILL_LIMIT" > /tmp/pixabay-cover-backfill.txt
          cat /tmp/pixabay-cover-backfill.txt >> /tmp/pixabay-cover-posts.txt
          sort -u -o /tmp/pixabay-cover-posts.txt /tmp/pixabay-cover-posts.txt

          count="$(wc -l < /tmp/pixabay-cover-posts.txt | tr -d ' ')"
          if [ "$count" -gt 0 ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Automatic Pixabay cover resolution required for $count post(s):"
            cat /tmp/pixabay-cover-posts.txt
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo 'No changed or existing published post needs generated or refreshed cover resolution.'
          fi

      - name: Setup Node.js for cover generation
        if: steps.cover_candidates.outputs.needed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install cover generation dependencies
        if: steps.cover_candidates.outputs.needed == 'true'
        run: npm ci

      - name: Install semantic cover ranking dependencies
        if: steps.cover_candidates.outputs.needed == 'true'
        run: npm install --prefix rag --package-lock=false --no-audit --no-fund --onnxruntime-node-install=skip

      - name: Cache semantic cover ranking model
        if: steps.cover_candidates.outputs.needed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/kernel-grep-models
          key: cover-e5-${{ runner.os }}-${{ hashFiles('rag/package.json') }}
          restore-keys: |
            cover-e5-${{ runner.os }}-

      - name: Build Pixabay cache key
        if: steps.cover_candidates.outputs.needed == 'true'
        id: pixabay_cache_key
        shell: bash
        run: echo "key=pixabay-api-${RUNNER_OS}-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Restore Pixabay API cache
        if: steps.cover_candidates.outputs.needed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pixabay
          key: ${{ steps.pixabay_cache_key.outputs.key }}
          restore-keys: |
            pixabay-api-${{ runner.os }}-

      - name: Resolve missing Pixabay covers
        if: steps.cover_candidates.outputs.needed == 'true'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PIXABAY_API_KEY" || {
            echo 'PIXABAY_API_KEY is required when a published article needs a generated cover.' >&2
            exit 1
          }

          mkdir -p /tmp/cover-reports

          while IFS= read -r post; do
            [ -n "$post" ] || continue
            echo "Collecting cover candidates for $post"
            slug="$(basename "$post" .md)"
            npm run covers:resolve -- "$post" --preview --report "/tmp/cover-reports/${slug}.json"
          done < /tmp/pixabay-cover-posts.txt

          node scripts/rerank-cover-candidates-e5.js \
            --reports-dir /tmp/cover-reports \
            --posts-dir posts \
            --cache-dir "$RAG_MODEL_CACHE"

          node scripts/select-diverse-cover-candidates.js \
            --reports-dir /tmp/cover-reports \
            --output /tmp/cover-selection.json \
            --selection-list /tmp/cover-selection.list

          selected_count="$(wc -l < /tmp/cover-selection.list | tr -d ' ')"
          requested_count="$(wc -l < /tmp/pixabay-cover-posts.txt | tr -d ' ')"
          if [ "$selected_count" -ne "$requested_count" ]; then
            echo "Refusing automatic cover fallback: selected ${selected_count}/${requested_count} posts after semantic guardrails." >&2
            cat /tmp/cover-selection.json >&2
            exit 1
          fi

          while IFS='|' read -r post image_id semantic_score; do
            [ -n "$post" ] || continue
            echo "Applying semantic cover $image_id for $post (score $semantic_score)"
            npm run covers:resolve -- "$post" --select-id "$image_id" --score "$semantic_score"
          done < /tmp/cover-selection.list

          git diff --check
          npm run posts:validate-meta
          npx vitest run tests/cover-backfill.test.js tests/pixabay-cover.test.js tests/cover-diversity.test.js tests/cover-semantic-rerank.test.js tests/cover-review.test.js tests/ebook-export.test.js tests/server.test.js

      - name: Finalize staging source
        id: source
        env:
          GENERATED_COVERS: ${{ steps.cover_candidates.outputs.needed }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GENERATED_COVERS" = "true" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

            while IFS= read -r post; do
              git add "$post"
            done < /tmp/pixabay-cover-posts.txt
            git add assets/covers assets/css/article-covers.css

            if ! git diff --cached --quiet; then
              git commit -m "chore(covers): resolve Pixabay covers for ${GITHUB_SHA::12} [skip ci]"

              pushed=false
              for attempt in 1 2 3; do
                git fetch origin staging

                if ! git rebase origin/staging; then
                  git rebase --abort || true
                  echo 'Refusing to overwrite newer staging content after a cover-generation conflict.' >&2
                  exit 1
                fi

                if git push origin HEAD:staging; then
                  pushed=true
                  break
                fi

                echo "Staging advanced during cover push (attempt ${attempt}/3); retrying."
                sleep "$((attempt * 2))"
              done

              if [ "$pushed" != true ]; then
                echo 'Failed to persist generated Pixabay covers after 3 attempts.' >&2
                exit 1
              fi
            fi
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Staging source SHA: $(git rev-parse HEAD)"

      - name: Classify staging deployment
        id: deploy_mode
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build_images=true" >> "$GITHUB_OUTPUT"
            echo "gitops_only=false" >> "$GITHUB_OUTPUT"
            echo 'Manual staging deployment: rebuild images and verify the published version.'
            exit 0
          fi

          git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > /tmp/staging-deploy-files.txt
          echo 'Staging deployment-relevant changes:'
          cat /tmp/staging-deploy-files.txt

          build_images=false
          while IFS= read -r file; do
            case "$file" in
              infra/kubernetes/base/*|infra/kubernetes/base/**/*|infra/kubernetes/staging/*|infra/kubernetes/staging/**/*|infra/kubernetes/production/*|infra/kubernetes/production/**/*|scripts/verify-staging-scaling.sh|scripts/verify-production-k8s.sh|.github/workflows/cd-staging.yml)
                ;;
              *)
                build_images=true
                ;;
            esac
          done < /tmp/staging-deploy-files.txt

          if [ "$build_images" = true ]; then
            echo "gitops_only=false" >> "$GITHUB_OUTPUT"
            echo 'Application/content change detected: build new images.'
          else
            echo "gitops_only=true" >> "$GITHUB_OUTPUT"
            echo 'GitOps-only change detected: reuse currently pinned images.'
          fi
          echo "build_images=$build_images" >> "$GITHUB_OUTPUT"

      - name: Build article version history
        if: steps.deploy_mode.outputs.build_images == 'true'
        run: node scripts/build-post-history.js

      - name: Set SHA-tagged image names
        if: steps.deploy_mode.outputs.build_images == 'true'
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BLOG_VERSION=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$BLOG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid VERSION: $BLOG_VERSION"
            exit 1
          fi

          echo "owner_lower=${OWNER_LOWER}" >> "$GITHUB_OUTPUT"
          echo "build_version=${BLOG_VERSION}-staging.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "blog_image=${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.BLOG_IMAGE_NAME }}:${{ steps.source.outputs.sha }}" >> "$GITHUB_OUTPUT"
          echo "search_image=${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.SEARCH_IMAGE_NAME }}:${{ steps.source.outputs.sha }}" >> "$GITHUB_OUTPUT"
          echo "status_image=${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.STATUS_IMAGE_NAME }}:${{ steps.source.outputs.sha }}" >> "$GITHUB_OUTPUT"
          echo "chaos_image=${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.CHAOS_IMAGE_NAME }}:${{ steps.source.outputs.sha }}" >> "$GITHUB_OUTPUT"
          echo "pdf_image=${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.PDF_IMAGE_NAME }}:${{ steps.source.outputs.sha }}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        if: steps.deploy_mode.outputs.build_images == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GHCR
        if: steps.deploy_mode.outputs.build_images == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging blog image
        if: steps.deploy_mode.outputs.build_images == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.build_version }}
          tags: |
            ${{ steps.meta.outputs.blog_image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ env.BLOG_IMAGE_NAME }}:staging
          cache-from: type=gha,scope=staging-blog
          cache-to: type=gha,mode=max,scope=staging-blog

      - name: Build and push staging Kernel Grep image
        if: steps.deploy_mode.outputs.build_images == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.search
          push: true
          tags: |
            ${{ steps.meta.outputs.search_image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ env.SEARCH_IMAGE_NAME }}:staging
          cache-from: type=gha,scope=staging-search
          cache-to: type=gha,mode=max,scope=staging-search

      - name: Build and push staging Kubernetes status image
        if: steps.deploy_mode.outputs.build_images == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.status
          push: true
          tags: |
            ${{ steps.meta.outputs.status_image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ env.STATUS_IMAGE_NAME }}:staging
          cache-from: type=gha,scope=staging-status
          cache-to: type=gha,mode=max,scope=staging-status

      - name: Build and push staging Chaos Monkey image
        if: steps.deploy_mode.outputs.build_images == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.chaos
          push: true
          tags: |
            ${{ steps.meta.outputs.chaos_image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ env.CHAOS_IMAGE_NAME }}:staging
          cache-from: type=gha,scope=staging-chaos
          cache-to: type=gha,mode=max,scope=staging-chaos

      - name: Build and push staging LaTeX PDF image
        if: steps.deploy_mode.outputs.build_images == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.pdf
          push: true
          tags: |
            ${{ steps.meta.outputs.pdf_image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ env.PDF_IMAGE_NAME }}:staging
          cache-from: type=gha,scope=staging-pdf
          cache-to: type=gha,mode=max,scope=staging-pdf

      - name: Pin staging GitOps state to built images
        if: steps.deploy_mode.outputs.build_images == 'true'
        env:
          DEPLOY_SHA: ${{ steps.source.outputs.sha }}
          OWNER_LOWER: ${{ steps.meta.outputs.owner_lower }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('infra/kubernetes/staging/kustomization.yaml')
          text = path.read_text(encoding='utf-8')
          sha = os.environ['DEPLOY_SHA']
          owner = os.environ['OWNER_LOWER']

          for image in ('kernel-notes-blog', 'kernel-notes-search', 'kernel-notes-status', 'kernel-notes-chaos', 'kernel-notes-pdf'):
              pattern = (
                  rf'(  - name: ghcr\.io/{re.escape(owner)}/{image}\n'
                  rf'    newTag: )[A-Za-z0-9._-]+'
              )
              text, count = re.subn(pattern, rf'\g<1>{sha}', text)
              if count != 1:
                  raise SystemExit(f'Expected one Kustomize image entry for {image}, found {count}')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- infra/kubernetes/staging/kustomization.yaml

      - name: Commit desired staging state
        id: desired-state
        env:
          DEPLOY_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add infra/kubernetes/staging/kustomization.yaml

          if git diff --cached --quiet; then
            echo 'No generated GitOps image-pin change to commit.'
          else
            git commit -m "chore(staging): deploy ${DEPLOY_SHA} [skip ci]"

            pushed=false
            for attempt in 1 2 3; do
              git fetch origin staging

              if ! git rebase origin/staging; then
                git rebase --abort || true
                echo 'Refusing to overwrite a newer staging GitOps change after a rebase conflict.' >&2
                exit 1
              fi

              if git push origin HEAD:staging; then
                pushed=true
                break
              fi

              echo "Staging advanced during desired-state push (attempt ${attempt}/3); retrying."
              sleep "$((attempt * 2))"
            done

            if [ "$pushed" != true ]; then
              echo 'Failed to publish the generated staging GitOps state after 3 attempts.' >&2
              exit 1
            fi
          fi

          GITOPS_SHA="$(git rev-parse HEAD)"
          echo "gitops_sha=${GITOPS_SHA}" >> "$GITHUB_OUTPUT"
          echo "GitOps state to verify: ${GITOPS_SHA}"

      - name: Wait for published staging build
        if: steps.deploy_mode.outputs.build_images == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.meta.outputs.build_version }}
          STAGING_URL: https://staging-blog.obivan.org
        run: |
          set -euo pipefail
          echo "Waiting for ${EXPECTED_VERSION} on ${STAGING_URL}"

          for attempt in $(seq 1 60); do
            health="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' \
              "${STAGING_URL}/healthz?deploy=${GITHUB_SHA}" 2>/dev/null || true)"
            build_info="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' \
              "${STAGING_URL}/build-info.json?deploy=${GITHUB_SHA}" 2>/dev/null || true)"
            version="$(printf '%s' "$build_info" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version", ""))' 2>/dev/null || true)"

            if [ "$health" = 'ok' ] && [ "$version" = "$EXPECTED_VERSION" ]; then
              page="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' \
                "${STAGING_URL}/?deploy=${GITHUB_SHA}")"
              printf '%s' "$page" | grep -q 'data-environment="staging"'
              echo "Staging is serving ${EXPECTED_VERSION}."
              exit 0
            fi

            echo "Attempt ${attempt}/60: health='${health:-unavailable}', version='${version:-unavailable}'"
            sleep 10
          done

          echo "Timed out waiting for ${EXPECTED_VERSION} to be published on staging." >&2
          exit 1

      - name: Verify public LaTeX PDF export
        if: steps.deploy_mode.outputs.build_images == 'true'
        env:
          STAGING_URL: https://staging-blog.obivan.org
          PDF_SMOKE_SLUG: 2026-09-20-chaos-engineering-chaos-monkey-kubernetes
        shell: bash
        run: |
          set -euo pipefail
          output=/tmp/staging-chaos-engineering.pdf

          echo 'Starting PDF preparation through the public API without holding a long Cloudflare request.'
          accepted=false
          for attempt in $(seq 1 24); do
            response="$(curl -fsS --max-time 10 -X POST \
              "${STAGING_URL}/api/pdf/${PDF_SMOKE_SLUG}/prepare?deploy=${GITHUB_SHA}" 2>/dev/null || true)"
            ready="$(printf '%s' "$response" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("ready", False)).lower())' 2>/dev/null || true)"
            preparing="$(printf '%s' "$response" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("preparing", False)).lower())' 2>/dev/null || true)"

            if [ "$ready" = true ] || [ "$preparing" = true ]; then
              accepted=true
              echo "PDF preparation accepted on attempt ${attempt}."
              break
            fi

            echo "PDF service not ready for preparation yet (attempt ${attempt}/24)."
            sleep 5
          done

          test "$accepted" = true

          echo 'Waiting for the cached PDF to become ready.'
          pdf_ready=false
          for attempt in $(seq 1 30); do
            state_file="$(mktemp)"
            status_code="$(curl -sS --max-time 10 \
              -o "$state_file" \
              -w '%{http_code}' \
              "${STAGING_URL}/api/pdf/${PDF_SMOKE_SLUG}/status?deploy=${GITHUB_SHA}" || true)"
            state="$(cat "$state_file")"
            rm -f "$state_file"

            ready="$(printf '%s' "$state" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("ready", False)).lower())' 2>/dev/null || true)"
            preparing="$(printf '%s' "$state" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("preparing", False)).lower())' 2>/dev/null || true)"

            if [ "$status_code" = 200 ] && [ "$ready" = true ]; then
              pdf_ready=true
              echo "PDF cache is ready after ${attempt} status check(s)."
              break
            fi

            blog_health="$(curl -fsS --max-time 5 "${STAGING_URL}/healthz?pdf-status=${GITHUB_SHA}" 2>/dev/null || true)"
            echo "PDF state: http=${status_code:-000}, ready=${ready:-unknown}, preparing=${preparing:-unknown}, blog_health=${blog_health:-unavailable} (attempt ${attempt}/30)"

            if [ "$status_code" = 200 ] && [ "$preparing" = false ]; then
              echo 'PDF renderer is reachable but no render is active; requesting preparation again.'
              curl -fsS --max-time 10 -X POST \
                "${STAGING_URL}/api/pdf/${PDF_SMOKE_SLUG}/prepare?retry=${attempt}&deploy=${GITHUB_SHA}" \
                >/dev/null || true
            fi

            sleep 5
          done

          if [ "$pdf_ready" != true ]; then
            echo 'PDF cache did not become ready; final public diagnostics:' >&2
            curl -sS --max-time 10 -i "${STAGING_URL}/api/pdf/${PDF_SMOKE_SLUG}/status?diagnostic=${GITHUB_SHA}" >&2 || true
            curl -sS --max-time 10 -i "${STAGING_URL}/healthz?diagnostic=${GITHUB_SHA}" >&2 || true
            exit 1
          fi

          curl -fsS --max-time 20 \
            "${STAGING_URL}/download/${PDF_SMOKE_SLUG}.pdf?deploy=${GITHUB_SHA}" \
            -o "$output"
          test "$(head -c 5 "$output")" = '%PDF-'
          test "$(wc -c < "$output")" -gt 10000
          echo 'Public staging LaTeX PDF export is healthy and served from the prepared cache.'

      - name: Check public staging after GitOps-only change
        if: steps.deploy_mode.outputs.gitops_only == 'true'
        env:
          STAGING_URL: https://staging-blog.obivan.org
        run: |
          set -euo pipefail
          echo 'GitOps-only change: no image rebuild is required.'
          echo 'Waiting briefly for Flux reconciliation before checking public availability.'
          sleep 30

          for attempt in $(seq 1 30); do
            health="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache'               "${STAGING_URL}/healthz?gitops=${GITHUB_SHA}" 2>/dev/null || true)"
            page="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache'               "${STAGING_URL}/?gitops=${GITHUB_SHA}" 2>/dev/null || true)"

            if [ "$health" = 'ok' ] && printf '%s' "$page" | grep -q 'data-environment="staging"'; then
              echo 'Public staging is healthy after the GitOps-only change.'
              echo 'Note: this proves public availability, not the exact in-cluster replica count.'
              exit 0
            fi

            echo "Attempt ${attempt}/30: health='${health:-unavailable}'"
            sleep 10
          done

          echo 'Public staging did not become healthy after the GitOps-only change.' >&2
          exit 1

      - name: Publish verified promotion candidate
        if: github.event_name == 'push' && steps.deploy_mode.outputs.build_images == 'true'
        env:
          VERIFIED_SHA: ${{ steps.desired-state.outputs.gitops_sha }}
        run: |
          set -euo pipefail
          test -n "$VERIFIED_SHA"

          git fetch origin staging
          if ! git merge-base --is-ancestor "$VERIFIED_SHA" origin/staging; then
            echo "Refusing to publish promotion candidate: ${VERIFIED_SHA} is not part of current staging history." >&2
            exit 1
          fi

          current_promotion_sha="$(
            git ls-remote --heads origin "refs/heads/${PROMOTION_BRANCH}" |
              awk 'NR == 1 { print $1 }'
          )"

          git push \
            --force-with-lease="refs/heads/${PROMOTION_BRANCH}:${current_promotion_sha}" \
            origin "${VERIFIED_SHA}:refs/heads/${PROMOTION_BRANCH}"

          echo "Verified promotion candidate ${PROMOTION_BRANCH} -> ${VERIFIED_SHA}"

      - name: Open or update production promotion PR
        if: github.event_name == 'push' && steps.deploy_mode.outputs.build_images == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BUILD_VERSION: ${{ steps.meta.outputs.build_version }}
          VERIFIED_SHA: ${{ steps.desired-state.outputs.gitops_sha }}
        run: |
          set -euo pipefail

          body="$(printf '%s\n\n%s\n%s\n\n%s\n' \
            "Staging deployment \`${BUILD_VERSION}\` is online and passed the public smoke check at https://staging-blog.obivan.org." \
            "Verified GitOps commit: \`${VERIFIED_SHA}\`" \
            "Promotion branch: \`${PROMOTION_BRANCH}\`" \
            'This PR promotes only the latest successfully verified staging candidate to `main`. The promotion branch is advanced only after the public staging gate succeeds. Merge remains manual so production is never promoted automatically.')"

          if [ -d /tmp/cover-reports ] && find /tmp/cover-reports -maxdepth 1 -name '*.json' -print -quit | grep -q .; then
            cover_review_file="$(mktemp)"
            node scripts/render-cover-review.js \
              --reports-dir /tmp/cover-reports \
              --repository "$REPOSITORY" \
              --commit "$VERIFIED_SHA" > "$cover_review_file"
            body="$(printf '%s\n\n%s' "$body" "$(cat "$cover_review_file")")"
          fi

          existing="$(gh pr list \
            --repo "$REPOSITORY" \
            --state open \
            --base main \
            --head "$PROMOTION_BRANCH" \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh api \
              --method PATCH \
              "/repos/${REPOSITORY}/pulls/${existing}" \
              -f body="$body" >/dev/null
            echo "Updated production promotion PR #${existing} to verified candidate ${VERIFIED_SHA}."
            exit 0
          fi

          gh pr create \
            --repo "$REPOSITORY" \
            --base main \
            --head "$PROMOTION_BRANCH" \
            --title 'promote: verified staging to production' \
            --body "$body"

      - name: Trigger required checks for production promotion
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          promotion_sha="$(
            git ls-remote --heads origin "refs/heads/${PROMOTION_BRANCH}" |
              awk 'NR == 1 { print $1 }'
          )"

          if [ -z "$promotion_sha" ]; then
            echo 'No promotion branch exists yet; nothing to validate.'
            exit 0
          fi

          promotion_pr="$(
            gh pr list \
              --repo "$REPOSITORY" \
              --state open \
              --base main \
              --head "$PROMOTION_BRANCH" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -z "$promotion_pr" ]; then
            echo 'No open production promotion PR exists; nothing to validate.'
            exit 0
          fi

          gh workflow run ci.yml \
            --repo "$REPOSITORY" \
            --ref "$PROMOTION_BRANCH"

          echo "Triggered PR Checks for promotion PR #${promotion_pr} at ${promotion_sha}."

      - name: Deployment handoff
        env:
          BUILD_IMAGES: ${{ steps.deploy_mode.outputs.build_images }}
        run: |
          if [ "$BUILD_IMAGES" = true ]; then
            echo 'Images are in GHCR and the staging GitOps manifest is updated.'
            echo 'The public staging build was verified before promotion/staging-verified was advanced.'
            echo 'The production promotion PR targets the verified candidate branch and still requires a manual merge.'
          else
            echo 'GitOps-only change: existing images were reused and no promotion candidate was advanced.'
            echo 'Flux reconciles infra/kubernetes/staging from the staging branch.'
            echo 'Run scripts/verify-staging-scaling.sh from a host with cluster access for in-cluster replica verification.'
          fi
