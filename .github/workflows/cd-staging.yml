name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: staging-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BLOG_IMAGE_NAME: kernel-notes-blog
  SEARCH_IMAGE_NAME: kernel-notes-search
  STATUS_IMAGE_NAME: kernel-notes-status
  CHAOS_IMAGE_NAME: kernel-notes-chaos
  PDF_IMAGE_NAME: kernel-notes-pdf
  PROMOTION_BRANCH: promotion/staging-verified
  COVER_BACKFILL_LIMIT: "20"
  RAG_MODEL_CACHE: ${{ github.workspace }}/.cache/kernel-grep-models

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: staging
          fetch-depth: 0

      - name: Require merged PR for automatic staging deployments
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/workflows/staging/require-merged-pr.sh

      - name: Detect changed posts needing Pixabay cover resolution
        if: github.event_name == 'push'
        id: cover_candidates
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: bash scripts/workflows/staging/detect-cover-candidates.sh

      - name: Setup Node.js for cover generation
        if: steps.cover_candidates.outputs.needed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install cover generation dependencies
        if: steps.cover_candidates.outputs.needed == 'true'
        run: npm ci

      - name: Install semantic cover ranking dependencies
        if: steps.cover_candidates.outputs.needed == 'true'
        run: npm install --prefix rag --package-lock=false --no-audit --no-fund --onnxruntime-node-install=skip

      - name: Cache semantic cover ranking model
        if: steps.cover_candidates.outputs.needed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/kernel-grep-models
          key: cover-e5-${{ runner.os }}-${{ hashFiles('rag/package.json') }}
          restore-keys: |
            cover-e5-${{ runner.os }}-

      - name: Build Pixabay cache key
        if: steps.cover_candidates.outputs.needed == 'true'
        id: pixabay_cache_key
        shell: bash
        run: echo "key=pixabay-api-${RUNNER_OS}-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Restore Pixabay API cache
        if: steps.cover_candidates.outputs.needed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pixabay
          key: ${{ steps.pixabay_cache_key.outputs.key }}
          restore-keys: |
            pixabay-api-${{ runner.os }}-

      - name: Resolve missing Pixabay covers
        if: steps.cover_candidates.outputs.needed == 'true'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: bash scripts/workflows/staging/resolve-covers.sh

      - name: Finalize staging source
        id: source
        env:
          GENERATED_COVERS: ${{ steps.cover_candidates.outputs.needed }}
        run: bash scripts/workflows/staging/finalize-source.sh

      - name: Classify staging deployment
        id: deploy_mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: bash scripts/workflows/staging/classify-deployment.sh

      - name: Build article version history
        if: steps.deploy_mode.outputs.build_images == 'true'
        run: node scripts/build-post-history.js

      - name: Set SHA-tagged image names
        if: steps.deploy_mode.outputs.build_images == 'true'
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BLOG_VERSION=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$BLOG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid VERSION: $BLOG_VERSION"
            exit 1
          fi

          echo "owner_lower=${OWNER_LOWER}" >> "$GITHUB_OUTPUT"
          echo "build_version=${BLOG_VERSION}-staging.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "blog_image=${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.BLOG_IMAGE_NAME }}:${{ steps.source.outputs.sha }}" >> "$GITHUB_OUTPUT"
          echo "search_image=${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.SEARCH_IMAGE_NAME }}:${{ steps.source.outputs.sha }}" >> "$GITHUB_OUTPUT"
          echo "status_image=${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.STATUS_IMAGE_NAME }}:${{ steps.source.outputs.sha }}" >> "$GITHUB_OUTPUT"
          echo "chaos_image=${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.CHAOS_IMAGE_NAME }}:${{ steps.source.outputs.sha }}" >> "$GITHUB_OUTPUT"
          echo "pdf_image=${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.PDF_IMAGE_NAME }}:${{ steps.source.outputs.sha }}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        if: steps.deploy_mode.outputs.build_images == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        if: steps.deploy_mode.outputs.build_images == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging blog image
        if: steps.deploy_mode.outputs.build_images == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.build_version }}
          tags: |
            ${{ steps.meta.outputs.blog_image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ env.BLOG_IMAGE_NAME }}:staging
          cache-from: type=gha,scope=staging-blog
          cache-to: type=gha,mode=max,scope=staging-blog

      - name: Build and push staging Kernel Grep image
        if: steps.deploy_mode.outputs.build_images == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.search
          push: true
          tags: |
            ${{ steps.meta.outputs.search_image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ env.SEARCH_IMAGE_NAME }}:staging
          cache-from: type=gha,scope=staging-search
          cache-to: type=gha,mode=max,scope=staging-search

      - name: Build and push staging Kubernetes status image
        if: steps.deploy_mode.outputs.build_images == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.status
          push: true
          tags: |
            ${{ steps.meta.outputs.status_image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ env.STATUS_IMAGE_NAME }}:staging
          cache-from: type=gha,scope=staging-status
          cache-to: type=gha,mode=max,scope=staging-status

      - name: Build and push staging Chaos Monkey image
        if: steps.deploy_mode.outputs.build_images == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.chaos
          push: true
          tags: |
            ${{ steps.meta.outputs.chaos_image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ env.CHAOS_IMAGE_NAME }}:staging
          cache-from: type=gha,scope=staging-chaos
          cache-to: type=gha,mode=max,scope=staging-chaos

      - name: Build and push staging LaTeX PDF image
        if: steps.deploy_mode.outputs.build_images == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.pdf
          push: true
          tags: |
            ${{ steps.meta.outputs.pdf_image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/${{ env.PDF_IMAGE_NAME }}:staging
          cache-from: type=gha,scope=staging-pdf
          cache-to: type=gha,mode=max,scope=staging-pdf

      - name: Pin staging GitOps state to built images
        if: steps.deploy_mode.outputs.build_images == 'true'
        env:
          DEPLOY_SHA: ${{ steps.source.outputs.sha }}
          OWNER_LOWER: ${{ steps.meta.outputs.owner_lower }}
        run: bash scripts/workflows/staging/pin-gitops-state.sh

      - name: Commit desired staging state
        id: desired-state
        env:
          DEPLOY_SHA: ${{ steps.source.outputs.sha }}
        run: bash scripts/workflows/staging/commit-desired-state.sh

      - name: Wait for published staging build
        if: steps.deploy_mode.outputs.build_images == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.meta.outputs.build_version }}
          STAGING_URL: https://staging-blog.obivan.org
        run: bash scripts/workflows/staging/wait-published.sh

      - name: Verify public LaTeX PDF export
        if: steps.deploy_mode.outputs.build_images == 'true'
        env:
          STAGING_URL: https://staging-blog.obivan.org
          PDF_SMOKE_SLUG: 2026-09-20-chaos-engineering-chaos-monkey-kubernetes
        run: bash scripts/workflows/staging/verify-public-pdf.sh

      - name: Check public staging after GitOps-only change
        if: steps.deploy_mode.outputs.gitops_only == 'true'
        env:
          STAGING_URL: https://staging-blog.obivan.org
        run: bash scripts/workflows/staging/check-gitops-only.sh

      - name: Publish verified promotion candidate
        if: github.event_name == 'push'
        env:
          VERIFIED_SHA: ${{ steps.desired-state.outputs.gitops_sha }}
        run: bash scripts/workflows/staging/publish-promotion-candidate.sh

      - name: Open or update production promotion PR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BUILD_VERSION: ${{ steps.meta.outputs.build_version }}
          VERIFIED_SHA: ${{ steps.desired-state.outputs.gitops_sha }}
        run: bash scripts/workflows/staging/manage-promotion-pr.sh

      - name: Trigger required checks for production promotion
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/workflows/staging/trigger-promotion-ci.sh

      - name: Deployment handoff
        env:
          BUILD_IMAGES: ${{ steps.deploy_mode.outputs.build_images }}
        run: bash scripts/workflows/staging/handoff.sh
