name: Glossary coverage sync

on:
  push:
    branches:
      - feature/glossary-coverage

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/glossary-coverage

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix visible-text coverage expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/glossary.test.js')
          text = path.read_text()
          old = "'2026-08-18-zero-downtime-mit-compose.md': ['Rolling Update', 'Reverse Proxy', 'Cutover']"
          new = "'2026-08-18-zero-downtime-mit-compose.md': ['Healthcheck', 'Reverse Proxy', 'Cutover']"
          if old not in text:
              raise SystemExit('expected coverage line not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Run glossary tests before sync
        run: npx vitest run tests/glossary.test.js

      - name: Sync glossary definitions into all active posts
        run: npm run glossary:sync

      - name: Verify sync is stable
        run: npm run glossary:check

      - name: Run glossary tests after sync
        run: npx vitest run tests/glossary.test.js

      - name: Lint glossary implementation
        run: npm run lint

      - name: Remove helper workflow and commit results
        run: |
          rm .github/workflows/glossary-coverage-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/glossary.test.js posts .github/workflows/glossary-coverage-sync.yml
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'docs: sync glossary definitions across active posts'
          git push
