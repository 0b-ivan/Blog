name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BLOG_IMAGE: kernel-notes-blog:ci
  SEARCH_IMAGE: kernel-notes-search:ci

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "security=true" >> "$GITHUB_OUTPUT"
            echo "semantic=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD > /tmp/changed-files.txt
          echo "Changed files:"
          cat /tmp/changed-files.txt

          heavy=false
          security=false
          semantic=false

          while IFS= read -r file; do
            case "$file" in
              package.json|package-lock.json|rag/package.json|rag/package-lock.json|Dockerfile|Dockerfile.search|docker-compose.yml|docker-compose.prod.yml|ops/*/docker-compose.yml)
                security=true
                ;;
            esac

            case "$file" in
              posts/*|archive/*|rag/*)
                semantic=true
                ;;
            esac

            case "$file" in
              posts/*|archive/*|snippets/*|assets/posts/*|config/proofread-words.txt|cspell.json|scripts/spellcheck-posts.js|scripts/proofread-posts.js|README*|docs/*|.github/workflows/*)
                ;;
              *)
                heavy=true
                ;;
            esac
          done < /tmp/changed-files.txt

          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "security=$security" >> "$GITHUB_OUTPUT"
          echo "semantic=$semantic" >> "$GITHUB_OUTPUT"
          echo "Classification: heavy=$heavy security=$security semantic=$semantic"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build article version history
        run: npm run posts:build-history

      - name: Validate post frontmatter metadata
        run: npm run posts:validate-meta

      - name: Lint
        run: npm run lint

      - name: Unit and API tests with coverage
        run: npm run test:coverage

      - name: Install semantic search dependencies
        if: steps.changes.outputs.heavy == 'true' || steps.changes.outputs.semantic == 'true'
        run: npm install --prefix rag --package-lock=false --no-audit --no-fund

      - name: Semantic search unit tests
        if: steps.changes.outputs.heavy == 'true'
        run: npm run rag:test

      - name: Cache Kernel Grep embedding model
        if: steps.changes.outputs.semantic == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/kernel-grep-models
          key: kernel-grep-e5-${{ runner.os }}-${{ hashFiles('rag/package.json') }}
          restore-keys: |
            kernel-grep-e5-${{ runner.os }}-

      - name: Semantic search regression tests
        if: steps.changes.outputs.semantic == 'true'
        env:
          RAG_MODEL_CACHE: ${{ github.workspace }}/.cache/kernel-grep-models
          RAG_REGRESSION_EMBEDDER_MODE: e5
        run: npm run rag:test:regression

      - name: Validate Docker Compose
        run: docker compose config

      - name: Validate production Docker Compose
        env:
          BLOG_IMAGE: ghcr.io/0b-ivan/kernel-notes-blog:ci
          SEARCH_IMAGE: ghcr.io/0b-ivan/kernel-notes-search:ci
        run: docker compose -f docker-compose.prod.yml config

      - name: Validate Obsidian LiveSync Docker Compose
        env:
          COUCHDB_USER: obsidian-ci
          COUCHDB_PASSWORD: ci-placeholder-password
          COUCHDB_DATABASE: kernelnotes
          CF_TUNNEL_TOKEN: ci-placeholder-token
          OBSIDIAN_VAULT_PATH: ../../posts
        run: |
          docker compose -f ops/obsidian-livesync/docker-compose.yml config
          docker compose -f ops/obsidian-livesync/docker-compose.yml --profile cloudflare config
          docker compose -f ops/obsidian-livesync/docker-compose.yml --profile headless config
          docker compose -f ops/obsidian-livesync/docker-compose.yml --profile publisher config
          docker compose -f ops/obsidian-livesync/docker-compose.yml --profile cloudflare --profile headless config

      - name: Setup Docker Buildx
        if: steps.changes.outputs.heavy == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build blog image once
        if: steps.changes.outputs.heavy == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.BLOG_IMAGE }}
          cache-from: type=gha,scope=pr-blog
          cache-to: type=gha,mode=max,scope=pr-blog

      - name: Build Kernel Grep image once
        if: steps.changes.outputs.heavy == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.search
          load: true
          tags: ${{ env.SEARCH_IMAGE }}
          cache-from: type=gha,scope=pr-search
          cache-to: type=gha,mode=max,scope=pr-search

      - name: Start stack without rebuilding images
        if: steps.changes.outputs.heavy == 'true'
        env:
          RAG_EMBEDDER_MODE: hash
        run: docker compose up -d --no-build

      - name: Wait for health endpoint
        if: steps.changes.outputs.heavy == 'true'
        run: |
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              echo 'Service is healthy'
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=100 search blog || true
          exit 1

      - name: Install Chromium smoke-test runtime
        if: steps.changes.outputs.heavy == 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser click smoke test
        if: steps.changes.outputs.heavy == 'true'
        env:
          BLOG_BASE_URL: http://127.0.0.1:8080
        run: node e2e/browser-smoke.js

      - name: Archive and history smoke test
        if: steps.changes.outputs.heavy == 'true'
        env:
          BLOG_BASE_URL: http://127.0.0.1:8080
        run: node e2e/archive-history-smoke.js

      - name: Shutdown stack
        if: always() && steps.changes.outputs.heavy == 'true'
        run: docker compose down -v

      - name: Trivy filesystem scan
        if: steps.changes.outputs.security == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Trivy blog image scan
        if: steps.changes.outputs.security == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.BLOG_IMAGE }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Trivy Kernel Grep image scan
        if: steps.changes.outputs.security == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SEARCH_IMAGE }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Trivy blog strict gate on CRITICAL
        if: ${{ steps.changes.outputs.security == 'true' && vars.TRIVY_STRICT == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.BLOG_IMAGE }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          exit-code: '1'

      - name: Trivy Kernel Grep strict gate on CRITICAL
        if: ${{ steps.changes.outputs.security == 'true' && vars.TRIVY_STRICT == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SEARCH_IMAGE }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          exit-code: '1'
