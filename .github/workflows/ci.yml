name: PR Checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose synthetic merge commit should receive required check results
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BLOG_IMAGE: kernel-notes-blog:ci
  SEARCH_IMAGE: kernel-notes-search:ci
  STATUS_IMAGE: kernel-notes-status:ci
  CHAOS_IMAGE: kernel-notes-chaos:ci
  PDF_IMAGE: kernel-notes-pdf:ci

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "security=true" >> "$GITHUB_OUTPUT"
            echo "semantic=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD > /tmp/changed-files.txt
          echo "Changed files:"
          cat /tmp/changed-files.txt

          heavy=false
          security=false
          semantic=false

          while IFS= read -r file; do
            case "$file" in
              package.json|package-lock.json|rag/package.json|rag/package-lock.json|Dockerfile|Dockerfile.search|Dockerfile.status|Dockerfile.chaos|Dockerfile.pdf|docker-compose.yml|docker-compose.prod.yml|ops/*/docker-compose.yml)
                security=true
                ;;
            esac

            case "$file" in
              .github/workflows/ci.yml)
                heavy=true
                security=true
                ;;
            esac

            case "$file" in
              posts/*|archive/*|rag/*)
                semantic=true
                ;;
            esac

            case "$file" in
              posts/*|archive/*|snippets/*|assets/posts/*|config/proofread-words.txt|cspell.json|scripts/spellcheck-posts.js|scripts/proofread-posts.js|scripts/list-missing-cover-posts.js|scripts/render-cover-review.js|scripts/rerank-cover-candidates-e5.js|scripts/resolve-pixabay-cover.js|scripts/select-diverse-cover-candidates.js|tests/cover-backfill.test.js|tests/cover-diversity.test.js|tests/cover-review.test.js|tests/cover-semantic-rerank.test.js|tests/pixabay-cover.test.js|README*|docs/*|.github/workflows/*)
                ;;
              *)
                heavy=true
                ;;
            esac
          done < /tmp/changed-files.txt

          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "security=$security" >> "$GITHUB_OUTPUT"
          echo "semantic=$semantic" >> "$GITHUB_OUTPUT"
          echo "Classification: heavy=$heavy security=$security semantic=$semantic"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build article version history
        run: npm run posts:build-history

      - name: Validate post frontmatter metadata
        run: npm run posts:validate-meta

      - name: Validate sources and internal references
        run: npm run references:check

      - name: Validate SEO metadata and sitemap
        run: npm run seo:check

      - name: Validate GitOps secret hygiene
        run: bash scripts/check-gitops-secrets.sh

      - name: Validate production image tag isolation
        run: npm run deploy:check-image-tags

      - name: Validate production rollout policy
        run: npm run deploy:check-rollout-policy

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find scripts snippets -type f -name '*.sh' -print0)

      - name: Lint
        run: npm run lint

      - name: Unit and API tests with coverage
        run: npm run test:coverage

      - name: Install semantic search dependencies
        if: steps.changes.outputs.heavy == 'true' || steps.changes.outputs.semantic == 'true'
        # Semantic search uses CPU inference in CI. Avoid onnxruntime-node's optional CUDA NuGet download.
        run: npm install --prefix rag --package-lock=false --no-audit --no-fund --onnxruntime-node-install=skip

      - name: Semantic search unit tests
        if: steps.changes.outputs.heavy == 'true'
        run: npm run rag:test

      - name: Cache Kernel Grep embedding model
        if: steps.changes.outputs.semantic == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/kernel-grep-models
          key: kernel-grep-e5-${{ runner.os }}-${{ hashFiles('rag/package.json') }}
          restore-keys: |
            kernel-grep-e5-${{ runner.os }}-

      - name: Semantic search regression tests
        if: steps.changes.outputs.semantic == 'true'
        env:
          RAG_MODEL_CACHE: ${{ github.workspace }}/.cache/kernel-grep-models
          RAG_REGRESSION_EMBEDDER_MODE: e5
        run: npm run rag:test:regression

      - name: Validate Docker Compose
        run: docker compose config

      - name: Validate production Docker Compose
        env:
          BLOG_IMAGE: ghcr.io/0b-ivan/kernel-notes-blog:ci
          SEARCH_IMAGE: ghcr.io/0b-ivan/kernel-notes-search:ci
          PDF_IMAGE: ghcr.io/0b-ivan/kernel-notes-pdf:ci
        run: docker compose -f docker-compose.prod.yml config

      - name: Validate Obsidian LiveSync Docker Compose
        env:
          COUCHDB_USER: obsidian-ci
          COUCHDB_PASSWORD: ci-placeholder-password
          COUCHDB_DATABASE: kernelnotes
          CF_TUNNEL_TOKEN: ci-placeholder-token
          OBSIDIAN_VAULT_PATH: ../../posts
        run: |
          docker compose -f ops/obsidian-livesync/docker-compose.yml config
          docker compose -f ops/obsidian-livesync/docker-compose.yml --profile cloudflare config
          docker compose -f ops/obsidian-livesync/docker-compose.yml --profile headless config
          docker compose -f ops/obsidian-livesync/docker-compose.yml --profile publisher config
          docker compose -f ops/obsidian-livesync/docker-compose.yml --profile cloudflare --profile headless config

      - name: Setup Docker Buildx
        if: steps.changes.outputs.heavy == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build blog image once
        if: steps.changes.outputs.heavy == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.BLOG_IMAGE }}
          cache-from: type=gha,scope=pr-blog
          cache-to: type=gha,mode=max,scope=pr-blog

      - name: Build Kernel Grep image once
        if: steps.changes.outputs.heavy == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.search
          load: true
          tags: ${{ env.SEARCH_IMAGE }}
          cache-from: type=gha,scope=pr-search
          cache-to: type=gha,mode=max,scope=pr-search

      - name: Build Kubernetes status image once
        if: steps.changes.outputs.heavy == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.status
          load: true
          tags: ${{ env.STATUS_IMAGE }}
          cache-from: type=gha,scope=pr-status
          cache-to: type=gha,mode=max,scope=pr-status

      - name: Build Chaos Monkey image once
        if: steps.changes.outputs.heavy == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.chaos
          load: true
          tags: ${{ env.CHAOS_IMAGE }}
          cache-from: type=gha,scope=pr-chaos
          cache-to: type=gha,mode=max,scope=pr-chaos

      - name: Build LaTeX PDF image once
        if: steps.changes.outputs.heavy == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.pdf
          load: true
          tags: ${{ env.PDF_IMAGE }}
          cache-from: type=gha,scope=pr-pdf
          cache-to: type=gha,mode=max,scope=pr-pdf

      - name: Start stack without rebuilding images
        if: steps.changes.outputs.heavy == 'true'
        env:
          RAG_EMBEDDER_MODE: hash
        run: docker compose up -d --no-build

      - name: Wait for health endpoint
        if: steps.changes.outputs.heavy == 'true'
        run: |
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              echo 'Service is healthy'
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=100 search pdf blog || true
          exit 1

      - name: Install Chromium smoke-test runtime
        if: steps.changes.outputs.heavy == 'true'
        run: |
          set -euo pipefail
          PLAYWRIGHT_RUNTIME=/tmp/playwright-runtime
          rm -rf "$PLAYWRIGHT_RUNTIME"
          mkdir -p "$PLAYWRIGHT_RUNTIME"
          npm install --prefix "$PLAYWRIGHT_RUNTIME" --no-package-lock --no-audit --no-fund playwright@1.55.0
          "$PLAYWRIGHT_RUNTIME/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$PLAYWRIGHT_RUNTIME/node_modules" >> "$GITHUB_ENV"

      - name: LaTeX PDF smoke test
        if: steps.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail

          for slug in \
            2026-09-20-chaos-engineering-chaos-monkey-kubernetes \
            2026-09-24-pac-man-puck-man-paku-paku
          do
            output="/tmp/kernel-notes-${slug}.pdf"
            if ! curl -fsS --max-time 150 \
              "http://127.0.0.1:8080/download/${slug}.pdf" \
              -o "$output"; then
              echo "LaTeX PDF smoke test failed for ${slug}; renderer logs follow:" >&2
              docker compose logs --no-color --tail=300 pdf blog || true
              exit 1
            fi
            test "$(head -c 5 "$output")" = '%PDF-' || {
              docker compose logs --no-color --tail=300 pdf blog || true
              exit 1
            }
            test "$(wc -c < "$output")" -gt 10000 || {
              docker compose logs --no-color --tail=300 pdf blog || true
              exit 1
            }
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null || {
              docker compose logs --no-color --tail=300 pdf blog || true
              exit 1
            }
          done

      - name: Browser click smoke test
        if: steps.changes.outputs.heavy == 'true'
        env:
          BLOG_BASE_URL: http://127.0.0.1:8080
          BROWSER_SMOKE_ALLOW_STATUS_UNAVAILABLE: "true"
        run: node e2e/browser-smoke.js

      - name: Archive and history smoke test
        if: steps.changes.outputs.heavy == 'true'
        env:
          BLOG_BASE_URL: http://127.0.0.1:8080
          BROWSER_SMOKE_ALLOW_STATUS_UNAVAILABLE: "true"
        run: node e2e/archive-history-smoke.js

      - name: Shutdown stack
        if: always() && steps.changes.outputs.heavy == 'true'
        run: docker compose down -v

      - name: Trivy filesystem scan
        if: steps.changes.outputs.security == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Trivy blog image scan
        if: steps.changes.outputs.security == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.BLOG_IMAGE }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Trivy Kernel Grep image scan
        if: steps.changes.outputs.security == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SEARCH_IMAGE }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Trivy LaTeX PDF image scan
        if: steps.changes.outputs.security == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.PDF_IMAGE }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Create blog CRITICAL report
        if: ${{ steps.changes.outputs.security == 'true' && vars.TRIVY_STRICT != 'false' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.BLOG_IMAGE }}
          format: json
          output: trivy-blog-critical.json
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          exit-code: '0'

      - name: Enforce blog CRITICAL gate
        if: ${{ steps.changes.outputs.security == 'true' && vars.TRIVY_STRICT != 'false' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path('trivy-blog-critical.json').read_text(encoding='utf-8'))
          vulnerabilities = []
          for result in report.get('Results') or []:
              target = result.get('Target', '')
              for vuln in result.get('Vulnerabilities') or []:
                  vulnerabilities.append((
                      target,
                      vuln.get('VulnerabilityID', ''),
                      vuln.get('PkgName', ''),
                      vuln.get('InstalledVersion', ''),
                      vuln.get('FixedVersion', ''),
                  ))

          if not vulnerabilities:
              print('No CRITICAL vulnerabilities found in blog image.')
              sys.exit(0)

          print('CRITICAL vulnerabilities in blog image:')
          for target, vuln_id, package, installed, fixed in vulnerabilities:
              fixed_display = fixed or '<none>'
              print(f'{vuln_id} | {package} | installed={installed} | fixed={fixed_display} | target={target}')
              print(f'::error title={vuln_id}::{package} installed={installed} fixed={fixed_display} target={target}')
          sys.exit(1)
          PY

      - name: Create Kernel Grep CRITICAL report
        if: ${{ steps.changes.outputs.security == 'true' && vars.TRIVY_STRICT != 'false' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SEARCH_IMAGE }}
          format: json
          output: trivy-search-critical.json
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          exit-code: '0'

      - name: Enforce Kernel Grep CRITICAL gate
        if: ${{ steps.changes.outputs.security == 'true' && vars.TRIVY_STRICT != 'false' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path('trivy-search-critical.json').read_text(encoding='utf-8'))
          vulnerabilities = []
          for result in report.get('Results') or []:
              target = result.get('Target', '')
              for vuln in result.get('Vulnerabilities') or []:
                  vulnerabilities.append((
                      target,
                      vuln.get('VulnerabilityID', ''),
                      vuln.get('PkgName', ''),
                      vuln.get('InstalledVersion', ''),
                      vuln.get('FixedVersion', ''),
                  ))

          if not vulnerabilities:
              print('No CRITICAL vulnerabilities found in Kernel Grep image.')
              sys.exit(0)

          print('CRITICAL vulnerabilities in Kernel Grep image:')
          for target, vuln_id, package, installed, fixed in vulnerabilities:
              fixed_display = fixed or '<none>'
              print(f'{vuln_id} | {package} | installed={installed} fixed={fixed_display} target={target}')
              print(f'::error title={vuln_id}::{package} installed={installed} fixed={fixed_display} target={target}')
          sys.exit(1)
          PY


  local-assets:
    name: Local assets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check local image and media references
        run: node scripts/check-local-assets.js


  mirror-required-pr-checks:
    name: Mirror required PR checks
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.pr_number != '' }}
    needs:
      - checks
      - local-assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
      pull-requests: read

    steps:
      - name: Mirror required checks to PR merge commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          LOCAL_ASSETS_RESULT: ${{ needs.local-assets.result }}
          DISPATCH_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          pr_json="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          pr_state="$(printf '%s' "$pr_json" | jq -r '.state')"
          pr_base="$(printf '%s' "$pr_json" | jq -r '.base.ref')"
          pr_head_sha="$(printf '%s' "$pr_json" | jq -r '.head.sha')"
          merge_sha="$(printf '%s' "$pr_json" | jq -r '.merge_commit_sha // empty')"

          test "$pr_state" = open
          test "$pr_base" = main

          if [ "$pr_head_sha" != "$DISPATCH_SHA" ]; then
            echo "Refusing to mirror stale results: dispatched SHA ${DISPATCH_SHA} != PR head ${pr_head_sha}." >&2
            exit 1
          fi

          if [ -z "$merge_sha" ]; then
            echo 'GitHub has not produced a synthetic merge commit for the PR.' >&2
            exit 1
          fi

          publish_check() {
            local name="$1"
            local result="$2"
            local conclusion=failure

            if [ "$result" = success ]; then
              conclusion=success
            fi

            gh api \
              --method POST \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/check-runs" \
              -f name="$name" \
              -f head_sha="$merge_sha" \
              -f status=completed \
              -f conclusion="$conclusion" \
              -f details_url="$RUN_URL" >/dev/null

            echo "Mirrored ${name}=${conclusion} to ${merge_sha}."
          }

          publish_check checks "$CHECKS_RESULT"
          publish_check 'Local assets' "$LOCAL_ASSETS_RESULT"

          if [ "$CHECKS_RESULT" != success ] || [ "$LOCAL_ASSETS_RESULT" != success ]; then
            echo 'One or more required checks failed; mirrored failure to the PR merge commit.' >&2
            exit 1
          fi
