name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  validate-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Unit and API tests with coverage
        run: npm run test:coverage

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build local blog image
        run: docker build -t kernel-notes-blog:ci .

      - name: Build OpenFaaS function image
        run: docker build -t kernel-notes-function:ci ./faasd/function-blog

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for health endpoint
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              echo "Service is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Service did not become healthy in time"
          docker compose ps
          exit 1

      - name: Shutdown stack
        if: always()
        run: docker compose down -v

  security-trivy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build blog image for scan
        run: docker build -t kernel-notes-blog:ci .

      - name: Trivy filesystem scan (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Trivy image scan (gate on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kernel-notes-blog:ci
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Trivy image scan (strict gate on CRITICAL)
        if: ${{ vars.TRIVY_STRICT == 'true' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kernel-notes-blog:ci
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          exit-code: '1'
