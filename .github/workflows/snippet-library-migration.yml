name: Snippet Library Migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/snippet-library
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run repository migration
        run: python3 scripts/migrate-snippet-library.py

      - name: Install Highlight.js
        run: npm install highlight.js@11.11.1 --save

      - name: Fix generated lint issues
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script = Path('script.js')
          text = script.read_text(encoding='utf-8').replace('navigator.clipboard', 'window.navigator.clipboard')
          script.write_text(text, encoding='utf-8')

          server = Path('server.js')
          text = server.read_text(encoding='utf-8')
          start = text.index("const dto = posts.map(")
          end = text.index("res.json(dto);", start)
          dto = text[start:end].replace("        publishedAt,\n", "")
          text = text[:start] + dto + text[end:]
          server.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        run: |
          npm run lint
          npm test

      - name: Commit migration
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'No migration changes found.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add versioned code snippet library'
          git push origin HEAD:feat/snippet-library
