name: Materialize Article Photos

on:
  push:
    branches:
      - 'photo/**'
      - 'post/**'
      - 'obsidian/**'
      - 'feat/**'
      - 'fix/**'
    paths:
      - 'media/photos/*.json'
      - 'posts/*.md'
  workflow_dispatch:
    inputs:
      manifest:
        description: 'Manifest path, e.g. media/photos/pac-man-puck-man.json'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: article-photos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Refuse manual writes to production
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
        shell: bash
        run: |
          echo 'Manual photo materialization must run from staging or a feature branch; direct writes to main are forbidden.' >&2
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve changed article posts
        id: posts
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/photo-posts.txt

          before='${{ github.event.before }}'
          sha='${{ github.sha }}'

          if [ -n "$before" ] && [[ ! "$before" =~ ^0+$ ]] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
            git diff --name-only "$before" "$sha" -- 'posts/*.md'
          else
            git diff-tree --no-commit-id --name-only -r "$sha" -- 'posts/*.md'
          fi | while IFS= read -r post; do
            if [ -f "$post" ]; then
              printf '%s\n' "$post"
            fi
          done | sort -u > /tmp/photo-posts.txt

          if [ -s /tmp/photo-posts.txt ]; then
            echo 'has_posts=true' >> "$GITHUB_OUTPUT"
            echo 'Changed article posts:'
            cat /tmp/photo-posts.txt
          else
            echo 'has_posts=false' >> "$GITHUB_OUTPUT"
            echo 'No changed article posts.'
          fi

      - name: Convert external Commons image links
        if: github.event_name == 'push' && steps.posts.outputs.has_posts == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t posts < /tmp/photo-posts.txt
          npm run photos:materialize-links -- "${posts[@]}"

      - name: Resolve manifests
        id: manifests
        shell: bash
        env:
          MANUAL_MANIFEST: ${{ github.event_name == 'workflow_dispatch' && inputs.manifest || '' }}
        run: |
          set -euo pipefail
          : > /tmp/photo-manifests.txt

          if [ -n "$MANUAL_MANIFEST" ]; then
            case "$MANUAL_MANIFEST" in
              media/photos/*.json) ;;
              *)
                echo 'manifest must be below media/photos/ and end in .json' >&2
                exit 1
                ;;
            esac
            printf '%s\n' "$MANUAL_MANIFEST" >> /tmp/photo-manifests.txt
          else
            before='${{ github.event.before }}'
            sha='${{ github.sha }}'

            if [ -n "$before" ] && [[ ! "$before" =~ ^0+$ ]] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              git diff --name-only "$before" "$sha" -- 'media/photos/*.json'
            else
              git diff-tree --no-commit-id --name-only -r "$sha" -- 'media/photos/*.json'
            fi >> /tmp/photo-manifests.txt || true

            git diff --name-only -- 'media/photos/*.json' >> /tmp/photo-manifests.txt || true
            git ls-files --others --exclude-standard -- 'media/photos/*.json' >> /tmp/photo-manifests.txt || true
          fi

          grep -E '^media/photos/[^/]+\.json$' /tmp/photo-manifests.txt | sort -u > /tmp/photo-manifests.filtered || true
          mv /tmp/photo-manifests.filtered /tmp/photo-manifests.txt

          if [ ! -s /tmp/photo-manifests.txt ]; then
            echo 'No changed article-photo manifest; nothing to materialize.'
            echo 'has_manifests=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'has_manifests=true' >> "$GITHUB_OUTPUT"

          while IFS= read -r manifest; do
            test -f "$manifest" || {
              echo "Manifest not found: $manifest" >&2
              exit 1
            }
          done < /tmp/photo-manifests.txt

          echo 'Photo manifests:'
          cat /tmp/photo-manifests.txt

      - name: Download and validate licensed photos
        if: steps.manifests.outputs.has_manifests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < /tmp/photo-manifests.txt
          npm run photos:ingest -- "${manifests[@]}"

      - name: Validate generated article media
        if: steps.manifests.outputs.has_manifests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-local-assets.js
          npm run references:check
          git diff --check

      - name: Commit materialized photos
        if: steps.manifests.outputs.has_manifests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- assets/posts posts media/photos

          if git diff --cached --quiet; then
            echo 'Photo Connection already materialized this manifest.'
            exit 0
          fi

          git commit -m 'chore: materialize licensed article photos'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
