name: Observe staging chaos experiment

on:
  push:
    branches:
      - staging
    paths:
      - 'infra/kubernetes/staging/chaos-experiment-*.yaml'
      - '.github/workflows/observe-chaos-result.yml'
  workflow_dispatch:
    inputs:
      completed_after:
        description: 'Optional ISO-8601 lower bound for completedAt'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: observe-staging-chaos
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STATUS_URL: https://staging-blog.obivan.org/api/kubernetes-status
      MANUAL_COMPLETED_AFTER: ${{ inputs.completed_after || '' }}
    steps:
      - name: Checkout experiment state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect active one-shot experiment
        id: active
        shell: bash
        run: |
          set -euo pipefail
          active_file="$(compgen -G 'infra/kubernetes/staging/chaos-experiment-*.yaml' | head -n 1 || true)"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -z "$active_file" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Experiment manifest was removed; nothing to observe."
            exit 0
          fi
          echo "active=true" >> "$GITHUB_OUTPUT"
          echo "file=$active_file" >> "$GITHUB_OUTPUT"

      - name: Wait for sanitized chaos result
        if: steps.active.outputs.active == 'true'
        id: result
        shell: bash
        run: |
          set -euo pipefail

          completed_after="${MANUAL_COMPLETED_AFTER}"
          if [ -z "$completed_after" ] && [ -n "${{ steps.active.outputs.file }}" ]; then
            completed_after="$(git log --diff-filter=A -1 --format=%cI -- "${{ steps.active.outputs.file }}")"
          fi

          lower_epoch=0
          if [ -n "$completed_after" ]; then
            lower_epoch="$(date -u -d "$completed_after" +%s)"
            echo "Accepting chaos results completed at or after: $completed_after"
          fi

          for attempt in $(seq 1 84); do
            payload="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' \
              "${STATUS_URL}?chaos=${GITHUB_RUN_ID}" 2>/dev/null || true)"

            candidate="$(printf '%s' "$payload" | jq -c '
              .lastChaosExperiment
              | select(type == "object")
              | select(.experiment == "single-blog-pod-delete" or .experiment == "repeated-blog-pod-delete")
            ' 2>/dev/null || true)"

            result=""
            if [ -n "$candidate" ] && [ "$candidate" != "null" ]; then
              completed_at="$(printf '%s' "$candidate" | jq -r '.completedAt // ""')"
              if [ -n "$completed_at" ]; then
                completed_epoch="$(date -u -d "$completed_at" +%s 2>/dev/null || echo 0)"
                if [ "$lower_epoch" -eq 0 ] || [ "$completed_epoch" -ge "$lower_epoch" ]; then
                  result="$(printf '%s' "$candidate" | jq -c '{

                  experiment,
                  experimentStartedAt,
                  completedAt,
                  iterationCount,
                  completedIterations,
                  recoveryTimeMs,
                  recoveryTimesMs,
                  totalRecoveryTimeMs,
                  maxRecoveryTimeMs,
                  httpChecks,
                  httpFailures,
                  minimumReadyPods,
                  maximumReadyPods,
                  searchReachableBefore,
                  searchReachableAfter,
                  passed
                }')"
                fi
              fi
            fi

            if [ -n "$result" ] && [ "$result" != "null" ]; then
              printf '%s\n' "$result" > /tmp/chaos-result.json
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Attempt ${attempt}/84: no matching sanitized result yet"
            sleep 5
          done

          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Publish chaos result summary
        if: steps.active.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.result.outputs.found }}" != "true" ]; then
            echo "No matching sanitized lastChaosExperiment result became visible before the observer timeout." >&2
            exit 1
          fi

          status="$(jq -r 'if .passed then "PASS" else "FAIL" end' /tmp/chaos-result.json)"
          experiment="$(jq -r '.experiment' /tmp/chaos-result.json)"
          iterations="$(jq -r '.iterationCount' /tmp/chaos-result.json)"
          completed_iterations="$(jq -r '.completedIterations' /tmp/chaos-result.json)"
          recovery="$(jq -r '.maxRecoveryTimeMs' /tmp/chaos-result.json)"
          recoveries="$(jq -r '.recoveryTimesMs | map(tostring) | join(", ")' /tmp/chaos-result.json)"
          total_recovery="$(jq -r '.totalRecoveryTimeMs' /tmp/chaos-result.json)"
          checks="$(jq -r '.httpChecks' /tmp/chaos-result.json)"
          failures="$(jq -r '.httpFailures' /tmp/chaos-result.json)"
          minimum="$(jq -r '.minimumReadyPods' /tmp/chaos-result.json)"
          maximum="$(jq -r '.maximumReadyPods' /tmp/chaos-result.json)"
          search_before="$(jq -r 'if .searchReachableBefore then "reachable" else "unreachable" end' /tmp/chaos-result.json)"
          search_after="$(jq -r 'if .searchReachableAfter then "reachable" else "unreachable" end' /tmp/chaos-result.json)"
          started="$(jq -r '.experimentStartedAt' /tmp/chaos-result.json)"
          completed="$(jq -r '.completedAt' /tmp/chaos-result.json)"

          {
            echo "### Chaos experiment result"
            echo
            echo "- Result: **${status}**"
            echo "- Experiment: **${experiment}**"
            echo "- Iterations: **${completed_iterations} / ${iterations}**"
            echo "- Recovery times: **${recoveries} ms**"
            echo "- Max recovery: **${recovery} ms**"
            echo "- Total recovery: **${total_recovery} ms**"
            echo "- HTTP checks: **${checks}**"
            echo "- HTTP failures: **${failures}**"
            echo "- Ready pods observed: **${minimum} → ${maximum}**"
            echo "- Search before experiment: **${search_before}**"
            echo "- Search after experiment: **${search_after}**"
            echo "- Started: \`${started}\`"
            echo "- Completed: \`${completed}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$status" != "PASS" ]; then
            exit 1
          fi
