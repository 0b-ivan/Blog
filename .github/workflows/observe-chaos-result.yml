name: Observe first staging chaos experiment

on:
  push:
    branches:
      - staging
    paths:
      - '.github/workflows/observe-chaos-result.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: observe-first-staging-chaos
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      STATUS_URL: https://staging-blog.obivan.org/api/kubernetes-status
      RESULT_PR: "267"
    steps:
      - name: Wait for sanitized chaos result
        id: result
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 72); do
            payload="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' \
              "${STATUS_URL}?chaos=${GITHUB_RUN_ID}" 2>/dev/null || true)"

            result="$(printf '%s' "$payload" | jq -c '
              .lastChaosExperiment
              | select(type == "object")
              | select(.experiment == "single-blog-pod-delete")
              | {
                  experiment,
                  experimentStartedAt,
                  completedAt,
                  recoveryTimeMs,
                  httpChecks,
                  httpFailures,
                  minimumReadyPods,
                  maximumReadyPods,
                  searchReachableBefore,
                  searchReachableAfter,
                  passed
                }
            ' 2>/dev/null || true)"

            if [ -n "$result" ] && [ "$result" != "null" ]; then
              printf '%s\n' "$result" > /tmp/chaos-result.json
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Attempt ${attempt}/72: no sanitized result yet"
            sleep 5
          done

          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Comment result on experiment PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.result.outputs.found }}" != "true" ]; then
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${RESULT_PR}/comments" \
              -f body='### Chaos experiment observer

No sanitized `lastChaosExperiment` result became visible before the observer timeout. The one-shot Job may have aborted during preflight or Flux may not have reconciled it yet.' >/dev/null
            exit 1
          fi

          status="$(jq -r 'if .passed then "PASS" else "FAIL" end' /tmp/chaos-result.json)"
          recovery="$(jq -r '.recoveryTimeMs' /tmp/chaos-result.json)"
          checks="$(jq -r '.httpChecks' /tmp/chaos-result.json)"
          failures="$(jq -r '.httpFailures' /tmp/chaos-result.json)"
          minimum="$(jq -r '.minimumReadyPods' /tmp/chaos-result.json)"
          maximum="$(jq -r '.maximumReadyPods' /tmp/chaos-result.json)"
          search_after="$(jq -r 'if .searchReachableAfter then "reachable" else "unreachable" end' /tmp/chaos-result.json)"
          started="$(jq -r '.experimentStartedAt' /tmp/chaos-result.json)"
          completed="$(jq -r '.completedAt' /tmp/chaos-result.json)"

          body="$(printf '%s\n' \
            '### Chaos experiment result' \
            '' \
            "- Result: **${status}**" \
            "- Recovery: **${recovery} ms**" \
            "- HTTP checks: **${checks}**" \
            "- HTTP failures: **${failures}**" \
            "- Ready pods observed: **${minimum} → ${maximum}**" \
            "- Search after experiment: **${search_after}**" \
            "- Started: \`${started}\`" \
            "- Completed: \`${completed}\`" \
            '' \
            'This comment is generated only from the public sanitized status payload. Pod names, node names and internal addresses are not included.')"

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${RESULT_PR}/comments" \
            -f body="$body" >/dev/null
