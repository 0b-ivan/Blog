name: Observe staging chaos experiment

on:
  push:
    branches:
      - staging
    paths:
      - 'infra/kubernetes/staging/chaos-experiment-*.yaml'
      - '.github/workflows/observe-chaos-result.yml'
  workflow_dispatch:
    inputs:
      completed_after:
        description: 'Optional ISO-8601 lower bound for completedAt'
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: observe-staging-chaos
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STATUS_URL: https://staging-blog.obivan.org/api/kubernetes-status
      MANUAL_COMPLETED_AFTER: ${{ inputs.completed_after || '' }}
    steps:
      - name: Checkout experiment state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect active one-shot experiment
        id: active
        shell: bash
        run: |
          set -euo pipefail
          active_file="$(compgen -G 'infra/kubernetes/staging/chaos-experiment-*.yaml' | head -n 1 || true)"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -z "$active_file" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Experiment manifest was removed; nothing to observe."
            exit 0
          fi
          echo "active=true" >> "$GITHUB_OUTPUT"
          echo "file=$active_file" >> "$GITHUB_OUTPUT"

      - name: Wait for sanitized chaos result
        if: steps.active.outputs.active == 'true'
        id: result
        shell: bash
        run: |
          set -euo pipefail

          completed_after="${MANUAL_COMPLETED_AFTER}"
          if [ -z "$completed_after" ] && [ -n "${{ steps.active.outputs.file }}" ]; then
            completed_after="$(git log --diff-filter=A -1 --format=%cI -- "${{ steps.active.outputs.file }}")"
          fi

          lower_epoch=0
          if [ -n "$completed_after" ]; then
            lower_epoch="$(date -u -d "$completed_after" +%s)"
            echo "Accepting chaos results completed at or after: $completed_after"
          fi

          for attempt in $(seq 1 84); do
            payload="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' \
              "${STATUS_URL}?chaos=${GITHUB_RUN_ID}" 2>/dev/null || true)"

            candidate="$(printf '%s' "$payload" | jq -c '
              .lastChaosExperiment
              | select(type == "object")
              | select(
                  .experiment == "single-blog-pod-delete"
                  or .experiment == "repeated-blog-pod-delete"
                  or .experiment == "search-restart-under-load"
                )
            ' 2>/dev/null || true)"

            result=""
            if [ -n "$candidate" ] && [ "$candidate" != "null" ]; then
              completed_at="$(printf '%s' "$candidate" | jq -r '.completedAt // ""')"
              if [ -n "$completed_at" ]; then
                completed_epoch="$(date -u -d "$completed_at" +%s 2>/dev/null || echo 0)"
                if [ "$lower_epoch" -eq 0 ] || [ "$completed_epoch" -ge "$lower_epoch" ]; then
                  result="$(printf '%s' "$candidate" | jq -c '{

                  experiment,
                  outcome,
                  failureStage,
                  failureReason,
                  experimentStartedAt,
                  completedAt,
                  iterationCount,
                  completedIterations,
                  recoveryTimeMs,
                  recoveryTimesMs,
                  totalRecoveryTimeMs,
                  maxRecoveryTimeMs,
                  kubernetesRecoveryTimeMs,
                  httpChecks,
                  httpFailures,
                  searchChecks,
                  searchFailures,
                  firstSearchFailureMs,
                  searchRecoveredAfterFailureMs,
                  observedSearchOutageMs,
                  minimumReadyPods,
                  maximumReadyPods,
                  searchReachableBefore,
                  searchReachableAfter,
                  passed
                }')"
                fi
              fi
            fi

            if [ -n "$result" ] && [ "$result" != "null" ]; then
              printf '%s\n' "$result" > /tmp/chaos-result.json
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Attempt ${attempt}/84: no matching sanitized result yet"
            sleep 5
          done

          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Publish chaos result summary
        if: steps.active.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.result.outputs.found }}" != "true" ]; then
            echo "No matching sanitized lastChaosExperiment result became visible before the observer timeout." >&2
            exit 1
          fi

          outcome="$(jq -r '.outcome // "completed"' /tmp/chaos-result.json)"
          failure_stage="$(jq -r '.failureStage // ""' /tmp/chaos-result.json)"
          failure_reason="$(jq -r '.failureReason // ""' /tmp/chaos-result.json)"
          status="$(jq -r 'if .passed then "PASS" else "FAIL" end' /tmp/chaos-result.json)"
          experiment="$(jq -r '.experiment' /tmp/chaos-result.json)"
          if [ "$outcome" = "aborted" ]; then
            status="ABORTED"
          fi
          iterations="$(jq -r '.iterationCount' /tmp/chaos-result.json)"
          completed_iterations="$(jq -r '.completedIterations' /tmp/chaos-result.json)"
          recovery="$(jq -r '.maxRecoveryTimeMs' /tmp/chaos-result.json)"
          recoveries="$(jq -r '.recoveryTimesMs | map(tostring) | join(", ")' /tmp/chaos-result.json)"
          total_recovery="$(jq -r '.totalRecoveryTimeMs' /tmp/chaos-result.json)"
          checks="$(jq -r '.httpChecks' /tmp/chaos-result.json)"
          failures="$(jq -r '.httpFailures' /tmp/chaos-result.json)"
          search_checks="$(jq -r '.searchChecks // 0' /tmp/chaos-result.json)"
          search_failures="$(jq -r '.searchFailures // 0' /tmp/chaos-result.json)"
          k8s_recovery="$(jq -r '.kubernetesRecoveryTimeMs // 0' /tmp/chaos-result.json)"
          observed_search_outage="$(jq -r '.observedSearchOutageMs // 0' /tmp/chaos-result.json)"
          minimum="$(jq -r '.minimumReadyPods' /tmp/chaos-result.json)"
          maximum="$(jq -r '.maximumReadyPods' /tmp/chaos-result.json)"
          search_before="$(jq -r 'if .searchReachableBefore then "reachable" else "unreachable" end' /tmp/chaos-result.json)"
          search_after="$(jq -r 'if .searchReachableAfter then "reachable" else "unreachable" end' /tmp/chaos-result.json)"
          started="$(jq -r '.experimentStartedAt' /tmp/chaos-result.json)"
          completed="$(jq -r '.completedAt' /tmp/chaos-result.json)"

          {
            echo "### Chaos experiment result"
            echo
            echo "- Result: **${status}**"
            echo "- Experiment: **${experiment}**"
            if [ "$outcome" = "aborted" ]; then
              echo "- Failure stage: **${failure_stage}**"
              if [ -n "$failure_reason" ]; then
                echo "- Failure reason: **${failure_reason}**"
              fi
            fi
            echo "- Iterations: **${completed_iterations} / ${iterations}**"
            echo "- Recovery times: **${recoveries} ms**"
            echo "- Max recovery: **${recovery} ms**"
            echo "- Total recovery: **${total_recovery} ms**"
            echo "- HTTP checks: **${checks}**"
            echo "- HTTP failures: **${failures}**"
            if [ "$experiment" = "search-restart-under-load" ]; then
              echo "- Search checks: **${search_checks}**"
              echo "- Search failures: **${search_failures}**"
              echo "- Kubernetes recovery: **${k8s_recovery} ms**"
              echo "- Observed Search outage: **${observed_search_outage} ms**"
            fi
            echo "- Ready pods observed: **${minimum} → ${maximum}**"
            echo "- Search before experiment: **${search_before}**"
            echo "- Search after experiment: **${search_after}**"
            echo "- Started: \`${started}\`"
            echo "- Completed: \`${completed}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$status" != "PASS" ]; then
            exit 1
          fi

      - name: Publish machine-readable commit status
        if: always() && steps.active.outputs.active == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          state=failure
          description="No matching sanitized chaos result"

          if [ -f /tmp/chaos-result.json ]; then
            passed="$(jq -r '.passed == true' /tmp/chaos-result.json)"
            outcome="$(jq -r '.outcome // "completed"' /tmp/chaos-result.json)"
            failure_stage="$(jq -r '.failureStage // ""' /tmp/chaos-result.json)"
            failure_reason="$(jq -r '.failureReason // ""' /tmp/chaos-result.json)"
            iterations="$(jq -r '.completedIterations // 0' /tmp/chaos-result.json)"
            planned="$(jq -r '.iterationCount // 0' /tmp/chaos-result.json)"
            max_recovery="$(jq -r '.maxRecoveryTimeMs // .recoveryTimeMs // 0' /tmp/chaos-result.json)"
            failures="$(jq -r '.httpFailures // 0' /tmp/chaos-result.json)"
            experiment="$(jq -r '.experiment // ""' /tmp/chaos-result.json)"
            search_failures="$(jq -r '.searchFailures // 0' /tmp/chaos-result.json)"

            if [ "$outcome" = "aborted" ]; then
              description="ABORTED ${experiment}; ${failure_reason:-$failure_stage}"
            elif [ "$passed" = "true" ]; then
              state=success
              if [ "$experiment" = "search-restart-under-load" ]; then
                description="PASS Search restart; max ${max_recovery}ms; Search failures ${search_failures}; Blog HTTP failures ${failures}"
              else
                description="PASS ${iterations}/${planned}; max ${max_recovery}ms; HTTP failures ${failures}"
              fi
            else
              if [ "$experiment" = "search-restart-under-load" ]; then
                description="FAIL Search restart; max ${max_recovery}ms; Search failures ${search_failures}; Blog HTTP failures ${failures}"
              else
                description="FAIL ${iterations}/${planned}; max ${max_recovery}ms; HTTP failures ${failures}"
              fi
            fi
          fi

          description="${description:0:140}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="chaos-observer" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
