services:
  blog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kernel-notes-blog
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
