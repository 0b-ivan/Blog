name: kernel-notes-obsidian-sync

services:
  couchdb:
    image: couchdb:3
    container_name: kernel-notes-livesync-couchdb
    restart: unless-stopped
    ports:
      # cloudflared runs as a systemd service on the Hetzner host.
      # Keep CouchDB private and expose it only on the host loopback interface.
      - "127.0.0.1:5984:5984"
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?Set COUCHDB_USER in .env}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
    volumes:
      - couchdb-data:/opt/couchdb/data
      # CouchDB's entrypoint chmods files under /opt/couchdb/etc at startup.
      # Keep this writable; the deploy workflow replaces the host file atomically
      # so ownership changes do not break the next deployment.
      - ./config/livesync.ini:/opt/couchdb/etc/local.ini
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf -u ${COUCHDB_USER}:${COUCHDB_PASSWORD} http://localhost:5984/_session | grep -q ok || exit 1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks:
      - livesync

  couchdb-init:
    image: curlimages/curl:latest
    container_name: kernel-notes-livesync-init
    restart: on-failure
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      COUCHDB_INTERNAL_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-kernelnotes}
    volumes:
      - ./scripts/couchdb-init.sh:/couchdb-init.sh:ro
    entrypoint: ["sh", "/couchdb-init.sh"]
    networks:
      - livesync

  livesync-cli:
    # Build the official CLI ourselves instead of depending on anonymous access
    # to the upstream GHCR package. Pin the source to the 1.0.17 release commit.
    build:
      context: "https://github.com/vrtmrz/obsidian-livesync.git#694371898a569442736aa1d3d35bb1198d3c0570"
      dockerfile: src/apps/cli/Dockerfile
    container_name: kernel-notes-livesync-cli
    profiles: [headless]
    restart: unless-stopped
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      LIVESYNC_DB_PATH: /data
    command: ["--vault", "/vault", "daemon"]
    volumes:
      - livesync-cli-data:/data
      - ${OBSIDIAN_VAULT_PATH:-../../posts}:/vault
    networks:
      - livesync

  publisher:
    image: node:24-alpine
    container_name: kernel-notes-obsidian-publisher
    profiles: [publisher]
    restart: unless-stopped
    environment:
      OBSIDIAN_PUBLISHER_GITHUB_TOKEN: ${OBSIDIAN_PUBLISHER_GITHUB_TOKEN:-}
      PUBLISHER_GITHUB_REPOSITORY: ${PUBLISHER_GITHUB_REPOSITORY:-0b-ivan/Blog}
      PUBLISHER_BASE_BRANCH: ${PUBLISHER_BASE_BRANCH:-main}
      PUBLISHER_VAULT_PATH: /vault
      PUBLISHER_DEBOUNCE_SECONDS: ${PUBLISHER_DEBOUNCE_SECONDS:-300}
      PUBLISHER_POLL_SECONDS: ${PUBLISHER_POLL_SECONDS:-30}
    command: ["node", "/app/obsidian-publisher.js"]
    volumes:
      - ./scripts/obsidian-publisher.js:/app/obsidian-publisher.js:ro
      - ${OBSIDIAN_VAULT_PATH:-../../posts}:/vault
    networks:
      - livesync

  glossary-publisher:
    image: node:24-alpine
    container_name: kernel-notes-obsidian-glossary-publisher
    profiles: [publisher]
    restart: unless-stopped
    environment:
      OBSIDIAN_PUBLISHER_GITHUB_TOKEN: ${OBSIDIAN_PUBLISHER_GITHUB_TOKEN:-}
      PUBLISHER_GITHUB_REPOSITORY: ${PUBLISHER_GITHUB_REPOSITORY:-0b-ivan/Blog}
      PUBLISHER_BASE_BRANCH: ${PUBLISHER_BASE_BRANCH:-main}
      PUBLISHER_VAULT_PATH: /vault
      PUBLISHER_DEBOUNCE_SECONDS: ${PUBLISHER_DEBOUNCE_SECONDS:-300}
      PUBLISHER_POLL_SECONDS: ${PUBLISHER_POLL_SECONDS:-30}
    command: ["node", "/app/obsidian-glossary-publisher.js"]
    volumes:
      - ./scripts/obsidian-glossary-publisher.js:/app/obsidian-glossary-publisher.js:ro
      - ${OBSIDIAN_VAULT_PATH:-../../posts}:/vault
    networks:
      - livesync

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kernel-notes-livesync-cloudflared
    profiles: [cloudflare]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Optional unless the cloudflare profile is explicitly enabled.
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on:
      couchdb:
        condition: service_healthy
    networks:
      - livesync

volumes:
  couchdb-data:
    name: kernel-notes-obsidian-couchdb-data
  livesync-cli-data:
    name: kernel-notes-obsidian-livesync-cli-data

networks:
  livesync:
    name: kernel-notes-obsidian-livesync
    driver: bridge
