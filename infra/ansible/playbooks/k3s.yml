---
- name: Prepare blog staging K3s node
  hosts: k3s_servers
  become: true
  gather_facts: true

  vars:
    k3s_install_url: https://get.k3s.io
    k3s_install_channel: stable
    k3s_config_dir: /etc/rancher/k3s

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: "{{ k3s_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure K3s
      ansible.builtin.copy:
        dest: "{{ k3s_config_dir }}/config.yaml"
        owner: root
        group: root
        mode: "0600"
        content: |
          write-kubeconfig-mode: "0640"
          secrets-encryption: true
          node-name: "{{ inventory_hostname }}"
          disable:
            - traefik
            - servicelb
      notify: Restart k3s

    - name: Download official K3s installer
      ansible.builtin.get_url:
        url: "{{ k3s_install_url }}"
        dest: /usr/local/src/install-k3s.sh
        owner: root
        group: root
        mode: "0755"

    - name: Install K3s
      ansible.builtin.command: /usr/local/src/install-k3s.sh
      environment:
        INSTALL_K3S_CHANNEL: "{{ k3s_install_channel }}"
      args:
        creates: /usr/local/bin/k3s

    - name: Ensure K3s is enabled and running
      ansible.builtin.systemd_service:
        name: k3s
        enabled: true
        state: started

    - name: Wait for Kubernetes API
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6443
        timeout: 120

  handlers:
    - name: Restart k3s
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted
