---
- name: Prepare blog staging K3s node
  hosts: k3s_servers
  become: true
  gather_facts: true

  tasks:
    - name: Validate pinned K3s inputs
      ansible.builtin.assert:
        that:
          - k3s_version is match('^v[0-9]+\\.[0-9]+\\.[0-9]+\\+k3s[0-9]+$')
          - k3s_install_script_ref is match('^[0-9a-f]{40}$')
          - k3s_install_url.startswith('https://raw.githubusercontent.com/k3s-io/k3s/')
        fail_msg: K3s version and installer source must be pinned before provisioning.

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - qemu-guest-agent
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure QEMU guest agent is enabled and running
      ansible.builtin.systemd_service:
        name: qemu-guest-agent
        enabled: true
        state: started

    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: "{{ k3s_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure K3s
      ansible.builtin.copy:
        dest: "{{ k3s_config_dir }}/config.yaml"
        owner: root
        group: root
        mode: "0600"
        content: |
          write-kubeconfig-mode: "0640"
          secrets-encryption: true
          node-name: "{{ inventory_hostname }}"
          disable:
            - traefik
            - servicelb
      notify: Restart k3s

    - name: Check currently installed K3s version
      ansible.builtin.command: "{{ k3s_binary_path }} --version"
      register: k3s_current_version
      changed_when: false
      failed_when: false

    - name: Decide whether K3s installation or upgrade is required
      ansible.builtin.set_fact:
        k3s_install_required: >-
          {{
            k3s_current_version.rc != 0
            or k3s_version not in k3s_current_version.stdout
          }}

    - name: Download installer from pinned upstream commit
      ansible.builtin.get_url:
        url: "{{ k3s_install_url }}"
        dest: /usr/local/src/install-k3s.sh
        owner: root
        group: root
        mode: "0755"
        force: true
      when: k3s_install_required

    - name: Install exact K3s version
      ansible.builtin.command: /usr/local/src/install-k3s.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      when: k3s_install_required
      notify: Restart k3s

    - name: Ensure K3s is enabled and running
      ansible.builtin.systemd_service:
        name: k3s
        enabled: true
        state: started

    - name: Wait for Kubernetes API
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6443
        timeout: 120

    - name: Read installed K3s version after provisioning
      ansible.builtin.command: "{{ k3s_binary_path }} --version"
      register: k3s_installed_version
      changed_when: false

    - name: Verify exact pinned K3s version
      ansible.builtin.assert:
        that:
          - k3s_version in k3s_installed_version.stdout
        fail_msg: >-
          Installed K3s version does not match the pinned version
          {{ k3s_version }}.

  handlers:
    - name: Restart k3s
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted
