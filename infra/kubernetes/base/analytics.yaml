apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: analytics-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: analytics
    spec:
      securityContext:
        fsGroup: 65532
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: analytics
          image: ghcr.io/0b-ivan/kernel-notes-blog:UNPINNED
          imagePullPolicy: IfNotPresent
          args:
            - analytics-server.js
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ANALYTICS_DATA_DIR
              value: /data
            - name: ANALYTICS_RETENTION_DAYS
              value: "90"
          volumeMounts:
            - name: analytics-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 192Mi
      volumes:
        - name: analytics-data
          persistentVolumeClaim:
            claimName: analytics-data
---
apiVersion: v1
kind: Service
metadata:
  name: analytics
spec:
  selector:
    app: analytics
  ports:
    - name: http
      port: 8080
      targetPort: http
