apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: blog-staging
resources:
  - ../../base
replicas:
  - name: blog
    count: 1
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: pdf
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: https://staging-blog.obivan.org
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kube-status
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "1"
