apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - blog.yaml
  - cloudflared.yaml
  - secrets/ghcr-pull.sops.yaml
  - secrets/cloudflared-token.sops.yaml
images:
  - name: cloudflare/cloudflared
    newTag: 2026.9.1
  - name: ghcr.io/0b-ivan/kernel-notes-blog
    newTag: 704a58ff48691d579c7e6d56a7e256787e1b2ecd
  - name: ghcr.io/0b-ivan/kernel-notes-search
    newTag: 704a58ff48691d579c7e6d56a7e256787e1b2ecd
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: blog
      namespace: blog-staging
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args
        value:
          - staging-server.js
