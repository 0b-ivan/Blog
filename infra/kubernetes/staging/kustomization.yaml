apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - blog.yaml
  - app
  - cloudflared.yaml
  - production-flux.yaml
  - secrets/ghcr-pull.sops.yaml
  - secrets/cloudflared-token.sops.yaml
images:
  - name: cloudflare/cloudflared
    newTag: 2026.9.1
  - name: ghcr.io/0b-ivan/kernel-notes-blog
    newTag: d359f23bd0314f099579742a6054df41d761a81d
  - name: ghcr.io/0b-ivan/kernel-notes-search
    newTag: d359f23bd0314f099579742a6054df41d761a81d
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: blog
      namespace: blog-staging
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args
        value:
          - staging-server.js
