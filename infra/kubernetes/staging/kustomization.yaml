apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - blog.yaml
  - app
  - cloudflared.yaml
  - chaos-monkey.yaml
  - chaos-mesh.yaml
  - production-flux.yaml
  - secrets/ghcr-pull.sops.yaml
  - secrets/cloudflared-token.sops.yaml
images:
  - name: cloudflare/cloudflared
    newTag: 2026.9.1
  - name: ghcr.io/0b-ivan/kernel-notes-blog
    newTag: ebd14d36a50fb7ee0903f4cc52e6658058073eb4
  - name: ghcr.io/0b-ivan/kernel-notes-search
    newTag: ebd14d36a50fb7ee0903f4cc52e6658058073eb4
  - name: ghcr.io/0b-ivan/kernel-notes-status
    newTag: ebd14d36a50fb7ee0903f4cc52e6658058073eb4
  - name: ghcr.io/0b-ivan/kernel-notes-chaos
    newTag: ebd14d36a50fb7ee0903f4cc52e6658058073eb4
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: blog
      namespace: blog-staging
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args
        value:
          - staging-server.js
      - op: add
        path: /spec/template/metadata/labels/chaos.obivan.org~1enabled
        value: "true"
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: search
      namespace: blog-staging
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/chaos.obivan.org~1enabled
        value: "true"

