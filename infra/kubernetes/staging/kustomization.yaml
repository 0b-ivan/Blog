apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - blog.yaml
  - cloudflared.yaml
images:
  - name: cloudflare/cloudflared
    newTag: 2026.9.1
  - name: ghcr.io/0b-ivan/kernel-notes-blog
    newTag: a02d1331bbbb7760ec8dcd8f1d560b204daa060a
  - name: ghcr.io/0b-ivan/kernel-notes-search
    newTag: a02d1331bbbb7760ec8dcd8f1d560b204daa060a
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: blog
      namespace: blog-staging
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args
        value:
          - staging-server.js
