apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: blog-production
resources:
  - namespace.yaml
  - ../base
images:
  - name: ghcr.io/0b-ivan/kernel-notes-blog
    newTag: 227fbe6f417799ab1ff8928dc6820910861a3bfb
  - name: ghcr.io/0b-ivan/kernel-notes-search
    newTag: 227fbe6f417799ab1ff8928dc6820910861a3bfb
  - name: ghcr.io/0b-ivan/kernel-notes-status
    newTag: UNPINNED
replicas:
  - name: blog
    count: 3

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: search
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
