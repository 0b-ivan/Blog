apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: blog-production
resources:
  - namespace.yaml
  - ../base
images:
  - name: ghcr.io/0b-ivan/kernel-notes-blog
    newTag: 5813d0bd1021fa03ef5988ab1975af41d523d635
  - name: ghcr.io/0b-ivan/kernel-notes-search
    newTag: 50a1ffe310870db53bcc6497641e20d71c695475
  - name: ghcr.io/0b-ivan/kernel-notes-pdf
    newTag: 7c16be0aebcf65c86c5ee180e77d53f44d3ce6da
  - name: ghcr.io/0b-ivan/kernel-notes-status
    newTag: 7806d419b019ec0ff1721eea9a7fd3dede094fee
  - name: ghcr.io/0b-ivan/kernel-notes-content
    newTag: a5b833a764d8b81d95b4c1d2d59b422f4d99ae3e
replicas:
  - name: blog
    count: 3

patches:
  - path: content-blog-patch.yaml
  - path: content-search-patch.yaml
  - path: content-pdf-patch.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: search
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
            maxSurge: 0
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
