apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: blog-production
resources:
  - namespace.yaml
  - ../base
images:
  - name: ghcr.io/0b-ivan/kernel-notes-blog
    newTag: f827f3b2b78cbb6b2a9a3f2c0fc109a1606ea719
  - name: ghcr.io/0b-ivan/kernel-notes-search
    newTag: f827f3b2b78cbb6b2a9a3f2c0fc109a1606ea719
  - name: ghcr.io/0b-ivan/kernel-notes-status
    newTag: f827f3b2b78cbb6b2a9a3f2c0fc109a1606ea719
replicas:
  - name: blog
    count: 3

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: search
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
